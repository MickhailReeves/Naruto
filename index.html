    ${mine?sc.c.map((c,i)=>{
      const votes=party.filter(q=>J.votes&&J.votes[q.seat]===i).length;
      const best=Math.max(...party.map(q=>q[c.s]));
      return `<button class="qopt ${myVote===i?"hint":""}" onclick="jointVote(${i})" ${myVote!==undefined?"disabled":""}>
        ${esc(c.l)}${votes?` <b class="gold">${votes} vote${votes===1?"":"s"}</b>`:""}
        <span style="display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-top:4px">
        ${STATKEYS.find(x=>x[0]===c.s)[1]} \u00b7 needs ${c.n} \u00b7 team best ${Math.round(best)}</span></button>`}).join("")
      :`<div class="note">${esc(party.map(q=>q.name).join(", "))} are out on this one.</div>`}
    ${myVote!==undefined?`<div class="note" style="margin-top:8px">Your vote is in. Waiting on ${
      esc(party.filter(q=>J.votes[q.seat]===undefined).map(q=>q.name).join(", ")||"the tally")}.</div>`:""}
  </div></div>`;
}
function jointVote(i){
  const J=JOINT();if(!J||!J.started)return;
  const seat=mySeat();
  if(!jointInvolvesMe())return;
  if(J.votes[seat]!==undefined)return;
  J.votes[seat]=i;
  touch();render();
  if(jointParty().every(q=>J.votes[q.seat]!==undefined))setTimeout(jointTally,500);
}
function jointTally(){
  const J=JOINT();if(!J||!J.started)return;
  const party=jointParty(),sc=J.scenes[J.i];
  if(!party.every(q=>J.votes[q.seat]!==undefined))return;
  const count={};
  party.forEach(q=>{const v=J.votes[q.seat];count[v]=(count[v]||0)+1});
  const top=Math.max(...Object.values(count));
  const tied=Object.keys(count).filter(k=>count[k]===top).map(Number);
  const pickIdx=tied.length>1?pick(tied):tied[0];
  const c=sc.c[pickIdx];
  const tie=tied.length>1;
  // the team is tested on its strongest member for that approach, with a nudge for agreement
  const best=Math.max(...party.map(q=>q[c.s]));
  const unity=count[pickIdx]/party.length;
  const roll=best+Math.round((unity-0.5)*18)+rnd(-8,14);
  const pass=roll>=c.n;
  if(tie)say(`The team split ${tied.map(t=>count[t]).join(" to ")}. It came down to a coin.`,"Squad");
  if(pass){
    J.pts+=c.p||1;
    say(`Joint ${J.tier}-rank, ${sc.t.toLowerCase()}: ${c.g}`,"Squad","good");
    party.forEach(q=>{bump(q,c.s,1)});
    const t0=teamOf(party[0]);
    if(unity===1)party.forEach(q=>setBond(teamOf(q),bondOf(teamOf(q))+2));
  }else{
    say(`Joint ${J.tier}-rank, ${sc.t.toLowerCase()}: it went wrong, and everyone had a hand in choosing it.`,"Squad","bad");
    party.forEach(q=>{wound(q,rnd(7,16),null,`Died on a joint ${J.tier}-rank.`)});
  }
  J.votes={};J.i++;
  if(party.some(q=>q.dead)){jointFinish();return}
  if(J.i>=J.scenes.length){jointFinish();return}
  touch();render();
}
function jointFinish(){
  const J=JOINT();if(!J)return;
  const party=jointParty().filter(q=>!q.dead);
  const m=MISSIONS.find(x=>x.r===J.tier)||MISSIONS[0];
  const max=J.scenes.reduce((a,s)=>a+Math.max(...s.c.map(c=>c.p||1)),0);
  const ok=J.pts>=Math.ceil(max*0.5);
  if(ok){
    // more mouths, more money, but not linearly: the split stays worth showing up for
    const each=Math.round(m.pay*(1.5+0.25*(party.length-2))*(1+J.pts/max*0.35)*budget("eco"));
    party.forEach(q=>{
      q.ryo+=each;bump(q,"rep",m.rep*1.6);q.missions++;
      STATKEYS.forEach(([k])=>{if(chance(.45))bump(q,k,rnd(1,3))});
      setBond(teamOf(q),bondOf(teamOf(q))+6);
    });
    say(`Joint ${J.tier}-rank complete, ${J.pts} of ${max} stages clean. ${each} ryo each to ${party.map(q=>q.name).join(", ")}.`,"Squad","big");
  }else{
    party.forEach(q=>{bump(q,"rep",-m.rep*0.7);q.missions++;setBond(teamOf(q),bondOf(teamOf(q))-5)});
    say(`The joint ${J.tier}-rank failed. Everyone came home and nobody is speaking.`,"Squad","bad");
  }
  // the cost of going: a short year afterwards
  jointParty().forEach(q=>{q.apDebt=1});
  S.joint=null;touch();render();
}


/* =====================================================================
   MARRIED LIFE
   A marriage that only ever produced children was not worth the screen it
   took up. It has a state of its own now: how well the two of you are
   actually doing, what you are trying for, and what it costs when the work
   keeps winning.
   ===================================================================== */
function MAR(p){
  if(!p.marriage)p.marriage={harmony:70,years:0,trying:false,retired:false,vows:null,anniv:0};
  return p.marriage;
}
function harmonyWord(h){
  return h>=85?"as good as it has ever been":h>=65?"steady":h>=45?"strained but standing"
    :h>=25?"badly frayed":"barely a marriage at all";
}
const VOWS=[
 {id:"family",n:"Raise a family",d:"Children come easier, and they start life better looked after.",b:"kids"},
 {id:"work",n:"Back each other's careers",d:"Renown climbs faster for you both. Harmony slips more easily.",b:"rep"},
 {id:"quiet",n:"Build something quiet",d:"You recover faster between years and the marriage weathers more.",b:"cond"}
];
function menuMarried(){
  const p=me(),M=MAR(p),c=p.partner;
  const body=`<div class="card" style="margin-bottom:10px">
      <div style="display:flex;gap:11px;align-items:center">
        ${portrait({look:c.look||defaultLook(),village:c.village,rogue:false,kgs:[],age:p.age},54)}

        <div class="eyebrow">${esc(VILLAGES[c.village].en)} \u00b7 ${esc(CLANS[c.clan].n)} \u00b7 ${NATICON[c.nat]} ${c.nat}</div>
        <div class="dim" style="font-size:13px;margin-top:3px">${esc(c.trait)}</div></div>
      </div>
      <div class="rule"></div>
      ${bar("How you are doing",M.harmony,100,M.harmony>=65?"gr":M.harmony>=35?"g":"r")}
      <div class="note">${esc(M.years)} year${M.years===1?"":"s"} married, and things are ${esc(harmonyWord(M.harmony))}.
        ${M.vows?" You agreed early on to "+esc(VOWS.find(v=>v.id===M.vows).n.toLowerCase())+".":""}
        ${M.retired?" They stopped taking field work."+"":""}</div>
      ${(p.kids||[]).length?`<div style="margin-top:8px">${p.kids.map(k=>`<span class="chip gr">\uD83D\uDC76 ${esc(k.name)}, ${k.age}</span>`).join("")}</div>`:""}
    </div>`;
  let btns="";
  btns+=`<button class="act" onclick="marAct('time')"><span class="ic">\uD83C\uDF19</span><span class="tx">
    <b>Spend real time together</b><span>The thing that actually holds it up</span></span></button>`;
  btns+=`<button class="act ${M.trying?"bgr":""}" onclick="marAct('baby')"><span class="ic">\uD83D\uDC76</span><span class="tx">
    <b>${M.trying?"Keep trying for a child":"Try for a child"}</b>
    <span>${babyOdds(p)>0?Math.round(babyOdds(p)*100)+"% this year, better when things are good between you":"Not while things are like this"}</span></span></button>`;
  if(!M.vows)btns+=`<button class="act bkey" onclick="marAct('vows')"><span class="ic">\uD83E\uDD1D</span><span class="tx">
    <b>Decide what this marriage is for</b><span>Sets a direction that lasts the rest of it</span></span></button>`;
  if(!M.retired)btns+=`<button class="act" onclick="marAct('retire')"><span class="ic">\uD83C\uDFE0</span><span class="tx">
    <b>Ask them to leave the field</b><span>Far safer for them. They will not love being asked.</span></span></button>`;
  if(M.harmony<50)btns+=`<button class="act bcy" onclick="marAct('mend')"><span class="ic">\uD83E\uDE79</span><span class="tx">
    <b>Try to put it right</b><span>Long conversation, no guarantees</span></span></button>`;
  if(M.years>=1&&M.anniv<M.years)btns+=`<button class="act bkey" onclick="marAct('anniv')"><span class="ic">\uD83C\uDF8B</span><span class="tx">
    <b>Mark the anniversary properly</b><span>Once a year, and it counts for a lot</span></span></button>`;
  if(M.harmony<25)btns+=`<button class="act bdanger" onclick="marAct('end')"><span class="ic">\uD83D\uDC94</span><span class="tx">
    <b>End it</b><span>Neither of you would be the first</span></span></button>`;
  modal("At home",c.name,body,btns+`<button onclick="closeModal()">Back</button>`,mySeat());
}
function babyOdds(p){
  const M=MAR(p);
  if(!M.trying)return 0;
  if(p.age>52)return 0.02;
  // a marriage in trouble is not one that is trying successfully
  let o=0.06+M.harmony*0.0042-(p.kids||[]).length*0.05;
  if(M.vows==="family")o+=0.10;
  if(M.harmony<40)o*=0.45;
  if(p.age>42)o*=0.5;
  return clamp(o,0.01,0.46);
}
function marAct(kind){
  const p=me(),M=MAR(p),c=p.partner;closeModal();
  if(kind==="time"){
    const g=rnd(8,16);M.harmony=clamp(M.harmony+g,0,100);
    p.cond=clamp(p.cond+8,0,maxCond(p));
    say(pick([`A whole evening with ${c.name} and nothing urgent in it.`,
      `You and ${c.name} walked the long way home and talked about nothing.`,
      `${c.name} cooked badly and neither of you cared.`])+` Things are ${harmonyWord(M.harmony)}.`,p.name,"good");
  }
  else if(kind==="baby"){
    M.trying=true;
    if(chance(babyOdds(p))){haveChild(p);M.harmony=clamp(M.harmony+10,0,100);M.trying=false}
    else{M.harmony=clamp(M.harmony+3,0,100);
      say(`Not this year. ${c.name} said the same thing you were thinking, which helped.`,p.name);}
  }
  else if(kind==="vows"){
    modal("A conversation","What is this marriage for?",
      `<p class="dim">You will both live by whatever you decide here.</p>`,
      VOWS.map(v=>`<button class="act" onclick="setVows('${v.id}')"><span class="ic">\u276F</span><span class="tx">
        <b>${esc(v.n)}</b><span>${esc(v.d)}</span></span></button>`).join(""),mySeat());
    return;
  }
  else if(kind==="retire"){
    if(chance(clamp(M.harmony/120,0.15,0.85))){
      M.retired=true;M.harmony=clamp(M.harmony-6,0,100);
      say(`${c.name} agreed to come off the active roster. They were quiet about it for a week.`,p.name,"good");
    }else{
      M.harmony=clamp(M.harmony-14,0,100);
      say(`${c.name} said no, and said it in a way you will be thinking about for a while.`,p.name,"bad");
    }
  }
  else if(kind==="mend"){
    if(chance(0.55+p.intel*0.002)){
      M.harmony=clamp(M.harmony+22,0,100);
      say(`You said the thing you had been avoiding saying. ${c.name} said theirs. It is better than it was.`,p.name,"big");
    }else{
      M.harmony=clamp(M.harmony-8,0,100);
      say(`It turned into the same argument from a different direction.`,p.name,"bad");
    }
  }
  else if(kind==="anniv"){
    M.anniv=M.years;
    M.harmony=clamp(M.harmony+18,0,100);
    p.cond=clamp(p.cond+12,0,maxCond(p));
    bump(p,"rep",2);
    say(`${M.years} years. You marked it properly this time, and ${c.name} noticed that you had remembered.`,p.name,"big");
  }
  else if(kind==="end"){
    say(`${p.name} and ${c.name} stopped pretending. It was not dramatic and that was almost the worst of it.`,p.name,"bad");
    p.married=false;p.partner=null;p.marriage=null;bump(p,"rep",-4);
    p.cond=clamp(p.cond-10,0,100);
  }
  touch();spend(p,1);
}
function setVows(id){
  const p=me(),M=MAR(p);closeModal();
  M.vows=id;M.harmony=clamp(M.harmony+8,0,100);
  const v=VOWS.find(x=>x.id===id);
  say(`You and ${p.partner.name} agreed on what you are building: ${v.n.toLowerCase()}.`,p.name,"big");
  touch();spend(p,1);
}
/* Each year a marriage drifts if it is neglected, and pays out if it is not. */
function marriageYear(p){
  if(!p.married||!p.partner)return;
  const M=MAR(p);
  M.years++;
  const drift=rnd(2,6)-(M.vows==="quiet"?2:0);
  M.harmony=clamp(M.harmony-drift,0,100);
  if(M.vows==="work"&&M.harmony>=50)bump(p,"rep",2);
  if(M.vows==="quiet")p.cond=clamp(p.cond+6,0,maxCond(p));
  if(M.harmony>=80&&chance(.35))p.cond=clamp(p.cond+8,0,maxCond(p));
  if(M.trying&&chance(babyOdds(p)*0.5)){haveChild(p);M.trying=false}
  if(M.harmony<=10&&chance(.16)){
    say(`${p.partner.name} left. There was no single moment you could point at.`,p.name,"bad");
    p.married=false;p.partner=null;p.marriage=null;bump(p,"rep",-3);
    return;
  }
  if(M.harmony>=70&&M.years%10===0)
    say(`${M.years} years with ${p.partner.name}, and it is still ${harmonyWord(M.harmony)}.`,p.name,"good");
}

  if(S.bm.year!==S.year)rollMarket();

function rollMarket(){
  const n=rnd(3,5);
  const pool=BMSTOCK.slice();
  const stock=[];
  // rarer goods show up less often
  for(let i=0;i<n&&pool.length;i++){
    const w=[];pool.forEach(x=>{for(let k=0;k<(7-x.rare);k++)w.push(x)});
    const chosen=pick(w);
    pool.splice(pool.indexOf(chosen),1);
    stock.push({id:chosen.id,mark:Math.round((0.8+Math.random()*0.5)*100)/100});
  }
  S.bm={year:S.year,stock,heat:(S.bm&&S.bm.year===S.year-1?S.bm.heat:0)};
}

    const it=bmItem(e.id),price=bmPrice(p,e),risk=bmRisk(p,e),owned=it.own(p);
    return `<button class="act ${owned?"":"bdanger"}" onclick="bmBuy(${i})" ${owned||p.ryo<price?"disabled":""}>
      <span class="ic">${it.ic}</span><span class="tx"><b>${esc(it.n)}</b>
      <span>${esc(it.d)}</span>
      <span style="margin-top:4px">\u00a5${price} \u00b7 ${Math.round(risk*100)}% chance it goes wrong${
        owned?" \u00b7 you already have this":p.ryo<price?" \u00b7 you cannot afford it":""}</span></span></button>`;
  }).join("");
  modal("The black market","Stock changes every year",body,
    btns+`<button onclick="closeModal()">Walk out</button>`,mySeat());
}
function bmBuy(i){
  const p=me(),M=BM(),e=M.stock[i];closeModal();
  if(!e)return;
  const it=bmItem(e.id),price=bmPrice(p,e),risk=bmRisk(p,e);
  if(p.ryo<price||it.own(p))return;
  p.ryo-=price;
  M.heat=Math.min(8,(M.heat||0)+1);
  // the deal itself
  const line=it.buy(p);
  say(`${p.name} bought ${it.n.toLowerCase()} for ${price} ryo. ${line}`,p.name,"good");
  // and then whether anybody was watching
  if(chance(risk)){
    if(chance(.62)){
      const fine=Math.round(price*(0.55+Math.random()*0.6))+rnd(1500,5000);
      const paid=Math.min(p.ryo,fine);
      p.ryo-=paid;bump(p,"rep",-6);p.karma-=3;
      M.heat=Math.min(8,M.heat+2);
      say(`Somebody was watching the stall. ${p.name} was fined ${paid} ryo${paid<fine?" and cannot pay the rest":""}, and the village has it on file.`,p.name,"bad");
    }else{
      p.arrested=1;p.apDebt=(p.apDebt||0)+3;      // the whole of next year
      bump(p,"rep",-10);p.karma-=4;
      M.heat=Math.min(8,M.heat+3);
      say(`It was a sting. ${p.name} spent the next year in a holding cell answering the same four questions.`,p.name,"bad");
    }
  }
  touch();spend(p,1);
}

/* ------------------------- TURN LOOP ------------------------- */
function allEnded(){for(let i=0;i<NP();i++)if(!S.ended[i])return false;return NP()>0}
/* Let the room move on when somebody has clearly gone. */
function skipSeat(i){
  if(!online()||!isAway(i))return;
  S.ended[i]=true;
  say(`${S.P[i]?S.P[i].name:"Seat "+(i+1)} was skipped for this year. They had not been seen in a while.`,"Registry","bad");
  NET.bothSince=0;
  // roll the year locally first: pushState merges the remote copy, which still
  // has this seat unfinished, and would undo the skip
  if(allEnded()&&!locked())advanceYear();
  render();
  pushState();
}
function switchSeat(d){
  if(online())return;
  const n=NP();if(n<2)return;
  let t=S.turn;
  for(let k=0;k<n;k++){t=(t+(d||1)+n)%n;if(!S.ended[t])break}
  S.turn=t;render();
}
function endTurn(){
  const seat=mySeat();
  S.ended[seat]=true;
  if(!online()){
    const n=NP();
    for(let k=1;k<=n;k++){const t=(seat+k)%n;if(!S.ended[t]){S.turn=t;render();return}}
    advanceYear();return;
  }
  render();
  pushState().then(()=>{pullState()});
}
function advanceYear(){
  S.year++;
  S.ended=[];for(let i=0;i<NP();i++)S.ended.push(false);
  S.turn=0;
  S.P.forEach(p=>{
    if(p.dead)return;
    p.age++;
    p.ap=Math.max(0,3-(p.apDebt||0));
    p.apDebt=Math.max(0,(p.apDebt||0)-3);         // a cell costs a whole year, a joint job one action
    if(p.arrested&&p.ap>0)p.arrested=0;
    p.evt=chance(.30);
    marriageYear(p);
    if(p.cool)Object.keys(p.cool).forEach(k=>{p.cool[k]--;if(p.cool[k]<=0)delete p.cool[k]});
    if(p.rank>=1&&!p.squad)assignSquad(p);
    if(p.age>=8&&!p.rival)assignRival(p);
    if(p.rival&&p.rival.alive)p.rival.pw+=rnd(4,14);
    if(p.destiny&&p.flags.destinyHidden&&p.age>=12&&chance(.25)){revealDestiny(p);balanceDestiny()}
    if(p.age>38){ // the body goes first, the head goes last
      if(chance(.55))bump(p,"speed",-rnd(1,2));
      if(chance(.45))bump(p,"tai",-rnd(1,2));
      if(chance(.5))bump(p,"intel",rnd(0,1));
    }
    const heal=7+p.health*0.20+(p.clan==="uzumaki"?10:0)+(p.clan==="senju"?6:0)+(p.sage?5:0);
    p.cond=clamp(p.cond+heal,0,maxCond(p));
    p.kids.forEach(k=>k.age++);
    if(p.married&&chance(.18)&&p.kids.length<4)haveChild(p);
    if(p.beast&&p.bond<20&&chance(.10))rampage(p);
    if(p.rogue&&chance(.20))say("A hunter squad was sighted two valleys over. You moved camp again.",p.name);
    if(p.age>48&&chance(.14))wound(p,rnd(4,14),"An old injury flares up.","The body stopped keeping up.");
    if(S.war.on&&!p.rogue&&chance(.35))casualty(p);
    const longLived=(p.clan==="uzumaki"?22:0)+(p.clan==="senju"?12:0)+(p.sage?8:0);
    if(p.age>60+longLived&&chance((p.age-60-longLived)*0.035))kill(p,"Died of old age, in bed, which almost nobody in this line manages.");
  });
  eleMaybeOpen(); eleTick();
  // war ticks down, or breaks out
  if(S.war.on){S.war.left--;if(S.war.left<=0)endWar()}
  else if((S.war.peace|0)>0){S.war.peace--}
  else if(chance(.022))declareWar(S.P[0],pick(["a disputed border post","a caravan that was carrying more than silk",
    "a treaty everyone had stopped reading","an heir who did not come home from a summit"]));
  S.missionYear={};S.coop.done={};
  if(S.P.every(p=>p.dead)){render();save();touch();return}
  say(`Year ${S.year}.`,"Registry");
  render();save();touch();
}

    <span class="tx"><b>${esc(k.name)} ${esc(CLANS[k.clan].n)}</b>
    <span>starts at age ${Math.max(6,k.age)} \u00b7 ${NATICON[k.nat]} ${k.nat} \u00b7 +${heirBonus(p)} inherited${
      (k.blood||[]).length?" \u00b7 carries "+k.blood.map(id=>KG[id].n).join(", "):""}</span></span></button>`).join("");
  btns+=`<button class="act bpu" onclick="reincarnate()"><span class="ic">\u267E\uFE0F</span><span class="tx">
    <b>Reincarnate</b><span>Everything wiped. Permanent +${(houseOf(p).prestige+1)*8}% growth for this line, forever</span></span></button>`;
  btns+=`<button class="act" onclick="newLife(false)"><span class="ic">\uD83C\uDF31</span><span class="tx"><b>A new life in ${esc(vilOf(p).en)}</b>
    <span>Fresh birth, fresh clan roll, nothing carried over</span></span></button>`;
  btns+=`<button class="act" onclick="newLife(true)"><span class="ic">\uD83D\uDDFA\uFE0F</span><span class="tx"><b>A new life somewhere else</b>
    <span>Pick a different village and roll again</span></span></button>`;
  modal("The record continues","What happens to the name?",
    `<p>${esc(p.name)} died a ${esc(rankName(p))} at ${p.age}${p.beast?", and the beast is loose again":""}.</p>
     ${kids.length?`<p class="dim">You have ${kids.length} ${kids.length===1?"child":"children"}. Continuing as one of them keeps the clan, the bloodlines and some of what you taught.</p>`
       :`<p class="dim">You left no children, so the line stops here and a new one starts.</p>`}
     ${p.killedBy?`<div class="ribbon r">${esc(p.killedBy)} killed you. A child who takes up the name fights them at double strength.</div>`:""}`,
    btns,p.seat);
}
function heirBonus(p){return Math.round(power(p)/22)}
function takeHeir(i){
  const old=me(),k=old.kids[i];
  closeModal();
  const np=buildPlayer(old.seat,k.name,chance(.5)?"Male":"Female",k.village,{clan:k.clan,nat:k.nat,blood:k.blood||[]});
  if(old.killedBy)np.avenge={name:old.killedBy,parent:old.name};
  np.age=Math.max(6,k.age);np.life=old.life+1;
  np.ancestors=(old.ancestors||[]).concat([{name:old.name,rank:rankName(old),power:power(old),age:old.age,clan:old.clan}]);
  const b=heirBonus(old);
  STATKEYS.forEach(([s])=>bump(np,s,b/STATKEYS.length*1.6));
  np.ryo=Math.round(old.ryo*0.6)+400;
  if(old.beast){delete S.taken[old.beast]}
  S.P[old.seat]=np;
  say(`${np.name} takes up the ${CLANS[np.clan].n} name at ${np.age}. ${old.name}'s teaching shows in the way they stand.`,np.name,"big");
  if(np.ap===undefined)np.ap=3;
  np.ap=3;touch();render();
}
function newLife(chooseVillage){
  const old=me();
  if(chooseVillage){
    closeModal();
    modal("A new birth","Where does the next one start?","",
      Object.keys(VILLAGES).map(v=>`<button class="act" onclick="doNewLife('${v}')"><span class="ic">${NATICON[VILLAGES[v].nat]}</span>
        <span class="tx"><b>${esc(VILLAGES[v].en)}</b><span>${esc(VILLAGES[v].n)}</span></span></button>`).join(""),old.seat);
    return;
  }
  doNewLife(old.village);
}
function doNewLife(v){
  const old=me();closeModal();
  const np=buildPlayer(old.seat,npcName(),chance(.5)?"Male":"Female",v,null);
  np.life=old.life+1;
  np.ancestors=(old.ancestors||[]).concat([{name:old.name,rank:rankName(old),power:power(old),age:old.age,clan:old.clan}]);
  if(old.beast)delete S.taken[old.beast];
  S.P[old.seat]=np;rollBeast(np);
  say(`A new file opens. ${np.name} of ${VILLAGES[v].en}, ${CLANS[np.clan].n} blood, ${np.nat} nature.`,np.name,"big");
  np.ap=3;touch();render();
}

/* ------------------------- RESET BY AGREEMENT ------------------------- */
function proposeReset(){
  const p=me();
  modal("Reset","Send both files back to the start?",
    `<p>The other player has to agree. When they do, both of you go back to age 6 in a fresh life.</p>
     <p class="dim">You may keep your clan and chakra nature, or roll new ones. They choose for themselves.</p>`,
    `<button class="act bkey" onclick="sendReset(true)"><span class="ic">\uD83E\uDDEC</span><span class="tx"><b>Reset and keep my ${esc(clanOf(p).n)} blood and ${esc(p.nat)} nature</b></span></button>
     <button class="act" onclick="sendReset(false)"><span class="ic">\uD83C\uDFB2</span><span class="tx"><b>Reset and roll everything again</b></span></button>
     <button onclick="closeModal()">Cancel</button>`,mySeat());
}
function sendReset(keep){
  closeModal();
  S.resetReq={by:S.turn,keep:{}};

function viewReset(){
  const R=S.resetReq,me=online()?NET.seat:null;
  const other=1-R.by;
  const mine=online()?(me===other):true;
  const askName=S.P[R.by]?S.P[R.by].name:"The other player";

    return `<div class="veil"><div class="modal center"><div class="tag">Reset proposed</div>

      <p class="dim">Both files reset only if they agree.</p>

      <button class="act" onclick="acceptReset(false)"><span class="ic">\uD83C\uDFB2</span><span class="tx"><b>Agree, and roll everything again</b></span></button>

function cancelReset(){S.resetReq=null;say("The reset proposal was withdrawn.","Registry");touch();render()}
function declineReset(){S.resetReq=null;say("The reset was refused. The chronicle continues.","Registry","bad");touch();render()}
function acceptReset(keep){
  const R=S.resetReq;if(!R)return;
  if(online()&&NET.seat===R.by)return;
  const other=online()?NET.seat:(R.by+1)%NP();
  R.keep[other]=keep;
  const fresh=S.P.map((p,i)=>{
    const k=R.keep[i]?{clan:p.clan,nat:p.nat}:null;
    const np=buildPlayer(i,R.keep[i]?p.name:npcName(),p.gender,p.village,k);
    np.life=p.life+1;np.ap=3;

  });
  S.taken={};S.P=fresh;S.P.forEach(p=>rollBeast(p));
  S.year=1;S.turn=0;S.ended=[];for(let i=0;i<NP();i++)S.ended.push(false);S.resetReq=null;S.battle=null;S.exam=null;NET.pending=null;
  S.coop={bond:20,done:{}};S.bond={};
  say("Both files reset. Age 6, Academy, everything back on the table.","Registry","big");
  S.P.forEach(p=>say(`${p.name} of ${vilOf(p).en}. ${clanOf(p).n} blood, ${p.nat} nature.`,p.name,"big"));

}

/* ------------------------- LEGACY ------------------------- */
function legacy(p){
  return Math.round(power(p)*1.2+p.rep*3+p.rank*45+p.titles.length*18+p.jutsu.length*12
   +(kgTotal(p)*45)+(p.sage?90:0)+(p.sixpaths?260:0)+(p.destiny?60:0)+(houseOf(p).prestige*50)+(houseOf(p).scroll.length*20)+(p.beast?BEASTS[p.beast].t*12+p.bond:0)
   +p.wins*25-p.losses*8+p.missions*4+(p.rogue?p.rogueRank*35:0)+((p.life-1)*40)+p.kids.length*15);
}
function viewLegacy(){
  if(!S.recorded){S.recorded=1;S.P.forEach(q=>saveRecord(q))}
  const sc=S.P.map(p=>({p,s:legacy(p)}));
  const ranked=sc.slice().sort((a,b)=>b.s-a.s);
  const win=ranked[0];
  const byTeam={};
  sc.forEach(x=>{const t=teamOf(x.p);byTeam[t]=(byTeam[t]||0)+x.s});
  const teams=teamsList();
  return `<div>
    <div class="eyebrow">Files closed \u00b7 ${NP()} player${NP()===1?"":"s"} \u00b7 ${
      S.mode==="duo"?"Duo record":S.mode==="coop"?"Co-op record":S.mode==="solo"?"Solo record":"Rival record"}</div>
    <h1><span class="tt">THE RECORD</span><br>STANDS</h1>
    <div class="grid ${NP()>2?"g3":"g2"}" style="margin-top:16px">
      ${ranked.map(({p,s},k)=>`<div class="card ${p.sixpaths?"sixpaths":p.sage?"pcard":"glow"}">
        <div style="display:flex;gap:11px;align-items:center">
          ${portrait(p,64)}
          <div style="min-width:0;flex:1"><h2 style="margin:0">${esc(p.name)}</h2>
            <div class="eyebrow">${NP()>1?"#"+(k+1)+" \u00b7 ":""}${esc(vilOf(p).n)} \u00b7 ${esc(clanOf(p).n)} \u00b7 ${NATICON[p.nat]} ${p.nat}</div></div>
        </div>
        <div class="rule"></div>
        <div class="num tt" style="font-size:34px;font-weight:900;line-height:1">${s}</div>
        <div class="eyebrow">Legacy score</div>
        <div class="rule"></div>
        <div class="kv"><span>Final standing</span><span>${esc(rankName(p))}</span></div>
        <div class="kv"><span>Age</span><span>${p.age}${p.dead?" (deceased)":""}</span></div>
        <div class="kv"><span>Lives lived</span><span>${p.life}</span></div>
        <div class="kv"><span>Missions</span><span>${p.missions}</span></div>
        <div class="kv"><span>Duels</span><span>${p.wins} won \u00b7 ${p.losses} lost</span></div>
        <div class="kv"><span>Power</span><span class="gold">${power(p)}</span></div>
        ${p.dead?`<div class="note" style="margin-top:9px">${esc(p.cause)}</div>`:""}
        <div style="margin-top:10px">
          ${kgsOf(p).map(e=>`<span class="chip p">${esc(KG[e.id].n)} L${e.lvl}</span>`).join("")}
          ${p.sixpaths?`<span class="chip g">Six Paths</span>`:""}
          ${p.sage?`<span class="chip gr">${esc(SAGES[p.sage].n)}</span>`:""}
          ${p.beast?`<span class="chip r">${BEASTS[p.beast].n} \u00b7 bond ${Math.round(p.bond)}</span>`:""}
          ${p.titles.slice(-5).map(t=>`<span class="chip g">${esc(t)}</span>`).join("")}
        </div>
        ${(p.ancestors||[]).length?`<div class="rule"></div><div class="eyebrow">Line</div>
          <div style="margin-top:6px">${p.ancestors.slice(-4).map(a=>`<span class="chip">${esc(a.name)} \u00b7 ${esc(a.rank)}</span>`).join("")}</div>`:""}
      </div>`).join("")}
    </div>
    <div class="sp"></div>
    ${isSolo()
      ? `<div class="ribbon g" style="font-size:17px">${esc(sc[0].p.name)} scored ${sc[0].s}<small>One life, one file, nobody to share the blame with.</small></div>`
      : isCoop()&&teams.length>1
      ? `<div class="ribbon g" style="font-size:17px">${teams.map(t=>esc(teamName(t))+": "+byTeam[t]).join(" \u00b7 ")}

      : isCoop()
      ? `<div class="ribbon g" style="font-size:17px">Combined legacy ${sc.reduce((a,x)=>a+x.s,0)}

      : `<div class="ribbon g" style="font-size:17px">${esc(win.p.name)} leaves the largest name.
          <small>${ranked.map(x=>esc(x.p.name)+" "+x.s).join(" \u00b7 ")}. History is not fair, it is just written down.</small></div>`}
    ${(ARC().history||[]).length?`<div class="card pcard"><span class="cap">Ages closed</span>
      ${ARC().history.map(h=>`<div class="kv"><span><b>Age ${h.age}: ${esc(h.title)}</b></span>
        <span class="dim">trust ${h.order} \u00b7 buried ${h.secrets}</span></div>`).join("")}
      </div><div class="sp"></div>`:""}
    ${ARC().ch?`<div class="card pcard"><span class="cap">${(ARC().history||[]).length?"The age in progress":"How the age ended"}</span>

      <div class="kv"><span>Chapters closed</span><span>${arcEnding().chapters} across ${(ARC().history||[]).length+1} age${(ARC().history||[]).length?"s":""}</span></div>
      <div class="kv"><span>Trust between villages</span><span class="${arcEnding().order>=60?"gr":arcEnding().order<=35?"rd":"gold"}">${arcEnding().order}</span></div>
      <div class="kv"><span>What stayed buried</span><span class="pu">${arcEnding().secrets}</span></div>
      <div class="note" style="margin-top:8px">The chronicle does not end with any one life. Heirs, reincarnations and new births all inherit this.</div>
      ${ARC().log.filter(x=>x.split).length?`<div class="note" style="margin-top:8px">You split on ${ARC().log.filter(x=>x.split).length} chapter${ARC().log.filter(x=>x.split).length===1?"":"s"}. The record does not pretend otherwise.</div>`:""}
    </div><div class="sp"></div>`:""}
    <div class="card"><span class="cap">Chronicle</span>
      <div class="log" style="max-height:320px">${S.log.slice(0,80).map(e=>`<div class="ent ${e.k}"><span class="dot"></span><span class="bd">
        ${e.w?`<span class="who">${esc(e.w)}</span>`:""}<span class="tx">${esc(e.t)}</span></span></div>`).join("")}</div></div>
    <div class="sp"></div>${viewRecords()}
    <div class="row" style="margin-top:13px"><button class="bkey" onclick="leaveRoom()">Start over</button></div>
  </div>`;
}

/* ---------- shape transformation, for inventing your own techniques ---------- */
const SHAPES={
 sphere:{n:"Sphere",cost:6,mult:0.55,eff:"dmg",need:22,d:"Rotation held in one point. Heavy, hard to aim.",word:["Orb","Sphere","Ball","Bomb"]},
 blade:{n:"Blade",cost:4,mult:0.50,eff:"pierce",need:26,d:"An edge. Cuts through guard.",word:["Fang","Edge","Sabre","Blade"]},
 wave:{n:"Wave",cost:8,mult:0.48,eff:"dot",need:18,d:"Broad and lingering. Keeps working after it lands.",word:["Tide","Surge","Wave","Flood"]},
 beam:{n:"Beam",cost:7,mult:0.60,eff:"dmg",need:30,d:"Focused line. The highest raw output.",word:["Lance","Beam","Spear","Ray"]},
 scatter:{n:"Scatter",cost:6,mult:0.36,eff:"double",need:20,d:"Splits into several strikes.",word:["Barrage","Rain","Volley","Storm"]},
 bind:{n:"Bind",cost:8,mult:0.34,eff:"stun",need:34,d:"Holds them still instead of hurting them.",word:["Snare","Prison","Coffin","Grasp"]},
 armour:{n:"Armour",cost:7,mult:0.30,eff:"shield",need:28,d:"Wraps you instead of them.",word:["Mantle","Shroud","Armour","Cloak"]},
 drain:{n:"Siphon",cost:8,mult:0.40,eff:"drain",need:38,d:"Takes their chakra and gives it to you.",word:["Siphon","Leech","Drain","Thirst"]}
};
const NATWORD={Fire:["Ember","Cinder","Blaze","Pyre"],Wind:["Gale","Zephyr","Cyclone","Squall"],
 Lightning:["Arc","Bolt","Thunder","Static"],Earth:["Granite","Loam","Bedrock","Quarry"],
 Water:["Tide","Rime","Torrent","Mist"]};
function inventStats(p,nat,shape){
  const sh=SHAPES[shape];
  const skill=p.control*0.55+p.nin*0.35+p.intel*0.20+compBuff(p,"lib")*6;
  const mult=Math.round((sh.mult+skill/210)*100)/100;
  return {mult,cost:Math.round(sh.cost+mult*7),eff:sh.eff,odds:clamp(0.18+p.control*0.007+p.intel*0.004+compBuff(p,"lib")*0.07-sh.need*0.004,0.1,0.94)};
}
function suggestName(nat,shape){return `${pick(NATWORD[nat]||["Null"])} ${pick(SHAPES[shape].word)}`}
function menuLab(){
  const p=me();
  const nats=[p.nat].concat(p.sub?[p.sub]:[]);
  if(!p.labPick)p.labPick={nat:p.nat,shape:"sphere",name:suggestName(p.nat,"sphere")};
  const L=p.labPick,st=inventStats(p,L.nat,L.shape),sh=SHAPES[L.shape];
  const h=houseOf(p);
  const body=`<p class="dim">Nature plus shape transformation. Your control decides how much of it actually survives contact with reality.</p>
   <div class="eyebrow" style="margin:10px 0 6px">Chakra nature</div>
   <div class="row">${nats.map(n=>`<button class="pick ${L.nat===n?"on":""}" style="flex:1" onclick="labSet('nat','${n}')">${NATICON[n]} ${n}</button>`).join("")}</div>
   <div class="eyebrow" style="margin:12px 0 6px">Shape transformation</div>
   <div class="grid g2">${Object.keys(SHAPES).map(k=>`<button class="pick ${L.shape===k?"on":""}" onclick="labSet('shape','${k}')">
     <div class="t">${esc(SHAPES[k].n)}</div><div class="s">${esc(SHAPES[k].d)}</div></button>`).join("")}</div>
   <div class="eyebrow" style="margin:12px 0 6px">Name it</div>
   <input type="text" maxlength="34" value="${esc(L.name)}" oninput="me().labPick.name=this.value">
   <div class="card" style="margin-top:11px"><span class="cap">Projected</span>
     <div class="kv"><span>Nature</span><span>${NATICON[L.nat]} ${L.nat}</span></div>
     <div class="kv"><span>Effect</span><span class="pu">${esc(sh.eff)}</span></div>
     <div class="kv"><span>Power multiplier</span><span class="gold">${st.mult.toFixed(2)}x control</span></div>
     <div class="kv"><span>Chakra cost</span><span>${st.cost} cp</span></div>
     <div class="kv"><span>Odds it works</span><span class="${st.odds>.6?"gr":"rd"}">${Math.round(st.odds*100)}%</span></div>
     <div class="kv"><span>Lab time</span><span>1 action \u00b7 \u00a5${labCost(p)}</span></div>
   </div>
   ${h.scroll.length?`<div class="eyebrow" style="margin:12px 0 6px">Family scroll \u00b7 ${h.scroll.length} technique${h.scroll.length===1?"":"s"}</div>
     <div>${h.scroll.map(j=>`<span class="chip c">${NATICON[j.nat]} ${esc(j.n)}</span>`).join("")}</div>
     <div class="note" style="margin-top:7px">Anything on the scroll passes to your descendants, who pick it up without the research.</div>`:""}`;
  modal("Training ground","Invent a technique",body,
    `<button class="act bkey" onclick="invent()" ${p.ryo<labCost(p)?"disabled":""}><span class="ic">\u2697\uFE0F</span>
      <span class="tx"><b>Try to make it work</b><span>${p.ryo<labCost(p)?"You cannot afford the materials":"Costs \u00a5"+labCost(p)+" in materials either way"}</span></span></button>
     <button onclick="me().labPick.name=suggestName(me().labPick.nat,me().labPick.shape);menuLab()">Suggest another name</button>
     <button onclick="closeModal()">Back</button>`,mySeat());
}
function labCost(p){return 600+houseOf(p).scroll.length*450}
function labSet(k,v){const p=me();p.labPick[k]=v;p.labPick.name=suggestName(p.labPick.nat,p.labPick.shape);menuLab()}
function invent(){
  const p=me();closeModal();
  const L=p.labPick,st=inventStats(p,L.nat,L.shape);
  p.ryo-=labCost(p);
  if(chance(st.odds)){
    const id="inv"+Date.now().toString(36)+rnd(10,99);
    const j={id,n:(L.name||suggestName(L.nat,L.shape)).slice(0,34),nat:L.nat,rk:0,
      cost:st.cost,scale:"control",mult:st.mult,eff:st.eff,d:"Your own technique",inventor:p.name};
    houseOf(p).scroll.push(j);
    p.jutsu.push("scroll:"+id);
    bump(p,"control",3);bump(p,"nin",2);bump(p,"rep",6);
    say(`${p.name} invented ${j.n}. ${L.nat} chakra shaped into a ${SHAPES[L.shape].n.toLowerCase()}. It is on the family scroll now.`,p.name,"big");
  }else{
    wound(p,rnd(5,14));bump(p,"control",2);
    say(`The technique collapsed halfway through the seals and took part of the training ground with it.`,p.name,"bad");
  }
  spend(p,1);
}

/* ---------- clan compound ---------- */
const COMPS={
 train:{n:"Training Grounds",ic:"\uD83E\uDD4B",d:"Every attribute you drill climbs faster, forever, for everyone after you."},
 lib:{n:"Scroll Library",ic:"\uD83D\uDCDA",d:"Better odds inventing and learning, and heirs start sharper."},
 shrine:{n:"Blood Shrine",ic:"\u26E9\uFE0F",d:"Bloodlines awaken and level more readily in this house."},
 inf:{n:"Infirmary",ic:"\u2695\uFE0F",d:"Wounds close faster between years and heirs are born hardier."}
};
function compCost(l){return 2500*Math.pow(2.1,l)|0}
function menuCompound(){
  const p=me(),h=houseOf(p);
  const body=`<p class="dim">Money out of S-rank work turns into stone and shelves. None of it helps this life as much as it helps the next one.</p>
   <div class="kv" style="margin:8px 0"><span>Held</span><span class="gold">\u00a5 ${p.ryo}</span></div>
   ${Object.keys(COMPS).map(k=>{const l=h.comp[k]||0,c=compCost(l);
     return `<div class="up"><span class="ic">${COMPS[k].ic}</span><span class="mid">
       <b>${esc(COMPS[k].n)}</b><span>${esc(COMPS[k].d)}</span>
       <span class="dots">${[0,1,2,3,4].map(i=>`<i class="${i<l?"on":""}"></i>`).join("")}</span></span>
       ${l>=5?`<span class="chip g">max</span>`:`<button class="${p.ryo>=c?"bkey":""}" onclick="upgrade('${k}')" ${p.ryo>=c?"":"disabled"} style="padding:8px 11px;font-size:12.5px">\u00a5${c}</button>`}</div>`}).join("")}`;
  modal("Clan compound",h.comp.train+h.comp.lib+h.comp.shrine+h.comp.inf?"Your house":"Break ground",body,
    `<button onclick="closeModal()">Back</button>`,mySeat());
}
function upgrade(k){
  const p=me(),h=houseOf(p),l=h.comp[k]||0,c=compCost(l);
  if(p.ryo<c)return;
  p.ryo-=c;h.comp[k]=l+1;
  say(`${COMPS[k].n} upgraded to level ${l+1}. Every generation after this one starts better off.`,p.name,"big");
  if(k==="train")STATKEYS.forEach(([x])=>bump(p,x,1.2));
  if(k==="lib"){bump(p,"intel",3);bump(p,"control",2)}
  if(k==="inf"){bump(p,"health",3);p.cond=clamp(p.cond+15,0,maxCond(p))}
  menuCompound();touch();
}

 anbu:{n:"ANBU Black Ops",ic:"\uD83C\uDFAD",req:{rank:4,speed:50,gen:35},

function menuCorps(){
  const p=me();
  if(p.corps){
    const c=CORPS[p.corps];

      (p.corps==="anbu"?`<button class="act bdanger" onclick="blackOp()"><span class="ic">\uD83D\uDDE1\uFE0F</span><span class="tx">
        <b>Take a black operation</b><span>High pay, high renown, and it costs you something</span></span></button>`:"")+
      `<button onclick="closeModal()">Back</button>`,mySeat());

  }

       <h3>${c.ic} ${esc(c.n)}</h3><div class="dim" style="font-size:13.5px">${esc(c.d)}</div>
       <div class="rule"></div>
       ${Object.entries(c.req).map(([r,v])=>`<div class="kv"><span>${r==="rank"?"Rank":STATKEYS.find(x=>x[0]===r)[1]}</span>
         <span class="${(r==="rank"?p.rank:p[r])>=v?"gr":"rd"}">${r==="rank"?RANKS[v]:v} needed</span></div>`).join("")}
       ${Object.entries(c.b).map(([r,v])=>`<div class="kv"><span>${STATKEYS.find(x=>x[0]===r)[1]}</span><span class="gold">+${v} on joining</span></div>`).join("")}
       </div>`}).join("");
  modal("Assignment","Specialised forces",body,
    Object.keys(CORPS).map(k=>`<button class="act ${k==="anbu"?"bdanger":"bgr"}" onclick="joinCorps('${k}')" ${corpsOK(p,k)?"":"disabled"}>
      <span class="ic">${CORPS[k].ic}</span><span class="tx"><b>Join the ${esc(CORPS[k].n)}</b><span>Permanent for this life</span></span></button>`).join("")
    +`<button onclick="closeModal()">Back</button>`,mySeat());

function corpsOK(p,k){const c=CORPS[k];return Object.entries(c.req).every(([r,v])=>(r==="rank"?p.rank:p[r])>=v)}
function joinCorps(k){
  const p=me();closeModal();
  if(!corpsOK(p,k))return;
  p.corps=k;const c=CORPS[k];
  Object.entries(c.b).forEach(([r,v])=>bump(p,r,v));
  p.titles.push(c.n);bump(p,"rep",10);
  say(`${p.name} was accepted into the ${c.n}.`,p.name,"big");
  spend(p,1);
}
function blackOp(){
  const p=me();closeModal();
  const roll=power(p)+p.speed*1.5+rnd(-50,50);
  if(roll>=520){
    const pay=rnd(4000,11000);p.ryo+=pay;bump(p,"rep",9);p.karma-=4;bump(p,"speed",2);
    say(`Black operation closed. Nobody heard it happen. ${pay} ryo, filed under nothing.`,p.name,"good");
    if(chance(.16)&&!S.war.on)declareWar(p,"an assassination that crossed a border");
  }else{
    wound(p,rnd(12,26),"The mark was expecting you.","Killed on an operation the village will not acknowledge.");
    bump(p,"rep",-4);
    say(`The operation failed. Officially it never happened, so neither did the injuries.`,p.name,"bad");
  }
  spend(p,1);
}
function fieldMedicine(){
  const p=me();closeModal();
  p.cond=clamp(p.cond+35+p.control*0.2,0,maxCond(p));
  bump(p,"control",2);bump(p,"intel",1);
  livingMates(p).forEach(m=>m.bond=clamp(m.bond+6,0,100));
  say(`A rotation on the ward. You are in better shape, and so is the squad.`,p.name,"good");
  spend(p,1);
}

  if(p.rival&&p.rival.alive)btns+=`<button class="act hot" onclick="rivalSpar()"><span class="ic">\uD83D\uDD25</span>

  modal("Squad","Your three man cell",body,btns+`<button onclick="closeModal()">Back</button>`,mySeat());
}
function squadTime(){
  const p=me();closeModal();
  livingMates(p).forEach(m=>{m.bond=clamp(m.bond+rnd(7,15),0,100);m.pw+=rnd(3,9)});
  bump(p,"tai",rnd(1,3));bump(p,"control",rnd(1,2));
  if(isCoop())setBond(teamOf(p),bondOf(teamOf(p))+2);
  say(`Squad drills all week. ${livingMates(p).map(m=>m.name).join(" and ")} are getting better too.`,p.name,"good");
  spend(p,1);
}
function senseiTime(){
  const p=me();closeModal();
  const s=p.squad.sensei;s.bond=clamp(s.bond+rnd(8,16),0,100);
  bump(p,pick(["nin","tai","gen","control"]),rnd(2,5));
  if(chance(.25)&&learnable(p).length){const id=pick(learnable(p));p.jutsu.push(id);
    say(`${s.name} taught you ${JUTSU[id].n} outright.`,p.name,"big")}
  else say(`${s.name} corrects your form for six hours and says nothing kind about it.`,p.name,"good");
  spend(p,1);
}
function rivalSpar(){
  const p=me();closeModal();
  const r=p.rival;
  const win=power(p)+rnd(-40,40)>r.pw;
  if(win){r.losses++;bump(p,"rep",3)}else{r.wins++;bump(p,"tai",1)}
  r.bond=clamp(r.bond+rnd(6,13),0,100);
  r.pw+=rnd(8,18);
  bump(p,"tai",rnd(2,4));bump(p,"speed",rnd(1,3));bump(p,"nin",rnd(1,3));
  say(win?`Sparred ${r.name} to a standstill and finished on top. They will be back.`
        :`${r.name} took the spar. You learned more from losing it than they did from winning.`,p.name,win?"good":"");
  if(r.bond>75&&chance(.2)){bump(p,pick(["nin","gen","control"]),4);say(`${r.name} showed you something from their clan's forms. Nobody was supposed to do that.`,p.name,"big")}
  spend(p,1);
}

/* ---------- late game: commanding a genin squad ---------- */
function menuGenin(){
  const p=me();
  if(!p.genin.length){p.genin=[makeNPCPerson(p,-30),makeNPCPerson(p,-30),makeNPCPerson(p,-30)];p.genin.forEach(g=>{g.rank=1;g.pw=rnd(30,60)})}
  const body=`<p class="dim">Your speed and taijutsu are going the way they always go. What you know is worth more than what you can still do.</p>
    <div class="ppl" style="margin-top:10px">${p.genin.map((g,i)=>`<div class="per ${g.alive?"":"dead"}">
      <b>${esc(g.name)}</b><div class="r">${esc(CLANS[g.clan].n)} \u00b7 ${NATICON[g.nat]} ${g.nat}</div>
      ${g.alive?bar("Ability",g.pw,320,"g")+bar("Trust",g.bond,100,"gr"):`<div class="chip r">Killed in action</div>`}</div>`).join("")}</div>`;
  modal("Command","Your genin squad",body,
    `<button class="act" onclick="teachGenin()"><span class="ic">\uD83E\uDD4B</span><span class="tx"><b>Drill them</b><span>They get better, you get renown</span></span></button>
     <button class="act bdanger" onclick="sendGenin()"><span class="ic">\uD83D\uDCDC</span><span class="tx"><b>Send them out</b><span>Real pay, real risk, they can die out there</span></span></button>
     <button onclick="closeModal()">Back</button>`,mySeat());
}
function teachGenin(){
  const p=me();closeModal();
  p.genin.filter(g=>g.alive).forEach(g=>{g.pw+=rnd(10,26)+Math.round(p.intel*0.2);g.bond=clamp(g.bond+rnd(6,14),0,100)});
  bump(p,"intel",2);bump(p,"rep",4);
  say(`A season with the squad. All three came out sharper than they went in.`,p.name,"good");
  spend(p,1);
}
function sendGenin(){
  const p=me();closeModal();
  const live=p.genin.filter(g=>g.alive);
  if(!live.length){say("There is nobody left to send.",p.name,"bad");spend(p,1);return}
  const team=live.reduce((a,g)=>a+g.pw,0)+p.intel*2;
  const danger=S.war.on?1.9:1;
  if(team>rnd(150,340)*danger){
    const pay=rnd(900,3200);p.ryo+=pay;bump(p,"rep",6);p.karma+=2;
    live.forEach(g=>{g.pw+=rnd(8,20);g.bond=clamp(g.bond+5,0,100)});
    say(`Your squad came home clean and got paid ${pay} ryo. The credit lands on your file.`,p.name,"good");
  }else{
    bump(p,"rep",-3);
    const victim=pick(live);
    if(chance(.35*danger)){victim.alive=false;
      say(`${victim.name} did not come back. You signed the letter yourself.`,p.name,"bad");
      wound(p,8);
    }else say(`The squad failed the assignment and came home battered. Nobody died, this time.`,p.name,"bad");
  }
  spend(p,1);
}

/* ---------- politics and the Kage's chair ---------- */
function menuVillage(){
  const p=me(),o=them();
  if(p.rank!==5){modal("Village administration","Not your office",
    `<p>The budget belongs to whoever is wearing the hat. That is not you.</p>`,
    `<button onclick="closeModal()">Back</button>`,mySeat());return}
  if(!S.budget)S.budget={def:34,eco:33,aca:33};
  const B=S.budget;
  const subjects=liveOthers(p).filter(q=>!q.rogue&&q.village===p.village);
  const sameVillage=subjects.length>0;
  const body=`<p class="dim">You hold the hat. Where the money goes decides what your shinobi can survive.</p>
    <div class="card" style="margin:10px 0"><span class="cap">Budget</span>
      ${[["def","Defence and walls","Mission success and war survival"],["eco","Trade and commerce","Mission pay for everyone"],["aca","Academy and archives","Growth rate for everyone"]].map(([k,n,d])=>
        `<div style="margin-bottom:9px"><div class="kv"><span>${n}</span><span class="gold">${B[k]}%</span></div>
         <div class="dim" style="font-size:11.5px;margin-bottom:3px">${d}</div>
         <input type="range" min="0" max="100" value="${B[k]}" oninput="setBudget('${k}',+this.value)"></div>`).join("")}
      <div class="note" style="margin-top:6px">Only the Kage can move these. Everyone lives with them.</div>
      <div class="note">Normalised to 100 automatically. Currently ${B.def+B.eco+B.aca} allocated.</div>
    </div>`;
  let btns=`<button class="act" onclick="closeModal()">Done</button>`;
  if(sameVillage){
    btns=subjects.map(q=>`<button class="act bdanger" onclick="assignSRank(${q.seat})"><span class="ic">\uD83D\uDCDC</span><span class="tx">
        <b>Order ${esc(q.name)} onto an S-rank</b><span>They cannot refuse. The village keeps a share of the pay.</span></span></button>`
      +(q.rank<4?`<button class="act bkey" onclick="promoteOther(${q.seat})"><span class="ic">\uD83C\uDFAD</span><span class="tx">
        <b>Promote ${esc(q.name)} to ${esc(RANKS[Math.min(4,q.rank+1)])}</b><span>Your signature is enough</span></span></button>`:"")).join("")
    +btns;
  }
  if(S.war.on)btns=`<button class="act bdanger" onclick="sueForPeace()"><span class="ic">\uD83D\uDD4A\uFE0F</span><span class="tx">
    <b>Sue for peace with ${esc(VILLAGES[S.war.foe].en)}</b><span>Costs renown. Ends the war arc early.</span></span></button>`+btns;
  modal("Village administration",vilOf(p).n,body,btns,mySeat());
}
function setBudget(k,v){
  const p=me();
  if(!p||p.rank!==5||p.rogue||p.dead)return;      // the hat holds the purse
  if(!S.budget)S.budget={def:34,eco:33,aca:33};
  S.budget[k]=v;const t=S.budget.def+S.budget.eco+S.budget.aca;
  if(t>0){["def","eco","aca"].forEach(x=>S.budget[x]=Math.round(S.budget[x]/t*100))}
  touch();menuVillage();
}
function budget(k){const B=S.budget||{def:34,eco:33,aca:33};return (B[k]||33)/33}
function assignSRank(seat){
  const p=me(),o=seat!=null?S.P[seat]:them();closeModal();
  if(!o)return;
  S.order={seat:o.seat,by:p.name};
  bump(p,"rep",3);p.karma-=2;
  say(`${p.name} signed orders putting ${o.name} on an S-rank. There is no box to tick for declining.`,"Registry","big");
  spend(p,1);
}
function promoteOther(seat){
  const p=me(),o=seat!=null?S.P[seat]:them();closeModal();
  if(!o)return;
  o.rank=Math.min(4,o.rank+1);o.titles.push(RANKS[o.rank]);bump(o,"rep",8);
  say(`${p.name} promoted ${o.name} to ${RANKS[o.rank]} by signature.`,"Registry","big");
  spend(p,1);
}
function sueForPeace(){
  const p=me();closeModal();
  bump(p,"rep",-14);
  say(`${p.name} signed terms with ${VILLAGES[S.war.foe].en}. The border holds. Half the village thinks it was weakness.`,"Registry","big");
  endWar();spend(p,1);
}

/* ---------- war ---------- */
function declareWar(p,reason){
  if(S.war.on)return;
  const foes=Object.keys(VILLAGES).filter(v=>v!==(p?p.village:"konoha"));
  S.war={on:true,foe:pick(foes),left:rnd(3,6),reason:reason||"a border incident nobody will take responsibility for"};
  say(`War. ${VILLAGES[S.war.foe].n} has declared, over ${S.war.reason}. Every file is on a war footing.`,"Registry","big");
}
function endWar(){
  const foe=S.war.foe;
  S.war={on:false,foe:null,left:0,reason:"",peace:rnd(5,11)};
  S.P.forEach(p=>{if(p.dead)return;bump(p,"rep",12);p.titles.push("War Veteran");
    say(`${p.name} came out the other side of the war with ${VILLAGES[foe]?VILLAGES[foe].en:"the enemy"}.`,p.name,"big")});
}
function frontLine(){
  const p=me();closeModal();
  const roll=power(p)*budget("def")+rnd(-70,70)+(livingMates(p).length*30);
  const need=380+S.year*3;
  if(roll>=need){
    const pay=rnd(2200,6000);p.ryo+=pay;bump(p,"rep",11);
    STATKEYS.forEach(([k])=>{if(chance(.55))bump(p,k,rnd(1,3))});
    say(`Held the line. ${pay} ryo in hazard pay and a note in the war record.`,p.name,"good");
    if(chance(.3))casualty(p);
  }else{
    if(chance(.22)){kill(p,`Killed on the front line against ${VILLAGES[S.war.foe].en}.`);spend(p,1);return}
    wound(p,rnd(16,34),"The line broke and you were on the wrong side of it.",`Died of wounds taken in the war.`);
    bump(p,"rep",-4);casualty(p);
  }
  spend(p,1);
}
function casualty(p){
  const live=livingMates(p);
  if(live.length&&chance(.4)){
    const m=pick(live);m.alive=false;
    say(`${m.name} was killed. ${m.bond>60?"They went down covering you.":"You were somewhere else when it happened."}`,p.name,"bad");
    wound(p,6);
    lastGift(p,m);
    return;
  }
  if(p.squad&&p.squad.sensei.alive&&chance(.2)){
    p.squad.sensei.alive=false;
    say(`${p.squad.sensei.name} is dead. Whatever they had not taught you yet is gone with them.`,p.name,"bad");
    return;
  }
  if(p.kids.length&&chance(.12)){
    const k=pick(p.kids);p.kids=p.kids.filter(x=>x!==k);
    say(`${k.name} was in the wrong district when it was hit. The war does not check who is a child.`,p.name,"bad");
  }
}

/* ---------- destiny, six paths, reincarnation ---------- */
/* If one half of the cycle is walking around and the other is not, the world
   provides it. Only one of each exists at a time, player or not. */
function balanceDestiny(){
  const held={};
  S.P.forEach(q=>{if(!q.dead&&q.destiny)held[q.destiny]=1});
  if(S.npcDestiny&&held[S.npcDestiny])S.npcDestiny=null;      // a player took it
  const anyPlayer=Object.keys(held).length>0;
  if(!anyPlayer){S.npcDestiny=null;S.npcDestinyName=null;return}
  const missing=["indra","ashura"].find(d=>!held[d]);
  if(missing&&!S.npcDestiny){
    S.npcDestiny=missing;S.npcDestinyName=npcName();
    say(`Word comes out of another country of someone carrying the other half of the old inheritance. They are called ${S.npcDestinyName}.`,"The Chronicle","big");
  }
  if(!missing){S.npcDestiny=null;S.npcDestinyName=null}
}
function revealDestiny(p){
  if(!p.destiny||!p.flags.destinyHidden)return;
  p.flags.destinyHidden=0;
  const D=DESTINY[p.destiny];
  Object.entries(D.b).forEach(([k,v])=>bump(p,k,v));
  p.titles.push(D.n);
  say(`Something in ${p.name}'s chakra is older than they are. ${D.n}. ${D.d}`,p.name,"big");
}
function sixPathsOdds(p){
  if(!p.destiny||!p.sage||p.sixpaths)return 0;
  return clamp((power(p)-900)/1400+kgTotal(p)*0.04+p.control*0.002,0,0.6);
}
function menuSixPaths(){
  const p=me(),o=sixPathsOdds(p);
  modal("The Sage","Six Paths",
    `<p>Sage chakra, an old inheritance, and enough power to hold both. The Sage of Six Paths only appears to people who have already gone further than is sensible.</p>
     <div class="ribbon ${o>.3?"g":"r"}">${Math.round(o*100)}% chance the meeting happens at all<small>Failing costs a year and a great deal of chakra. It does not kill you.</small></div>`,
    `<button class="act bkey" onclick="seekSixPaths()"><span class="ic">\u2600\uFE0F</span><span class="tx">
      <b>Sit and wait for him</b><span>Two actions</span></span></button><button onclick="closeModal()">Back</button>`,mySeat());
}
function seekSixPaths(){
  const p=me();closeModal();
  if(chance(sixPathsOdds(p))){
    p.sixpaths=true;p.titles.push("Six Paths Sage");
    STATKEYS.forEach(([k])=>bump(p,k,6));
    bump(p,"rep",24);
    say(`The old man was already sitting there when ${p.name} opened their eyes. Six Paths chakra, handed over without ceremony.`,p.name,"big");
  }else{
    wound(p,rnd(6,14));
    say(`A year sitting perfectly still and nothing came. It was not nothing, but it was not him.`,p.name,"bad");
  }
  spend(p,2);
}
function reincarnate(){
  const old=me();closeModal();
  const h=houseOf(old);
  h.prestige=Math.min(8,(h.prestige||0)+1);
  h.ancestors.push({name:old.name,rank:rankName(old),power:power(old),age:old.age,clan:old.clan});
  const np=buildPlayer(old.seat,npcName(),chance(.5)?"Male":"Female",old.village,{noDestiny:true});
  np.life=old.life+1;np.ancestors=h.ancestors.slice();
  if(old.destiny){                                   // the cycle follows the chakra, not the body
    np.destiny=old.destiny;np.flags.destinyHidden=0;
    const D=DESTINY[np.destiny];
    Object.entries(D.b).forEach(([k,v])=>bump(np,k,v));
    np.titles.push(D.n);
    say(`The same chakra, in a new body. ${np.name} carries ${D.n} without ever having been told what it is.`,np.name,"big");
  }
  if(old.beast)delete S.taken[old.beast];
  S.P[old.seat]=np;rollBeast(np);np.ap=3;
  say(`The chakra goes back into the world and comes out somewhere else. ${np.name} of ${vilOf(np).en}, ${clanOf(np).n} blood. Everything is gone except how fast they learn.`,np.name,"big");
  say(`Cycle ${h.prestige}. Growth rate up ${h.prestige*8}% permanently for this line.`,"Registry","big");
  touch();render();
}


/* =====================================================================
   HIDDEN PANEL
   Lives entirely in NET (local), never in S, so nothing about it syncs
   and the other machine has no way to see that it exists.
   Unlock: tap the room code five times on the host's waiting screen
   (or the word CHRONICLE on the title screen for same-screen games),
   then enter the passphrase.
   ===================================================================== */
const GODCODE="RIKUDO";
function godTap(){
  NET.godTap=(NET.godTap||0)+1;
  if(NET.godTap>=5){NET.godTap=0;NET.godAsk=true;NET.godErr="";render()}
}
function godTry(v){
  if(String(v||"").toUpperCase().replace(/[^A-Z]/g,"")===GODCODE){
    NET.god=true;NET.godAsk=false;NET.godOpen=true;
    NET.godTarget=online()?(NET.seat||0):0;
  }else{NET.godErr="Nothing happens."}
  render();
}
function viewGodGate(){
  return `<div class="veil" onclick="if(event.target===this){NET.godAsk=false;render()}">
    <div class="modal gpan" style="max-width:340px">
      <div class="tag" style="color:var(--purple)">\u25C6</div>
      <input type="text" maxlength="16" placeholder="" autofocus
        style="font-family:var(--mono);font-size:20px;letter-spacing:.24em;text-transform:uppercase;text-align:center;margin-top:10px"
        onkeydown="if(event.key==='Enter')godTry(this.value)">
      ${NET.godErr?`<div class="note" style="margin-top:10px">${esc(NET.godErr)}</div>`:""}
      <div class="row" style="margin-top:12px">
        <button class="bpu" style="flex:1" onclick="godTry(this.parentNode.parentNode.querySelector('input').value)">Enter</button>
        <button onclick="NET.godAsk=false;NET.godErr='';render()">Close</button>
      </div>
    </div></div>`;
}
function godT(){
  if(!S.P||!S.P.length)return null;
  let i=NET.godTarget||0;
  if(i>=S.P.length)i=NET.godTarget=S.P.length-1;
  return S.P[i]||S.P[0];
}
/* The sync layer only ever publishes your own seat, so an edit made to
   somebody else has to be handed to them explicitly. It is left in the room
   addressed to that seat; their machine applies it and acknowledges. */
function godPush(){
  const i=NET.godTarget||0;
  if(online()&&i!==NET.seat&&S.P[i]){
    if(!S.inject)S.inject={};
    S.inject[i]={at:Date.now(),by:NET.seat,p:JSON.parse(JSON.stringify(S.P[i]))};
  }
  touch();render();
  if(online())pushState();
}
function godGuard(fn){return function(){if(!godT())return;return fn.apply(null,arguments)}}
function godSet(f,v){if(!godT())return;const p=godT();p[f]=v;godPush()}
function godStat(k,d){if(!godT())return;const p=godT();p[k]=clamp(Math.round((p[k]||0)+d),0,CAP*2);godPush()}
function godNum(f,d,lo,hi){if(!godT())return;const p=godT();p[f]=clamp(Math.round((p[f]||0)+d),lo,hi);godPush()}
function godAllStats(v){if(!godT())return;const p=godT();STATKEYS.forEach(([k])=>p[k]=v);godPush()}
function godVillage(v){if(!godT())return;
  const p=godT();p.village=v;
  if(!CLANPOOL[v].some(x=>x[0]===p.clan))p.clan="civilian";
  godPush();
}
function godClan(c){if(!godT())return;
  const p=godT();p.clan=c;
  const kg=CLANS[c].kg;
  p.pot=kg?[kg]:[];
  kgsOf(p).forEach(e=>{if(p.pot.indexOf(e.id)<0)p.pot.push(e.id)});
  if(CLANS[c].nat)p.nat=CLANS[c].nat;
  godPush();
}
function godKG(id){if(!godT())return;
  const p=godT();
  const e=kgsOf(p).find(x=>x.id===id);
  if(!e){p.kgs.push({id,lvl:1});if(potOf(p).indexOf(id)<0)p.pot.push(id)}
  else if(e.lvl<3)e.lvl++;
  else{p.kgs=p.kgs.filter(x=>x.id!==id);p.pot=p.pot.filter(x=>x!==id||CLANS[p.clan].kg===id)}
  godPush();
}
function godJutsu(id){if(!godT())return;
  const p=godT();
  const i=p.jutsu.indexOf(id);
  if(i<0)p.jutsu.push(id);else p.jutsu.splice(i,1);
  godPush();
}
function godBeast(b){if(!godT())return;
  const p=godT();
  if(p.beast)delete S.taken[p.beast];
  p.beast=b||null;
  if(b){S.taken[b]=true;if(!p.bond)p.bond=50}
  godPush();
}
function godSage(v){if(!godT())return;
  const p=godT();
  p.jutsu=p.jutsu.filter(j=>typeof j!=="string"||j.indexOf("sage:")!==0);
  p.sage=v||null;
  if(v)p.jutsu.push("sage:"+v);
  godPush();
}
function godHouse(k,d){if(!godT())return;
  const p=godT(),h=houseOf(p);
  if(k==="prestige")h.prestige=clamp((h.prestige||0)+d,0,8);
  else h.comp[k]=clamp((h.comp[k]||0)+d,0,5);
  godPush();
}
function godWar(){if(!godT())return;
  if(S.war.on){S.war={on:false,foe:null,left:0,reason:"",peace:0}}
  else{const p=godT();S.war={on:true,foe:pick(Object.keys(VILLAGES).filter(v=>v!==p.village)),left:5,reason:"reasons that were never written down"}}
  godPush();
}
function godRestore(){if(!godT())return;const p=godT();p.dead=false;p.cause="";p.killedBy=null;p.cond=100;p.ap=3;godPush()}
function godRoll(){if(!godT())return;
  const p=godT();
  const np=buildPlayer(p.seat,p.name,p.gender,p.village,null);
  np.age=p.age;np.life=p.life;np.ancestors=p.ancestors;np.ap=p.ap;
  S.P[p.seat]=np;godPush();
}
function stepRow(label,val,fn,step){
  return `<div class="grow"><span class="l">${label}</span><span class="step">
    <button onclick="${fn}(-${step*10})">\u2212\u2212</button>
    <button onclick="${fn}(-${step})">\u2212</button>
    <span class="v">${val}</span>
    <button onclick="${fn}(${step})">+</button>
    <button onclick="${fn}(${step*10})">++</button></span></div>`;
}
function selRow(label,cur,opts,fn){
  return `<div class="grow"><span class="l">${label}</span>
    <select onchange="${fn}(this.value)">${opts.map(([v,t])=>
      `<option value="${esc(v)}" ${String(cur)===String(v)?"selected":""}>${esc(t)}</option>`).join("")}</select></div>`;
}
function viewGodPanel(){
  const p=godT();
  if(!p){
    return `<div class="veil"><div class="modal gpan" style="max-width:400px">
      <div class="tag" style="color:var(--purple)">\u25C6 Hidden</div>

/* ------------------------- SAVE / LOAD / NETWORK ------------------------- */

/* =====================================================================
   RECONNECTION
   A room is a shared record, not a live socket, so a closed tab loses only
   the local pointer to it. Rejoining means proving which seat you were and
   picking the record back up. There is no account system here, so anyone
   with the code can claim any seat: that is the same trust level as the
   code itself, and fine among friends.
   ===================================================================== */
const LASTKEY="shinobi-last-room";
function rememberSeat(){
  if(!online()||NET.seat==null)return;
  try{localStorage.setItem(LASTKEY,JSON.stringify({room:NET.room,seat:NET.seat,at:Date.now()}))}catch(e){}
}
function lastSeat(){
  try{const v=JSON.parse(localStorage.getItem(LASTKEY)||"null");
    if(!v||!v.room)return null;
    if(Date.now()-(v.at||0)>1000*60*60*24*14)return null;   // a fortnight is long enough
    return v;
  }catch(e){return null}
}
function forgetSeat(){try{localStorage.removeItem(LASTKEY)}catch(e){}}
/* Presence: each machine stamps its own seat every time it writes. */
function markSeen(){
  if(!online()||NET.seat==null)return;
  if(!S.seen)S.seen={};
  S.seen[NET.seat]=Date.now();
}
function awayFor(seat){
  if(!S.seen||!S.seen[seat])return null;
  return Date.now()-S.seen[seat];
}
function isAway(seat){
  const t=awayFor(seat);
  return t!=null&&t>1000*75;                 // no write in over a minute
}
function awayLabel(ms){
  if(ms==null)return "not seen yet";
  const m=Math.floor(ms/60000);
  if(m<1)return "active now";
  if(m<60)return m+" min ago";
  const h=Math.floor(m/60);
  return h+(h===1?" hour ago":" hours ago");
}
/* Joining a full room offers the roster instead of refusing. */
function viewRejoin(){
  const R=NET.rejoin;

        \u00b7 ${esc(awayLabel(R.seen&&R.seen[i]?Date.now()-R.seen[i]:null))}</span></span></button>`).join("")}
    </div>

function claimSeat(i){
  const R=NET.rejoin;
  if(!R)return;
  NET.seat=i;NET.rejoin=null;NET.status="reconnected";
  S=R;
  S.battle=null;S.exam=null;                 // never resume mid-scene on a fresh client
  NET.pending=null;
  if(S.screen!=="game"&&S.screen!=="legacy")S.screen="game";
  rememberSeat();markSeen();
  startPolling();pushState();render();
  say(`${S.P[i]?S.P[i].name:"Seat "+(i+1)} is back at the table.`,"Registry");
}
/* Offered on the title screen when a room was open on this device. */
async function quickRejoin(){
  const v=lastSeat();
  if(!v)return;
  NET.pendingCode=v.room;NET.room=v.room;NET.seat=v.seat;NET.status="reconnecting";
  const rem=await pullState(true);
  if(!rem||!rem.P||!rem.P[v.seat]){
    NET.room=null;NET.seat=null;forgetSeat();
    NET.joinError="That room is gone. It may have been reset.";
    S.screen="netjoin";render();return;
  }
  S=rem;S.battle=null;S.exam=null;NET.pending=null;
  if(S.screen!=="game"&&S.screen!=="legacy")S.screen="game";
  markSeen();startPolling();pushState();render();
}

async function save(loud){
  if(online()){if(loud){pushState();say("Synced to the room.","Registry");render()}return}
  try{
    const slim=JSON.parse(JSON.stringify(S));slim.battle=null;slim.pending=null;slim.exam=null;
    await STORE.set("shinobi-chronicle-save",JSON.stringify(slim));
    if(loud){say("File saved.","Registry");render()}
  }catch(e){if(loud){say("Save failed, but nothing in this session was lost.","Registry","bad");render()}}
}
async function loadGame(){
  try{
    const r=await STORE.get("shinobi-chronicle-save");
    if(!r||!r.value){alert("No saved same-screen file on this device.");return}
    S=JSON.parse(r.value);S.battle=null;NET.pending=null;S.exam=null;render();
  }catch(e){alert("No saved same-screen file on this device.")}
}
const ROOMPRE="shinobi-chronicle-room:";
function online(){return !!NET.room}
function roomKey(c){return ROOMPRE+c}
function makeCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let o="";for(let i=0;i<5;i++)o+=A[Math.floor(Math.random()*A.length)];return o}
function ownerIdx(){
  if(S.battle){const a=S.battle.turn==="A"?S.battle.aIdx:S.battle.bIdx;return a>=0?a:(S.battle.owner!=null?S.battle.owner:S.turn)}
  if(S.exam)return S.exam.seat;
  if(NET.pending&&NET.pending.eventFor!==undefined&&NET.pending.eventFor!==null)return NET.pending.eventFor;
  return S.turn;
}
function canAct(){
  if(S.battle){const a=S.battle.turn==="A"?S.battle.aIdx:S.battle.bIdx;
    const own=a>=0?a:(S.battle.owner!=null?S.battle.owner:0);
    return online()?own===NET.seat:true}
  if(S.exam)return online()?S.exam.seat===NET.seat:true;
  if(NET.pending)return true;
  if(!online())return true;
  return !S.ended[NET.seat];
}
function locked(){return !!(S.battle||S.exam||S.field||S.resetReq||NET.pending
  ||(S.joint&&S.joint.started&&jointInvolvesMe())||(S.joint&&jointAsksMe()))}
/* Am I the one whose input a shared scene is waiting on? Only then may my copy
   outrank the room's. A modal of my own is local furniture and must not stop
   the world arriving. */
function ownsSharedMoment(){
  if(S.battle){
    const a=S.battle.turn==="A"?S.battle.aIdx:S.battle.bIdx;
    const own=a>=0?a:(S.battle.owner!=null?S.battle.owner:0);
    return !online()||own===NET.seat;
  }
  if(S.exam)return !online()||S.exam.seat===NET.seat;
  if(S.field)return !online()||S.field.seat===NET.seat;
  if(S.resetReq)return true;
  if(S.joint&&S.joint.started)return jointInvolvesMe();
  return false;
}
function touch(){if(!online())return;clearTimeout(NET.pushT);NET.pushT=setTimeout(pushState,280)}
/* Both seats play the same year at once, so a plain overwrite would lose
   whatever the other machine did in the meantime. Read, merge our own slice
   in, write back. Shared moments (battles, exams, resets) fall back to
   whole-state authority held by whoever owns that moment. */
function mergeInto(remote){
  const seat=NET.seat;
  if(!remote||!remote.P||!remote.P.length)return S;
  // if either side is inside a shared moment, the owner's whole state wins
  if(locked()&&canAct())return S;
  // whoever has rolled the year over holds the whole world for that moment
  if((S.year||0)>(remote.year||0))return S;
  if((remote.year||0)>(S.year||0))return remote;
  if(remote.battle||remote.exam||remote.resetReq)return remote;
  const m=remote;
  if(S.inject){m.inject=Object.assign({},m.inject||{},S.inject)}
  if(S.pend){m.pend=Object.assign({},m.pend||{},S.pend)}
  if(S.claims){m.claims=Object.assign({},m.claims||{},S.claims)}
  if(S.P[seat])m.P[seat]=S.P[seat];
  if(!m.ended)m.ended=[];
  m.ended[seat]=S.ended[seat];
  if(!m.house)m.house=[];
  m.house[seat]=S.house[seat];
  m.log=mergeLogs(remote.log,S.log);
  m.taken=Object.assign({},remote.taken||{},S.taken||{});
  if(S.war&&S.war.on&&!(m.war&&m.war.on))m.war=S.war;
  if(S.order)m.order=S.order;
  m.seq=Math.max(S.seq||0,remote.seq||0);
  return m;
}
async function pushState(){
  if(!online())return;
  clearTimeout(NET.pushT);NET.pushT=null;
  try{
    let remote=null;
    try{const r=await STORE.get(roomKey(NET.room),true);if(r&&r.value)remote=JSON.parse(r.value)}catch(e){}
    if(remote)adoptRemote(remote);
    markSeen();rememberSeat();
    S.rev=Math.max((S.rev||0),(remote?remote.rev||0:0))+1;
    await STORE.set(roomKey(NET.room),JSON.stringify(S),true);
    NET.status="synced";stamp();render();
  }catch(e){
    NET.status=STORE.mode()==="database"?"database unreachable, retrying":"sync failed, retrying";stamp();
    NET.pushT=setTimeout(pushState,2500);
  }
}
async function pullState(force){
  if(!online()||NET.busy)return null;
  NET.busy=true;let got=null;
  try{
    const r=await STORE.get(roomKey(NET.room),true);
    if(r&&r.value){
      const rem=JSON.parse(r.value);got=rem;
      if(force){S=rem;NET.status="synced";render()}
      else{adoptRemote(rem);NET.status="synced";render()}
    }
  }catch(e){NET.status="connection trouble";stamp()}
  NET.busy=false;
  maybeRollYear();
  if(S.music&&S.music.list&&S.music.list.length&&!AUD.files.length)musSync(false);
  return got;
}
/* Both seats write in the same year, so revisions collide. Instead of
   comparing them, each machine keeps its own file and always adopts the
   other's. That is idempotent, so repeated polls converge. */
function adoptRemote(rem){
  if(!rem)return;
  // during enrolment the roster is empty and everyone lives in pend, so an
  // empty P is not a reason to skip the merge
  const enrolling=rem.pend&&Object.keys(rem.pend).length;
  if((!rem.P||!rem.P.length)&&!enrolling)return;
  const seat=NET.seat;
  // player one has just set the teams and rewritten who lives where; a room
  // that has not heard about it yet must not be allowed to undo that
  if(S.pairingSet&&!rem.pairingSet)return;
  if((rem.year||0)>(S.year||0)){
    const keep=(S.music&&(S.music.at||0)>((rem.music&&rem.music.at)||0))?S.music:null;
    S=rem;if(keep)S.music=keep;return;                  // they rolled the year over
  }
  if((S.year||0)>(rem.year||0))return;                 // we did, ours stands
  // A fight advances by move count. Whoever has seen more moves holds the real
  // state, regardless of whose turn it is: otherwise the idle side pushes a
  // stale copy back over the move that was just made.
  if(rem.battle&&rem.battle.id&&rem.battle.id===NET.closedBattle)rem=Object.assign({},rem,{battle:null});
  if(rem.battle||S.battle){
    const theirs=rem.battle?(rem.battle.seq||0):-1;
    const mine=S.battle?(S.battle.seq||0):-1;
    if(theirs>mine){S=rem;return}
    if(mine>theirs)return;
  }
  if(ownsSharedMoment())return;                        // only if the scene is waiting on me
  if(rem.exam||rem.resetReq){S=rem;return} // they opened one
  if(!S.house)S.house=[];
  if(!S.ended)S.ended=[];
  for(let i=0;i<rem.P.length;i++){
    if(i===seat)continue;                              // my own file stays mine
    // a seat I am editing from the admin panel stays as I left it until the
    // change has had time to reach them, or each edit undoes the last
    if(S.inject&&S.inject[i]&&Date.now()-(S.inject[i].at||0)<15000
       &&(!rem.inject||!rem.inject[i]||(S.inject[i].at||0)>(rem.inject[i].at||0)))continue;
    if(rem.P[i])S.P[i]=rem.P[i];
    if(rem.house&&rem.house[i])S.house[i]=rem.house[i];
    if(rem.ended)S.ended[i]=!!rem.ended[i];
  }
  S.np=rem.np||S.np;S.pairing=rem.pairing!=null?rem.pairing:S.pairing;
  if(rem.screen==="pairing"&&S.screen==="waiting"&&rem.P&&rem.P.length>=(rem.np||S.np||2)){
    const mine=S.P&&S.P[seat]?S.P[seat]:(S.pend?S.pend[seat]:null);
    S.P=rem.P.slice();
    if(mine)S.P[seat]=mine;
    S.pend=null;S.screen="pairing";
  }
  if(rem.pairingSet&&!S.pairingSet){
    S.pairingSet=true;S.pairing=rem.pairing;
    if(rem.P&&rem.P.length)S.P=rem.P;
    if(rem.screen==="game")S.screen="game";
  }
  // the last seat to file starts the chronicle; everyone else follows here
  if(S.screen==="waiting"&&(rem.screen==="game"||rem.screen==="legacy")){
    S.screen=rem.screen;S.year=rem.year;S.ended=(rem.ended||[]).slice();
    S.coop=rem.coop||S.coop;S.bond=rem.bond||S.bond;
    if(rem.P[seat])S.P[seat]=rem.P[seat];
  }
  S.log=mergeLogs(rem.log,S.log);
  S.taken=Object.assign({},rem.taken||{},S.taken||{});
  if(rem.music&&(!S.music||!S.music.list||!S.music.list.length||(rem.music.at||0)>(S.music.at||0)))S.music=rem.music;
  if(rem.war&&rem.war.on&&!(S.war&&S.war.on))S.war=rem.war;
  if(rem.order)S.order=rem.order;
  // an edit addressed to me from the admin panel on another machine
  if(rem.inject&&rem.inject[seat]&&(rem.inject[seat].at||0)>(NET.injectAt||0)){
    NET.injectAt=rem.inject[seat].at;
    S.P[seat]=rem.inject[seat].p;
    say("Something rewrote the record.",S.P[seat]?S.P[seat].name:"",'big');
  }
  if(rem.inject){
    S.inject=Object.assign({},rem.inject,S.inject||{});
    // drop anything addressed to me that I have already taken
    if(S.inject[seat]&&(S.inject[seat].at||0)<=(NET.injectAt||0))delete S.inject[seat];
  }
  if(rem.claims){S.claims=Object.assign({},rem.claims,S.claims||{})}
  if(rem.pend){
    if(!S.pend)S.pend={};
    Object.keys(rem.pend).forEach(k=>{if(+k!==seat&&!S.pend[k])S.pend[k]=rem.pend[k]});
    if(Object.keys(S.pend).length>=(rem.np||S.np||2)&&S.screen==="waiting"){
      assemble();
      if(S.P.length===seatsWanted()){
        if(S.mode==="duo"&&!S.pairingSet)S.screen="pairing";
        else startGame();
      }
    }
  }
  if(rem.seen){if(!S.seen)S.seen={};Object.keys(rem.seen).forEach(k=>{
    if(+k!==seat)S.seen[k]=Math.max(S.seen[k]||0,rem.seen[k])})}
  if(rem.bond){if(!S.bond)S.bond={};Object.keys(rem.bond).forEach(k=>{if(S.bond[k]==null)S.bond[k]=rem.bond[k]})}
  S.rev=Math.max(S.rev||0,rem.rev||0);
  S.seq=Math.max(S.seq||0,rem.seq||0);
}
/* Seat one holds the clock. Seat two rolls it over only if seat one has
   gone quiet, so a closed tab does not stall the chronicle. */
function maybeRollYear(){
  if(!online()||!S.ended||locked())return;
  if(!allEnded()){NET.bothSince=0;return}
  const now=Date.now();
  if(!NET.bothSince)NET.bothSince=now;
  const mine=NET.seat===0, stalled=now-NET.bothSince>9000||isAway(0);
  if(mine||stalled){
    NET.bothSince=0;
    const y=S.year;
    advanceYear();
    if(S.year!==y)pushState();
  }
}
function stamp(){const el=document.getElementById("netstatus");if(el)el.textContent=netLine()}
function netLine(){
  if(!online())return "";
  const me=S.P&&S.P[NET.seat]?S.P[NET.seat].name:"seat "+(NET.seat+1);
  return `Room ${NET.room} \u00b7 you are ${me} \u00b7 ${NET.status||"connecting"}`;
}
function startPolling(){
  clearInterval(NET.timer);
  NET.timer=setInterval(()=>{
    if(!online())return;
    if(S.screen==="create"||S.screen==="netjoin")return;
    pullState();
  },2200);
  if(!NET.bound){
    NET.bound=true;
    window.addEventListener("focus",()=>{if(online()&&S.screen!=="create"&&S.screen!=="netjoin")pullState()});
  }
}
function hostSetup(m){
  const n=S.np||2,pair=S.pairing||0;
  NET.room=makeCode();NET.seat=0;NET.status="room open";
  S=freshState();S.mode=m;S.np=n;S.pairing=pair;
  if(m==="duo"){S.screen="create";S.creating=0;S.draft=newDraft();startPolling();render();return}
  S.screen="create";S.creating=0;S.draft=newDraft();
  startPolling();render();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function readRoom(code){
  try{const r=await STORE.get(roomKey(code||NET.room),true);return r&&r.value?JSON.parse(r.value):null}
  catch(e){return null}
}
async function writeRoom(obj,code){
  try{await STORE.set(roomKey(code||NET.room),JSON.stringify(obj),true);return true}catch(e){return false}
}
/* Reserving a seat: write a claim, wait, read it back. If somebody else's claim
   is sitting there instead, they got it first and we try the next one. */
function seatFree(rem,i){
  const filled=(rem.P&&rem.P[i])||(rem.pend&&rem.pend[i]);
  if(filled)return false;
  const cl=rem.claims&&rem.claims[i];
  if(!cl)return true;
  if(cl.id===NET.cid)return true;
  return (Date.now()-(cl.at||0))>45000;          // an abandoned claim frees up
}
async function reserveSeat(code,need){
  if(!NET.cid)NET.cid="c"+Math.random().toString(36).slice(2,10);
  for(let tries=0;tries<need+3;tries++){
    const rem=await readRoom(code);
    if(!rem)return {err:"gone"};
    const free=[];
    for(let i=0;i<need;i++)if(seatFree(rem,i))free.push(i);
    if(!free.length)return {err:"full",rem};
    const want=free[0];
    if(!rem.claims)rem.claims={};
    rem.claims[want]={id:NET.cid,at:Date.now()};
    rem.rev=(rem.rev||0)+1;
    await writeRoom(rem,code);
    await sleep(350+Math.random()*450);          // let a rival claim land and be seen
    const check=await readRoom(code);
    if(check&&check.claims&&check.claims[want]&&check.claims[want].id===NET.cid)
      return {seat:want,rem:check};
  }
  return {err:"busy"};
}
async function joinRoom(){
  const code=(NET.pendingCode||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length<5){NET.joinError="Room codes are five characters.";render();return}
  NET.room=code;NET.seat=null;NET.status="reserving a seat";NET.joinError="";
  render();
  const peek=await readRoom(code);
  if(!peek){NET.room=null;NET.joinError="No room with that code. Check the spelling with the host.";S.screen="netjoin";render();return}
  const need=peek.np||2;
  const res=await reserveSeat(code,need);
  if(res.err==="full"){NET.rejoin=res.rem||peek;S.screen="rejoin";render();return}
  if(res.err){NET.room=null;NET.joinError="Could not get a seat. Try again in a moment.";S.screen="netjoin";render();return}
  NET.seat=res.seat;NET.status="connecting";
  S=res.rem;S.battle=null;S.exam=null;NET.pending=null;
  S.screen="create";S.creating=NET.seat;S.draft=newDraft();
  startPolling();render();
}
function leaveRoom(){
  clearInterval(NET.timer);clearTimeout(NET.pushT);
  forgetSeat();NET.rejoin=null;
  NET.room=null;NET.seat=null;NET.status="";NET.joinError="";NET.pendingCode="";NET.pushT=null;
  S=freshState();render();
}

/* ------------------------- BOOT ------------------------- */
S=freshState();
render();
audArm();

</script>
