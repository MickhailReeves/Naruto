function examFor(p){return EXAMS[p.rank]}
function examCost(p){const e=examFor(p);return e?e.cost:1}
function examLabel(p){const e=examFor(p);return e?e.n:"No exam left"}
function examOpen(p){const e=examFor(p);if(!e)return false;return p.age>=e.minAge||power(p)>=e.pw*1.15}
function examSub(p){
  const e=examFor(p);if(!e)return "";
  if(!examOpen(p))return `Opens at age ${e.minAge}, or early at ${Math.round(e.pw*1.15)} power`;
  return `${e.d} \u00b7 needs about ${e.pw} power`;
}
function openExam(){
  const p=me(),e=examFor(p);
  if(!e){say("There is nothing left to be promoted to.",p.name);return}
  if(!examOpen(p)){
    modal("Registration","Not eligible yet",
      `<p>${esc(e.n)} opens at age ${e.minAge}. You are ${p.age}.</p>
       <p class="dim">You can enter early instead if you reach <b class="gold">${Math.round(e.pw*1.15)}</b> power. You are at ${power(p)}.</p>`,
      `<button onclick="closeModal()">Back</button>`,mySeat());
    return;
  }
  const early=p.age<e.minAge;
  const qs=[];const used={};
  while(qs.length<e.qs){const i=rnd(0,QUESTIONS.length-1);if(!used[i]){used[i]=1;qs.push(i)}}
  const sc=[],su={};const nsc=e.to>=2?(e.to>=4?3:2):1;
  while(sc.length<nsc){const i=rnd(0,SCENARIOS.length-1);if(!su[i]){su[i]=1;sc.push(i)}}
  NET.pending=null;
  S.exam={seat:mySeat(),to:e.to,name:e.n,qs,i:0,score:0,phase:"written",hint:p.intel>=e.intel,early,answers:[],
    pw:e.pw,foe:e.foe,sc,si:0,field:0,fieldMax:nsc,fights:e.to>=2?2:1,fightsWon:0,fightNo:0};
  spend(p,e.cost,true);
  touch();render();
}
function viewExam(){
  const X=S.exam,p=S.P[X.seat];
  const mine=!online()||X.seat===NET.seat;
  if(X.phase==="written"){
    const q=QUESTIONS[X.qs[X.i]];
    return `<div class="veil"><div class="modal">
      <div class="tag">${esc(X.name)} \u00b7 written round</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px">
        <h2 style="margin:0;font-size:19px">Question ${X.i+1} of ${X.qs.length}</h2>
        <span class="pips">${X.qs.map((_,i)=>`<b class="${i<X.i?"on":""}"></b>`).join("")}</span>
      </div>
      ${X.hint?`<div class="ribbon gr" style="margin:8px 0">Your study is high enough that the right answer stands out.<small>Study ${Math.round(p.intel)} clears the bar for this exam.</small></div>`:
        `<div class="ribbon r" style="margin:8px 0">Your study is too low to see through the paper.<small>Raise Study before the next exam and the answers get marked for you.</small></div>`}
      <p style="font-size:16px;font-weight:650">${esc(q.q)}</p>
      ${mine?q.a.map((op,i)=>`<button class="qopt ${X.hint&&i===q.c?"hint":""}" onclick="answer(${i})">${esc(op)}</button>`).join("")
        :`<div class="note">Waiting for ${esc(p.name)} to answer.</div>`}
    </div></div>`;
  }
  if(X.phase==="forest")return viewForest();
  if(X.phase==="field"){
    const sc=SCENARIOS[X.sc[X.si]];
    return `<div class="veil"><div class="modal">
      <div class="tag">${esc(X.name)} \u00b7 survival round ${X.si+1} of ${X.sc.length}</div>
      <h2 style="font-size:20px;margin:8px 0 6px">${esc(sc.t)}</h2>
      <div class="ribbon r" style="margin:6px 0">Candidates die in this stage.<small>Each choice is checked against a different attribute. Pick the one you are actually good at.</small></div>
      <p style="font-size:15.5px">${esc(sc.b)}</p>
      ${mine?sc.c.map((c,i)=>{const lab=STATKEYS.find(x=>x[0]===c.s)[1];
        const ok=p[c.s]>=c.n;
        return `<button class="qopt ${X.hint?(ok?"hint":""):""}" onclick="examField(${i})">${esc(c.l)}
          <span style="display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-top:4px">
          ${lab} check \u00b7 needs ${c.n} \u00b7 you have ${Math.round(p[c.s])}${X.hint?(ok?" \u00b7 clears it":" \u00b7 short"):""}</span></button>`}).join("")
        :`<div class="note">Waiting for ${esc(p.name)} to choose.</div>`}
    </div></div>`;
  }
  if(X.phase==="result"){
    return `<div class="veil"><div class="modal center">
      <div class="tag">${esc(X.name)}</div>
      <div style="font-size:44px;margin:6px 0">${X.passed?"\uD83C\uDF8C":"\uD83D\uDCC9"}</div>
      <h2>${X.passed?"Promoted to "+RANKS[X.to]:"Not this time"}</h2>
      <div class="ribbon ${X.passed?"g":"r"}" style="margin-top:10px">${esc(X.verdict)}</div>
      <div class="kv"><span>Written round</span><span>${X.score} of ${X.qs.length}</span></div>
      ${X.forest?`<div class="kv"><span>The forest</span><span>${X.forestScore} of ${X.forest.enc.length} cleared \u00b7 ${X.forestScrolls?"both scrolls":"one scroll"}</span></div>`
        :`<div class="kv"><span>Survival round</span><span>${X.field} of ${X.fieldMax} cleared</span></div>`}
      <div class="kv"><span>Arena</span><span>${X.fightsWon} of ${X.fights} won</span></div>
      <div class="kv"><span>Power at the time</span><span class="gold">\u26A1 ${power(p)} of ${X.pw} expected</span></div>
      ${mine?`<div class="row" style="justify-content:center;margin-top:12px"><button class="bkey" onclick="closeExam()">Continue</button></div>`
        :`<div class="note">Waiting for ${esc(p.name)}.</div>`}
    </div></div>`;
  }
  return "";
}
function answer(i){
  const X=S.exam;if(!X||X.phase!=="written")return;
  if(online()&&X.seat!==NET.seat){pullState();return}
  const q=QUESTIONS[X.qs[X.i]];
  if(i===q.c)X.score++;
  X.answers.push(i);X.i++;
  if(X.i>=X.qs.length){
    const p=S.P[X.seat];
    say(`${p.name} finished the ${X.name} paper with ${X.score} of ${X.qs.length}.`,p.name,"big");
    if(X.to===2){                                  // chunin: into the forest
      X.forest=makeForest(p);X.phase="forest";
      say(`The second stage opens at the gate. Five days, two scrolls, and the forest does not care which village you are from.`,p.name,"big");
      touch();render();return;
    }
    X.phase="field";touch();render();return;
  }
  touch();render();
}
function examField(i){
  const X=S.exam;if(!X||X.phase!=="field")return;
  if(online()&&X.seat!==NET.seat){pullState();return}
  const p=S.P[X.seat],sc=SCENARIOS[X.sc[X.si]],ch=sc.c[i];
  const roll=p[ch.s]+rnd(-10,14)+(p.corps==="anbu"&&ch.s==="speed"?8:0)+(p.corps==="medic"&&ch.s==="control"?8:0);
  if(roll>=ch.n){
    X.field++;bump(p,ch.s,2);
    say(`${sc.t}: ${ch.g}`,p.name,"good");
  }else{
    const dmg=rnd(10,24);
    wound(p,dmg,`${sc.t}: it went badly.`,`Died during the ${X.name}.`);
    say(`${sc.t}: you were not ready for that and it showed.`,p.name,"bad");
    if(p.dead){S.exam=null;touch();render();return}
    if(chance(.18)&&livingMates(p).length){const m=pick(livingMates(p));m.alive=false;
      say(`${m.name} did not come out of the second stage. Candidates die in these. Everyone knows that going in.`,p.name,"bad")}
  }
  if(ch.k)p.karma+=ch.k;
  X.si++;
  if(X.si>=X.sc.length){startExamFight();return}
  touch();render();
}
function startExamFight(){
  const X=S.exam,p=S.P[X.seat],o=S.P[1-X.seat];
  X.phase="battle";X.fightNo++;
  const rival=S.mode==="pvp"&&o&&!o.dead&&!o.rogue&&o.rank===p.rank&&X.fightNo===X.fights;
  const lvl=X.fightNo<X.fights?Math.round(X.foe*0.78):X.foe;
  const foe=rival?o:mkNPC(X.fightNo<X.fights?"Preliminary Opponent":examinerName(X.to),lvl,pick(NATURES));
  say(rival?`The bracket puts ${p.name} against ${o.name} in the final. Of course it does.`
           :`${p.name} steps onto the floor against ${foe.name}.`,p.name,"big");
  touch();startBattle(p,foe,"exam");
}

/* =====================================================================
   THE FOREST
   The second stage of the Chunin Exams. Encounters are generated fresh
   every run from templates with randomised opponents, terrain and stakes,
   so no two attempts read the same. You need both scrolls and you need to
   still be standing when the tower closes. People die in here.
   ===================================================================== */
const FOREST_FOES=["a Kusa team","a Suna pair","an Ame squad","two Iwa candidates","a Kiri trio",
  "a masked candidate with no headband","a team from your own village","a pair who have been following you since the gate"];
const FOREST_PLACES=["a flooded gully","the root system of something enormous","a clearing that is too quiet",
  "a ridge above the river","the underside of a fallen trunk","a stand of trees with claw marks at head height",
  "a dry creek bed","a break in the canopy"];
const FOREST_HOURS=["at first light","around midday","in the last hour of daylight","after dark","in the rain","in fog thick enough to hide a hand"];

const FOREST_TEMPLATES=[
 {k:"ambush",w:4,make:()=>{const foe=pick(FOREST_FOES),pl=pick(FOREST_PLACES),hr=pick(FOREST_HOURS);
   return {t:"Ambushed",b:`${cap1(foe)} hits you ${hr} at ${pl}. They saw you first.`,
    c:[{l:"Fight through them",s:"tai",n:rnd(38,62),g:"You went through the middle of them and did not slow down.",scroll:.5,hurt:[6,16]},
       {l:"Break contact and circle back",s:"speed",n:rnd(34,58),g:"You broke line of sight, went wide, and took them from behind an hour later.",scroll:.45},
       {l:"Genjutsu the lead one",s:"gen",n:rnd(36,60),g:"The one in front started fighting the one behind. You walked out of it.",scroll:.55},
       {l:"Hide and let them pass",s:"control",n:rnd(28,48),g:"You went still. They walked within arm's reach and kept going.",safe:1}]}}},
 {k:"scroll",w:4,make:()=>{const foe=pick(FOREST_FOES),pl=pick(FOREST_PLACES);
   return {t:"They have what you need",b:`${cap1(foe)} is camped at ${pl} and one of them is carrying the scroll you are missing.`,
    c:[{l:"Take it by force",s:"tai",n:rnd(42,66),g:"Direct, loud, and it worked.",scroll:.8,hurt:[8,20]},
       {l:"Steal it while they sleep",s:"speed",n:rnd(40,64),g:"You had it out of the pack and were two ridges away before the watch changed.",scroll:.85},
       {l:"Trade something for it",s:"intel",n:rnd(34,56),g:"You had something they wanted more. Nobody bled.",scroll:.7},
       {l:"Leave them and look elsewhere",s:null,n:0,g:"You let it go and kept moving.",safe:1}]}}},
 {k:"hazard",w:3,make:()=>{const pl=pick(FOREST_PLACES),hr=pick(FOREST_HOURS);
   return {t:"The forest itself",b:`${cap1(hr)} you reach ${pl}, and something about it is wrong before you can say what.`,
    c:[{l:"Push straight through",s:"health",n:rnd(40,64),g:"Whatever it was, you were through it before it finished deciding about you.",hurt:[4,12]},
       {l:"Read the ground first",s:"intel",n:rnd(32,54),g:"You spotted the trigger, the trap and the person who set it, in that order.",safe:1},
       {l:"Go the long way round",s:"speed",n:rnd(26,46),g:"Half a day lost and nothing else.",safe:1,time:1}]}}},
 {k:"beast",w:2,make:()=>{const pl=pick(FOREST_PLACES);
   return {t:"Something large lives here",b:`There are tracks at ${pl} that do not belong to anything on the exam roster.`,
    c:[{l:"Kill it",s:"tai",n:rnd(50,74),g:"You killed it. Word got round the forest before you did.",hurt:[10,24],rep:3},
       {l:"Drive it toward another team",s:"intel",n:rnd(44,68),g:"You pointed it at somebody else's camp and left while it was busy.",scroll:.5},
       {l:"Back away slowly",s:"control",n:rnd(24,44),g:"You backed out without turning around. It let you.",safe:1}]}}},
 {k:"mercy",w:3,make:()=>{const foe=pick(FOREST_FOES);
   return {t:"Someone is dying",b:`A candidate from ${foe} is bleeding out and will not last the night without help. They are not from your village.`,
    c:[{l:"Treat them",s:"control",n:rnd(30,52),g:"You stopped the bleeding. They gave you their scroll unprompted.",scroll:.6,karma:6,time:1},
       {l:"Take their scroll and go",s:null,n:0,g:"You took it. They were still conscious enough to watch you do it.",scroll:.9,karma:-10},
       {l:"Leave them",s:null,n:0,g:"You walked past. The exam does not score you on this.",karma:-3,safe:1}]}}},
 {k:"exhaust",w:3,make:()=>{const hr=pick(FOREST_HOURS);
   return {t:"You have not slept",b:`Day ${"%D%"} ${hr}. Your hands have started shaking and you have stopped noticing things you should notice.`,
    c:[{l:"Push on regardless",s:"health",n:rnd(42,66),g:"You kept moving. It cost you something you will feel later.",hurt:[6,14]},
       {l:"Sleep in shifts and risk it",s:"control",n:rnd(30,52),g:"Four hours in a hollow trunk. Nothing found you.",safe:1,time:1},
       {l:"Set traps and sleep properly",s:"intel",n:rnd(36,58),g:"Two of your wires were tripped in the night and neither of them by anything that got close.",safe:1,time:1}]}}},
 {k:"betray",w:2,make:()=>{const foe=pick(FOREST_FOES);
   return {t:"An offer",b:`${cap1(foe)} proposes an alliance to the tower. It would make the next two days survivable and they would need watching every hour of it.`,
    c:[{l:"Accept and hold to it",s:"intel",n:rnd(34,56),g:"They kept their word. So did you. Both of you made the tower.",scroll:.6,karma:4},
       {l:"Accept, then turn on them",s:"gen",n:rnd(44,68),g:"You waited until the last ridge. It worked and it is going in somebody's report.",scroll:.85,karma:-9},
       {l:"Refuse",s:null,n:0,g:"You said no and kept walking. Alone is slower and simpler.",safe:1}]}}}
];
function cap1(x){return x.charAt(0).toUpperCase()+x.slice(1)}
function makeForest(p){
  const n=rnd(5,7);
  const enc=[];
  const w=[];FOREST_TEMPLATES.forEach(t=>{for(let i=0;i<t.w;i++)w.push(t)});
  let lastK=null;
  for(let i=0;i<n;i++){
    let t=pick(w),guard=0;
    while(t.k===lastK&&guard++<8)t=pick(w);
    lastK=t.k;
    enc.push(t.make());
  }
  return {i:0,day:1,enc,scrolls:{heaven:chance(.5),earth:false},passed:0,failed:0,dead:false};
}
function forestNeeded(F){return !(F.scrolls.heaven&&F.scrolls.earth)}
function viewForest(){
  const X=S.exam,F=X.forest,p=S.P[X.seat];
  const mine=!online()||X.seat===NET.seat;
  const e=F.enc[F.i];
  const body=e.b.replace("%D%",String(F.day));
  return `<div class="veil"><div class="modal">
    <div class="tag">Chunin Exams \u00b7 the forest \u00b7 day ${F.day}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px">
      <h2 style="margin:0;font-size:20px">${esc(e.t)}</h2>
      <span class="pips">${F.enc.map((_,i)=>`<b class="${i<F.i?"on":""}"></b>`).join("")}</span>
    </div>
    <div style="margin:4px 0 10px">
      <span class="chip ${F.scrolls.heaven?"g":""}">${F.scrolls.heaven?"\u2713":"\u2717"} Heaven scroll</span>
      <span class="chip ${F.scrolls.earth?"g":""}">${F.scrolls.earth?"\u2713":"\u2717"} Earth scroll</span>
      <span class="chip ${p.cond<40?"r":""}">Condition ${Math.round(p.cond)}</span>
    </div>
    <div class="ribbon r" style="margin:6px 0">Candidates do not all come out of the forest.
      <small>Each answer is checked against a different attribute. Getting it wrong costs condition, and condition reaching zero here is fatal.</small></div>
    <p style="font-size:15.5px">${esc(body)}</p>
    ${mine?e.c.map((c,i)=>{
      const ok=!c.s||p[c.s]>=c.n;
      return `<button class="qopt ${X.hint&&ok?"hint":""}" onclick="forestPick(${i})">${esc(c.l)}
        <span style="display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-top:4px">
        ${c.s?STATKEYS.find(x=>x[0]===c.s)[1]+" \u00b7 needs "+c.n+" \u00b7 you have "+Math.round(p[c.s]):"no check"}${c.scroll?" \u00b7 scroll chance":""}</span></button>`}).join("")
      :`<div class="note">Waiting for ${esc(p.name)} in the forest.</div>`}
  </div></div>`;
}
function forestPick(i){
  const X=S.exam;if(!X||X.phase!=="forest")return;
  if(online()&&X.seat!==NET.seat){pullState();return}
  const F=X.forest,p=S.P[X.seat],e=F.enc[F.i],c=e.c[i];
  const pass=!c.s||(p[c.s]+rnd(-10,14))>=c.n;
  if(pass){
    F.passed++;
    say(`Forest, day ${F.day}: ${c.g}`,p.name,"good");
    if(c.s)bump(p,c.s,1);
    if(c.karma)p.karma+=c.karma;
    if(c.rep)bump(p,"rep",c.rep);
    if(c.scroll&&forestNeeded(F)&&chance(c.scroll)){
      const need=!F.scrolls.heaven?"heaven":"earth";
      F.scrolls[need]=true;
      say(`They were carrying the ${need} scroll. You have both now.`,p.name,"big");
    }
    if(c.hurt)wound(p,rnd(c.hurt[0],c.hurt[1])*0.6,null,"Died in the Forest of Death.");
  }else{
    F.failed++;
    const h=c.hurt?rnd(c.hurt[0],c.hurt[1]):rnd(8,18);
    say(`Forest, day ${F.day}: that went badly. You were not ready for it.`,p.name,"bad");
    wound(p,h,null,"Died in the Forest of Death.");
    if(chance(.10)){                       // the forest kills outright sometimes
      kill(p,"Killed during the second stage of the Chunin Exams.");
    }
  }
  if(p.dead){S.exam=null;touch();render();return}
  if(c.time)F.day++;
  F.day+=chance(.5)?1:0;
  F.i++;
  if(F.i>=F.enc.length)return forestDone();
  touch();render();
}
function forestDone(){
  const X=S.exam,F=X.forest,p=S.P[X.seat];
  const both=F.scrolls.heaven&&F.scrolls.earth;
  X.forestScore=F.passed;
  X.forestScrolls=both;
  if(!both){
    say(`${p.name} reached the tower on day ${F.day} with one scroll. That is not a pass.`,p.name,"bad");
    X.won=false;X.fightsWon=0;
    examResolve(false);return;
  }
  say(`${p.name} reached the tower on day ${F.day} with both scrolls and ${F.passed} of ${F.enc.length} encounters cleared. The tournament is next.`,p.name,"big");
  bump(p,"rep",5);
  startExamFight();
}

function examinerName(to){
  return ["","Academy Instructor","Tournament Finalist","Specialist Assessor","Jonin Examiner","A Sitting Sannin","The Strongest Name They Have"][to]||"Examiner";
}
function examResolve(won){
  const X=S.exam;if(!X)return;
  const p=S.P[X.seat];
  const need=Math.ceil(X.qs.length*0.5);
  const wrote=X.score>=need;
  const strong=power(p)>=X.pw;
  const fielded=X.forest?(X.forestScrolls&&X.forestScore>=Math.ceil(X.forest.enc.length*0.5)):(X.field>=Math.ceil(X.fieldMax*0.5));
  X.won=won;
  if(!fielded&&won&&wrote){won=chance(.5)}
  let passed=false,verdict="";
  if(won&&wrote&&strong){passed=true;verdict="Clean pass. Paper, fight and field weight all cleared."}
  else if(won&&wrote&&!strong){passed=chance(.35);verdict=passed?"They were not sure you were ready, and the fight convinced them.":"You won and still read as underweight for the rank."}
  else if(won&&!wrote){passed=chance(.25);verdict=passed?"You fought well enough that they overlooked the paper.":"The panel said you fight well and think badly."}
  else if(!won&&X.score===X.qs.length){passed=chance(.55);verdict=passed?"You lost the match and got promoted anyway. They watched how you lost.":"A perfect paper was not quite enough after that loss."}
  else{verdict="No promotion. Come back when more of it is there."}
  const o=S.P[1-X.seat];
  if(passed&&X.to===6&&o&&!o.dead&&o.rank===6&&o.village===p.village&&!o.rogue){
    passed=false;verdict=`The hat is already on ${o.name}'s head, and ${vilOf(p).n} only has one.`;
  }
  if(passed){
    p.rank=X.to;p.titles.push(RANKS[X.to]);bump(p,"rep",8+X.to*3);bump(p,"intel",2);
    say(`${p.name} passed the ${X.name}${X.early?" early":""} and is now ${RANKS[X.to]}.`,p.name,"big");
    if(X.to===5)say(`${p.name} wears the hat of ${vilOf(p).n}. It is heavier than the stories say.`,p.name,"big");
  }else{
    bump(p,"intel",2);
    say(`${p.name} did not pass the ${X.name}.`,p.name,"bad");
  }
  X.passed=passed;X.verdict=verdict;X.phase="result";
  touch();render();
}
function closeExam(){if(!S.exam)return;if(online()&&S.exam.seat!==NET.seat)return;S.exam=null;touch();render();const p=me();if(p&&p.ap<=0)endTurn()}


/* =====================================================================
   THE EYE LINES
   Sharingan into Mangekyo into Eternal, Byakugan into Tenseigan, and the
   two clans who chase the Rinnegan by putting someone else's tissue in
   their own body. All of it costs something, and most of it can kill you.
   ===================================================================== */
const MSPOWERS={
 amaterasu:{n:"Amaterasu",cost:30,scale:"gen",mult:2.2,eff:"dot",
   d:"Black fire that fixes on what you look at and will not be put out."},
 kamui:{n:"Kamui",cost:28,scale:"control",mult:2.0,eff:"phase",
   d:"You step part of yourself out of the world. The next thing aimed at you passes through."},
 mindhold:{n:"Kotoamatsukami",cost:34,scale:"gen",mult:1.2,eff:"stun2",
   d:"You put an instruction in their head that they believe is their own. Holds them two turns."},
 dreamprison:{n:"Tsukuyomi",cost:32,scale:"gen",mult:2.4,eff:"stun",
   d:"Three days of it inside a second of the real thing."},
 rewrite:{n:"Izanagi",cost:36,scale:"chakra",mult:0,eff:"rewrite",
   d:"One killing blow becomes something that did not happen. Once, and it costs an eye's worth of sight."}
};
const SUSANOO={n:"Susanoo",cost:34,scale:"chakra",mult:2.6,eff:"shield",
  d:"A ribcage of chakra closes around you, and then a fist."};
function msOf(p){return p.ms?MSPOWERS[p.ms]:null}
function hasMS(p){return !!p.ms}
function msLimit(p){return p.ems?Infinity:12}
function msLeft(p){return p.ems?Infinity:Math.max(0,msLimit(p)-(p.msUses||0))}
/* Clan friendships. These exist so an eye has somewhere to come from. */
function friendsOf(p){if(!p.friends)p.friends=[];return p.friends}
function makeFriend(p,clan){
  return {name:npcName(),clan,bond:rnd(8,20),alive:true,onMission:false,
    dj:CLANS[clan]&&DOJUTSU.indexOf(CLANS[clan].kg)>=0?CLANS[clan].kg:null,
    msPower:clan==="uchiha"?pick(Object.keys(MSPOWERS)):null};
}
function eyeClanOf(p){
  if(kgLvlOf(p,"sharingan"))return "uchiha";
  if(kgLvlOf(p,"byakugan"))return "hyuga";
  return null;
}

    ${F.length?F.map((f,i)=>`<div class="per ${f.alive?"":"dead"}" style="margin-bottom:8px">
      <b>${esc(f.name)}</b><div class="r">${esc(CLANS[f.clan].n)}${f.dj?" \u00b7 "+esc(KG[f.dj].n):""}${f.msPower&&f.bond>=100?" \u00b7 "+esc(MSPOWERS[f.msPower].n):""}</div>
      ${f.alive?bar("Trust",f.bond,100,f.bond>=100?"g":"gr"):`<div class="chip r">Died on a mission with you</div>`}
      </div>`).join(""):`<div class="note">Nobody from your line is close to you yet.</div>`}`;
  let btns=F.filter(f=>f.alive).map((f,i)=>`<button class="act" onclick="friendTime(${F.indexOf(f)})" ${p.ap<1?"disabled":""}>
      <span class="ic">\uD83E\uDD1D</span><span class="tx"><b>Time with ${esc(f.name)}</b>
      <span>Trust ${Math.round(f.bond)} of 100${f.bond>=100?" \u00b7 they would follow you anywhere":""}</span></span></button>`).join("");
  F.forEach((f,i)=>{if(f.alive&&f.bond>=100)
    btns+=`<button class="act bdanger" onclick="friendMission(${i})" ${p.ap<2?"disabled":""}>
      <span class="ic">\u2620\uFE0F</span><span class="tx"><b>Take ${esc(f.name)} on a hard mission</b>

  if(F.filter(f=>f.alive).length<3&&clan)
    btns+=`<button class="act" onclick="newFriend()" ${p.ap<1?"disabled":""}><span class="ic">\uD83D\uDC65</span>
      <span class="tx"><b>Meet someone else from the clan</b><span>One action</span></span></button>`;
  modal("Your line",clan?CLANS[clan].n+" company":"Company",body,btns+`<button onclick="closeModal()">Back</button>`,mySeat());

function newFriend(){
  const p=me(),clan=eyeClanOf(p);closeModal();
  friendsOf(p).push(makeFriend(p,clan));
  say(`${p.name} fell in with another of the ${CLANS[clan].n}.`,p.name);
  spend(p,1);
}
function friendTime(i){
  const p=me(),f=friendsOf(p)[i];closeModal();
  if(!f||!f.alive)return;
  const g=rnd(9,18);
  f.bond=clamp(f.bond+g,0,100);
  say(f.bond>=100
    ?`${f.name} would put themselves in front of anything for you now, and both of you know it.`
    :`An evening with ${f.name}. Trust up ${g}, now ${Math.round(f.bond)}.`,p.name,"good");
  spend(p,1);
}
function friendMission(i){
  const p=me(),f=friendsOf(p)[i];closeModal();
  if(!f||!f.alive||f.bond<100)return;
  const pay=rnd(2000,5200);p.ryo+=pay;bump(p,"rep",6);
  if(chance(.40)){
    f.alive=false;
    say(`${f.name} did not come back. It was not your fault and that is not going to help.`,p.name,"bad");
    p.karma-=2;wound(p,rnd(4,10));
    modal("Afterwards",`${f.name} is dead`,
      `<p>The body is here. What they were carrying behind their eyes is still good for a few hours, and there is
       somebody two districts over who does not ask questions.</p>
       <p class="dim">This is a decision that changes what you are. It cannot be taken back.</p>`,
      `<button class="act bdanger" onclick="carryBody(${i})"><span class="ic">\u26B0\uFE0F</span><span class="tx">
        <b>Carry the body back</b><span>Their eyes go in your pocket</span></span></button>
       <button class="act" onclick="buryFriend(${i})"><span class="ic">\uD83C\uDF3F</span><span class="tx">
        <b>Bury them properly</b><span>Nothing gained. It is the decent thing.</span></span></button>`,mySeat());
    return;
  }
  say(`Hard mission with ${f.name}, and both of you walked out. ${pay} ryo.`,p.name,"good");

}
function buryFriend(i){
  const p=me();closeModal();

function carryBody(i){
  const p=me(),f=friendsOf(p)[i];closeModal();
  if(!f)return;
  p.karma-=9;
  if(!p.bag)p.bag=[];
  p.bag.push({id:f.dj||"sharingan",from:f.name,ms:f.msPower||null,fresh:true});
  say(`You carried ${f.name} back yourself. What they were carrying is in a jar now, and it is still viable.`,p.name,"bad");

  if(p.rank<4)return false;
  const c=p.clan;
  if(c==="senju"&&!kgLvlOf(p,"rinnegan"))return true;
  if(c==="uchiha"&&!kgLvlOf(p,"rinnegan"))return true;
  if((p.bag||[]).length)return true;
  if(p.blindEye&&(p.bag||[]).some(x=>x.ms))return true;
  return false;
}

function buyScalpel(){
  const p=me();closeModal();
  if(p.ryo<35000)return;
  p.ryo-=35000;p.scalpel=true;bump(p,"control",4);
  say(`${p.name} paid a great deal of money for a technique that cuts nerve from muscle without opening the skin.`,p.name,"big");
  spend(p,1);
}
function eyePrice(x){return (x.id==="rinnegan"?90000:x.id==="byakugan"?26000:x.ms?48000:22000)}
function implantOdds(p){
  return clamp(0.30+p.control*0.004+p.health*0.003+compBuff(p,"inf")*0.05-kgsOf(p).length*0.05,0.15,0.72);
}
function implantOutcome(p,kind,label){
  const r=Math.random(),odds=implantOdds(p);
  if(r<odds)return "ok";
  if(r<odds+0.10)return "dead";
  return "reject";
}
function implant(kind){
  const p=me();closeModal();
  const out=implantOutcome(p,kind);
  if(out==="dead"){
    kill(p,`Died on a table in a back room, chasing the Rinnegan.`);
    render();return;
  }
  if(out==="reject"){
    if(kind==="sharingan"){
      p.blindEye=true;bump(p,"gen",-6);bump(p,"control",-4);
      say(`The eye did not take. ${p.name} can see out of one side and guesses at the rest. It is permanent.`,p.name,"bad");
    }else{
      p.rejection=true;bump(p,"health",-10);bump(p,"speed",-5);
      say(`The cells fought back. ${p.name} runs a fever that never fully breaks and tires faster than they should. It is permanent.`,p.name,"bad");
    }
    wound(p,rnd(14,26));
    spend(p,1);return;
  }
  addKG(p,"rinnegan",1);
  const h=houseOf(p);if(h.blood.indexOf("rinnegan")<0)h.blood.push("rinnegan");
  p.titles.push("Rinnegan");
  bump(p,"chakra",8);bump(p,"nin",6);bump(p,"control",5);bump(p,"rep",16);
  say(`It took. Rings all the way out from the pupil, and nobody alive can tell ${p.name} what to expect next.`,p.name,"big");
  spend(p,1);
}
function implantBag(i){
  const p=me(),x=(p.bag||[])[i];closeModal();
  if(!x)return;
  // an Eternal set from a friend's Mangekyo is the one operation that does not fail
  if(x.ms&&p.blindEye){
    p.bag.splice(i,1);
    p.ems=true;p.blindEye=false;p.msUses=0;
    if(!p.ms)p.ms=x.ms;
    bump(p,"gen",8);bump(p,"nin",6);bump(p,"chakra",6);bump(p,"rep",14);
    p.titles.push("Eternal Mangekyo");
    say(`The sight came back, and it came back permanently. ${p.name} will not go blind again, and the old techniques cost nothing but chakra now.`,p.name,"big");
    spend(p,1);return;
  }
  if(x.id==="byakugan"&&kgLvlOf(p,"byakugan")>=5&&!p.tenseigan){
    p.bag.splice(i,1);
    p.tenseigan=true;
    bump(p,"chakra",12);bump(p,"control",10);bump(p,"tai",6);bump(p,"rep",16);
    p.titles.push("Tenseigan");
    say(`Two Byakugan over one another and something older than either opens up. ${p.name} carries the Tenseigan.`,p.name,"big");
    spend(p,1);return;
  }
  const out=implantOutcome(p,x.id);
  p.bag.splice(i,1);
  if(out==="dead"){kill(p,`Died under a back-room knife with somebody else's eyes half set.`);render();return}
  if(out==="reject"){
    p.blindEye=true;bump(p,"gen",-5);
    say(`The eye rejected and took some of ${p.name}'s own sight with it. Permanent.`,p.name,"bad");
    wound(p,rnd(12,24));spend(p,1);return;
  }
  addKG(p,x.id,1);
  const h=houseOf(p);if(h.blood.indexOf(x.id)<0)h.blood.push(x.id);
  bump(p,"rep",8);
  say(`${KG[x.id].n} set and holding. ${p.name} is carrying something that was somebody else's this morning.`,p.name,"big");
  spend(p,1);
}

function msSpend(p){
  if(p.ems)return;
  p.msUses=(p.msUses||0)+1;
  const left=msLeft(p);
  if(left===4)say(`Edges are going soft when ${p.name} looks at anything far away.`,p.name,"bad");
  if(left<=0&&!p.blindEye){
    p.blindEye=true;
    say(`${p.name} has used the eye once too often. The world has gone dim and it is not coming back on its own.`,p.name,"bad");
  }
}

/* ------------------------- BATTLE ------------------------- */

/* =====================================================================
   STATUS EFFECTS
   Anything that lingers on a fighter lives here. Each entry ticks at the
   end of the afflicted fighter's own turn.
   ===================================================================== */
const STATUS={
 stun:{n:"Stunned",ic:"\u26A1",bad:1,d:"loses their turn"},
 burn:{n:"Burning",ic:"\uD83D\uDD25",bad:1,d:"takes damage each turn"},
 bleed:{n:"Bleeding",ic:"\uD83E\uDE78",bad:1,d:"damage that ignores guard"},
 poison:{n:"Poisoned",ic:"\u2620\uFE0F",bad:1,d:"damage, and healing is halved"},
 seal:{n:"Sealed",ic:"\uD83D\uDD12",bad:1,d:"cannot use chakra techniques"},
 blind:{n:"Blinded",ic:"\uD83D\uDC41\uFE0F",bad:1,d:"accuracy badly reduced"},
 slow:{n:"Slowed",ic:"\uD83D\uDC0C",bad:1,d:"loses the initiative"},
 guardup:{n:"Guarded",ic:"\uD83D\uDEE1\uFE0F",d:"incoming damage reduced"},
 focus:{n:"Focused",ic:"\uD83C\uDFAF",d:"accuracy and damage raised"},
 regen:{n:"Regenerating",ic:"\uD83D\uDC9A",d:"recovers each turn"}
};
function addStatus(f,id,turns,mag){
  if(!f.st)f.st={};
  const cur=f.st[id];
  if(cur){cur.t=Math.max(cur.t,turns);cur.m=Math.max(cur.m||0,mag||0)}
  else f.st[id]={t:turns,m:mag||0};
}
function hasStatus(f,id){return !!(f.st&&f.st[id]&&f.st[id].t>0)}
function statusMag(f,id){return (f.st&&f.st[id])?(f.st[id].m||0):0}
function clearStatus(f,id){if(f.st)delete f.st[id]}
function statusChips(f){
  if(!f.st)return "";
  return Object.keys(f.st).filter(k=>f.st[k].t>0).map(k=>
    `<span class="chip ${STATUS[k].bad?"r":"gr"}" style="margin:0 3px 3px 0;padding:2px 7px;font-size:10px">${STATUS[k].ic} ${f.st[k].t}</span>`).join("");
}
function tickStatus(f){
  if(!f.st)return;
  const B=S.battle;
  Object.keys(f.st).forEach(k=>{
    const s=f.st[k];
    if(s.t<=0){delete f.st[k];return}
    if(k==="burn"||k==="bleed"||k==="poison"){
      const d=Math.max(2,Math.round(s.m||6));
      f.hp-=d;
      B.lines.push(`<span class="hit">${STATUS[k].ic} ${f.name} takes ${d} from ${STATUS[k].n.toLowerCase()}.</span>`);
    }
    if(k==="regen"){
      const h=Math.max(2,Math.round(s.m||6));
      f.hp=Math.min(f.max,f.hp+h);
      B.lines.push(`<span class="hl">\uD83D\uDC9A ${f.name} recovers ${h}.</span>`);
    }
    s.t--;
    if(s.t<=0){
      delete f.st[k];
      if(k!=="guardup"&&k!=="focus")B.lines.push(`<span class="sys">${f.name} is no longer ${STATUS[k].n.toLowerCase()}.</span>`);
    }
  });
}
/* ---------- elemental interaction ----------
   Fire > Wind > Lightning > Earth > Water > Fire.
   Only your PRIMARY nature can be exploited by an attacker. Your secondary
   nature never makes you vulnerable, but attacking with either of your own
   natures can exploit the defender's primary. */
function natEdge(atkNat,def){
  if(!atkNat||atkNat==="None")return 1;
  const d=def.nat;                                   // primary only
  if(!d||d==="None")return 1;
  if(BEATS[atkNat]===d)return 1.45;                  // strong against
  if(BEATS[d]===atkNat)return 0.65;                  // weak against
  return 1;
}
function edgeWord(m){return m>1.2?" The nature advantage tells.":m<0.85?" Their nature blunts it badly.":""}
/* Speed decides who moves, not who declared first. */
function initiative(f){
  const p=f.p;
  let v=p.speed*1.6+p.tai*0.3+(f.P.acc||0)*20+rnd(0,14);
  if(hasStatus(f,"slow"))v*=0.6;
  if(hasStatus(f,"focus"))v*=1.15;
  if(p.sage)v*=1.1;
  return v;
}
function rollInitiative(){
  const B=S.battle;
  const a=initiative(B.A),b=initiative(B.B);
  B.turn=a>=b?"A":"B";
  B.lines.push(`<span class="sys">Initiative: ${(a>=b?B.A:B.B).name} is faster off the mark (${Math.round(a)} to ${Math.round(b)}).</span>`);
}
/* Vitality is durability: it soaks a share of every hit. */
function mitigate(f,raw,pierce){
  const p=f.p;
  const flat=p.tai*0.20+p.health*0.16+(f.shield||0);
  const soak=clamp(p.health/(p.health+190),0,.34);    // proportional durability, capped so tanks are not immune
  let d=raw*(1-soak*(1-clamp(pierce,0,.9)));
  d-=flat*(1-clamp(pierce,0,.85));
  if(hasStatus(f,"guardup"))d*=0.6;
  return Math.max(3,d);
}

function passives(p){
  const out={evade:0,acc:0,pierce:0,regen:0,negate:0,hp:0,cpregen:0,leech:0,burn:0,corrode:0,poison:0,shield:0,copy:0,natboost:0};
  const k=kgOf(p);
  kgsOf(p).forEach(e=>{const kk=KG[e.id];if(kk)Object.entries(kk.passive).forEach(([a,v])=>out[a]+=v*e.lvl)});
  if(p.sixpaths){out.acc+=.18;out.evade+=.14;out.pierce+=.30;out.regen+=.06}
  if(p.corps==="anbu"){out.acc+=.10;out.pierce+=.10}
  if(p.corps==="medic"){out.regen+=.05;out.negate+=.06}
  if(p.avenge)out.natboost+=.10;
  if(p.sage){out.acc+=.08;out.evade+=.08;out.regen+=.03}
  if(p.beast)out.hp+=.05*BEASTS[p.beast].t*0.2;
  return out;
}
function mkFighter(p,seat,ai,x2){
  const P=passives(p);
  if(x2){p=JSON.parse(JSON.stringify(p));STATKEYS.forEach(([k])=>p[k]=Math.min(CAP*2,p[k]*2))}
  const hp=Math.round((100+p.health*3.4+p.chakra*1.3+p.rank*10)*(1+P.hp)*(0.5+0.5*clamp((p.cond==null?100:p.cond)/100,0,1)));
  const cp=Math.round(52+p.chakra*3+p.control*1.7);
  return {p,seat,ai:!!ai,name:p.name,hp,max:hp,cp,cpmax:cp,guard:0,stun:0,shield:0,dots:[],evx:0,st:{},P};
}
function mkNPC(name,lvl,nat){
  const p=newPlayer(-1);
  p.name=name;p.nat=nat||pick(NATURES);p.village="konoha";p.clan="civilian";p.isNPC=true;
  STATKEYS.forEach(([k])=>p[k]=clamp(lvl+rnd(-5,6),4,CAP));
  p.rank=clamp(Math.floor(lvl/16),0,6);p.cond=100;
  p.jutsu=["clone",starterJutsu(p.nat)];
  if(lvl>40)p.jutsu.push(pick(Object.keys(JUTSU).filter(id=>JUTSU[id].nat===p.nat)));
  if(lvl>62){p.clan=pick(["hyuga","yotsuki","hozuki","nara"]);p.kgs=[{id:CLANS[p.clan].kg,lvl:lvl>88?2:1}]}

function moveList(f){

    out.push(Object.assign({id:"mspow",nat:"None",d:"Mangekyo \u00b7 "+(p.ems?"unlimited":msLeft(p)+" uses left")},MSPOWERS[p.ms]));
  }

  if(p.clan==="uzumaki")out.push({id:"uzuregen",n:"Life Conversion",cost:0,nat:"None",eff:"convert",d:"Burn your own vitality back into chakra"});

    out.push({id:"biju",n:b.n+" cloak",cost:26,nat:b.nat,scale:"chakra",mult:1.6*b.p,eff:"cloak",d:"Tailed beast chakra"})}

}

function act(i){
  const B=S.battle;if(!B||B.over)return;
  if(online()){const who=B.turn==="A"?B.aIdx:B.bIdx;
    const mine=who>=0?who===NET.seat:B.owner===NET.seat;
    if(!mine){pullState();return}}
  const atk=B.turn==="A"?B.A:B.B,def=B.turn==="A"?B.B:B.A;
  const list=moveList(atk),m=list[i]||list[0];
  if(!m)return;
  resolve(atk,def,m);after();
}
function aiTurn(){
  const B=S.battle;if(!B||B.over)return;
  const atk=B.turn==="A"?B.A:B.B,def=B.turn==="A"?B.B:B.A;
  const opts=moveList(atk).filter(m=>atk.cp>=(m.cost||0));
  let m;
  if(atk.hp<atk.max*.28&&chance(.35))m=opts.find(x=>x.eff==="guard")||opts[0];
  else{
    const heavy=opts.filter(x=>x.mult&&x.mult>=1.9);
    m=(heavy.length&&chance(.62))?pick(heavy):pick(opts.filter(x=>x.eff!=="guard"))||opts[0];
  }
  resolve(atk,def,m);after();
}
function resolve(atk,def,m){
  const B=S.battle,p=atk.p,q=def.p,PA=atk.P,PD=def.P;
  if(hasStatus(atk,"stun")){
    B.lines.push(`\u26A1 ${atk.name} is stunned and cannot move.`);
    tick(atk);flip();return;
  }
  if(hasStatus(atk,"seal")&&(m.cost||0)>0){
    B.lines.push(`\uD83D\uDD12 ${atk.name} reaches for chakra and finds it sealed.`);
    tick(atk);flip();return;
  }
  const V=()=>0.87+Math.random()*0.28;
  let txt="",dmg=0,hits=1;
  if(m.eff==="convert"){                                     // Uzumaki life conversion
    const lvl=kgLvlOf(p,"chains")||1;
    const cost=Math.round(atk.max*(0.16-lvl*0.025));
    const gain=Math.round(atk.cpmax*0.42+lvl*8);
    atk.hp-=cost;atk.cp=Math.min(atk.cpmax,atk.cp+gain);
    B.lines.push(`${atk.name} burns ${cost} of their own vitality straight back into chakra. <span class="hl">+${gain} cp</span>`);
    tick(atk);flip();return;
  }
  if(m.id==="mspow"||m.id==="susanoo"){msSpend(p)}
  if(m.eff==="harvest"){                                     // chakra scalpel
    const dj=dojutsuOf(q);
    const base2=(6+p.control*1.4)*V();
    let d2=mitigate(def,base2,0.25);
    def.hp-=d2;
    let line=`${atk.name} opens ${def.name} up with a blade of pure chakra. <span class="hit">${Math.round(d2)} damage</span>`;
    if(dj&&!q.isNPC===false||dj){
      const odds=clamp(0.10+p.control*0.004+(def.hp<def.max*0.35?0.22:0),0.08,0.55);
      if(chance(odds)){
        if(!p.bag)p.bag=[];
        p.bag.push({id:dj.id,from:q.name,ms:q.ms||null,fresh:true});
        q.kgs=(q.kgs||[]).filter(x=>x.id!==dj.id);
        addStatus(def,"blind",2);
        line+=` <b class="gold">The ${KG[dj.id].n} comes out with it.</b>`;
        say(`${p.name} took ${q.name}'s ${KG[dj.id].n} out of their head mid-fight.`,p.name,"big");
      }else line+=` They twisted away before the eye came with it.`;
    }
    B.lines.push(line);
    tick(atk);flip();return;
  }
  if(m.eff==="phase"){                                       // Kamui
    addStatus(atk,"focus",2);atk.evx=0.55;
    B.lines.push(`${atk.name} steps most of themselves out of the world. <span class="hl">The next thing aimed at them will pass through.</span>`);
    tick(atk);flip();return;
  }
  if(m.eff==="rewrite"){                                     // Izanagi
    atk.rewrite=true;
    if(!p.ems){p.blindEye=true;say(`${p.name} spent the sight in one eye to make something not have happened.`,p.name,"bad")}
    B.lines.push(`${atk.name}'s outline goes indistinct. <span class="hl">The next killing blow will not have landed.</span>`);
    tick(atk);flip();return;
  }
  if(m.eff==="guard"){
    atk.guard=1;atk.cp=Math.min(atk.cpmax,atk.cp+18);
    B.lines.push(`${atk.name} substitutes out and breathes. Chakra back.`);
    tick(atk);flip();return;
  }
  atk.cp-=(m.cost||0);
  const scale=m.scale==="best"?Math.max(p.nin,p.tai,p.gen,p.control):p[m.scale||"tai"];
  const nat=m.nat==="None"?"None":m.nat;
  const em=natEdge(nat,q);                            // defender's PRIMARY nature only
  let base=(9+scale*(m.mult||1.5))*V()*em*(1+(nat!=="None"?PA.natboost:0));
  if(hasStatus(atk,"focus"))base*=1.18;
  base*=1+((B.turn==="A"?B.aGr:B.bGr)||0);            // losing to them before sharpens you
  if(m.eff==="double")hits=2,base*=0.62;
  if(m.id==="biju"&&p.bond<45){const back=rnd(5,14);atk.hp-=back;txt+=` The cloak burns ${atk.name} for ${back}.`}
  // accuracy
  const hitc=clamp(0.90+PA.acc-PD.evade-def.evx-(hasStatus(atk,"blind")?0.30:0)-(atk.p.blindEye?0.18:0),0.20,0.99);
  let total=0,missed=0;
  for(let h=0;h<hits;h++){
    if(!chance(hitc)){missed++;continue}
    if(PD.negate&&chance(PD.negate)){missed++;continue}
    let d=mitigate(def,base,PA.pierce+(m.eff==="pierce"?.35:0));
    if(def.guard){d*=.5;def.guard=0;txt+=` ${def.name} substituted in time.`}
    total+=d;
  }
  def.hp-=total;
  const name=`${atk.name} uses ${m.n}.`;
  if(total>0){
    txt=name+txt+edgeWord(em)+
      ` <span class="hit">${Math.round(total)} damage</span>`+(missed?` <span class="dim">(${missed} missed)</span>`:"");
  }else txt=name+txt+` <span class="dim">No damage landed.</span>`;
  // effects
  if(total>0){
    if(m.eff==="dot"||PA.burn>0){addStatus(def,"burn",2,Math.round(total*0.18+4));txt+=" It keeps burning."}
    if(m.eff==="stun"&&chance(.45)){addStatus(def,"stun",m.stunT||1);txt+=` ${def.name} is held.`}
    if(m.eff==="stun2"){addStatus(def,"stun",2);txt+=` ${def.name} is following an instruction they think is their own.`}
    if(m.eff==="bleed"){addStatus(def,"bleed",3,Math.round(total*0.14+3));txt+=" The wound will not close."}
    if(m.eff==="blindfoe"){addStatus(def,"blind",2);txt+=` ${def.name} cannot see properly.`}
    if(m.eff==="slow"){addStatus(def,"slow",2);txt+=` ${def.name} is a step behind now.`}
    if(m.eff==="drain"){const g=Math.round(total*0.3);def.cp=Math.max(0,def.cp-g);atk.cp=Math.min(atk.cpmax,atk.cp+g);txt+=` Chakra pulled across.`}
    if(m.eff==="seal"){const g=rnd(14,26);def.cp=Math.max(0,def.cp-g);addStatus(def,"seal",1);txt+=` ${g} chakra sealed off and the pathways shut.`}
    if(PA.leech){const g=Math.round(total*PA.leech);atk.cp=Math.min(atk.cpmax,atk.cp+g)}
    if(PA.corrode)def.shield=Math.max(0,def.shield-4);
    if(PA.poison&&chance(.5))addStatus(def,"poison",2,rnd(4,8));
    if(PA.copy&&chance(PA.copy)&&!p.isNPC){txt+=` ${atk.name}'s eye copies the shape of it.`;atk.cp=Math.min(atk.cpmax,atk.cp+10)}
  }
  if(m.eff==="heal"){let h=Math.round(atk.max*0.14+scale*0.5);if(hasStatus(atk,"poison"))h=Math.round(h*0.5);atk.hp=Math.min(atk.max,atk.hp+h);txt+=` <span class="hl">${h} recovered.</span>`}
  if(m.eff==="shield"){atk.shield+=10;addStatus(atk,"guardup",2);txt+=` <span class="hl">Guard raised.</span>`}
  if(m.eff==="evade"){atk.evx=0.25;txt+=` <span class="hl">Harder to hit next exchange.</span>`}
  if(m.eff==="cloak"){atk.shield+=5}
  B.lines.push(`<span class="sys">R${B.round}</span> `+txt);
  tick(atk);if(B.turn==="B")B.round++;flip();
}
function tick(f){
  // end of the acting fighter's turn
  tickStatus(f);
  if(f.P.regen){const h=Math.round(f.max*f.P.regen);f.hp=Math.min(f.max,f.hp+h);}
  if(f.P.cpregen){f.cp=Math.min(f.cpmax,f.cp+Math.round(f.cpmax*f.P.cpregen))}
  f.cp=Math.min(f.cpmax,f.cp+4);
  f.evx=0;f.shield=Math.max(0,f.shield-2);
}
function flip(){S.battle.turn=S.battle.turn==="A"?"B":"A"}
function after(){
  const B=S.battle;
  B.seq=(B.seq||0)+1;                                  // this copy has seen one more move
  [B.A,B.B].forEach(f=>{
    if(f.hp<=0&&f.rewrite){
      f.rewrite=false;f.hp=Math.round(f.max*0.35);
      B.lines.push(`<b class="gold">${f.name} is standing where they were a moment ago, unmarked. That did not happen.</b>`);
    }
  });
  if(B.A.hp<=0||B.B.hp<=0){
    B.over=true;
    const w=B.A.hp>0?B.A:B.B,l=B.A.hp>0?B.B:B.A;
    B.lines.push(`<b class="gold">${w.name} is standing. ${l.name} is not.</b>`);
  }
  touch();render();
  if(!B.over){
    const cur=B.turn==="A"?B.A:B.B;
    if(cur.ai&&(!online()||B.owner===NET.seat))setTimeout(aiTurn,700);
  }
}
function finishBattle(){
  const B=S.battle;if(!B||!B.over)return;
  NET.closedBattle=B.id;                        // this machine is done with it
  if(B.resolved){S.battle=null;touch();render();return}
  B.resolved=true;                              // whoever gets here first settles it
  const aWin=B.A.hp>0,w=aWin?B.A:B.B,l=aWin?B.B:B.A;
  const wp=w.p,lp=l.p;
  S.battle=null;
  if(!wp.isNPC){wp.wins++;bump(wp,"rep",5);bump(wp,"tai",1);bump(wp,"speed",1)}
  if(!wp.isNPC&&!lp.isNPC&&(B.kind==="pvp"||B.kind==="contest"))noteDuel(wp,lp);
  if(!lp.isNPC){lp.losses++;bump(lp,"rep",-2);
    wound(lp,B.kind==="boss"?rnd(20,40):B.kind==="exam"?rnd(5,12):rnd(6,16),null,"Killed in a fight they chose to finish.")}
  if(B.kind==="exam"){
    const X=S.exam;
    if(!X){touch();render();return}
    if(X.seat===w.seat)X.fightsWon++;
    if(X.fightNo<X.fights&&X.seat===w.seat&&!S.P[X.seat].dead){startExamFight();return}
    examResolve(X.fightsWon>0&&X.seat===w.seat);return;
  }
  if(B.kind==="pvp"||B.kind==="contest"){
    const lethal=(B.tag||"").indexOf("lethal")>=0;
    if((B.tag||"").indexOf("bounty")>=0&&!wp.isNPC&&lp.rogue){
      const bounty=3000+lp.rogueRank*4000;wp.ryo+=bounty;bump(wp,"rep",10);
      say(`${w.name} collected the contract on ${l.name}. ${bounty} ryo, paid without a receipt.`,"Bingo Book","big");
    }
    if(lethal&&!wp.isNPC&&!lp.isNPC){
      if(wp.avenge&&wp.avenge.name===lp.name){
        say(`${w.name} finished what they came for. ${wp.avenge.parent} is still dead, but the ledger is closed.`,"Duel","big");
        wp.titles.push("Avenger");bump(wp,"rep",20);wp.avenge=null;
      }
      lp.killedBy=wp.name;
      const dj=dojutsuOf(lp);
      if(dj&&wp.rogue){
        say(`${l.name} was still warm when ${w.name} knelt down with a blade.`,"Duel","bad");
        transplant(wp,dj.id);
      }
      kill(lp,`Killed by ${wp.name} in a death match. There was no ambiguity about the terms.`);
      bump(wp,"rep",14);wp.karma-=6;
      say(`${l.name} is dead. ${w.name} agreed to those terms too.`,"Duel","big");
    }else if(!lethal){
      say(`${w.name} beat ${l.name}. Nobody is pretending it was friendly.`,"Duel","big");
    }
    S.lethal=false;
  }
  if(B.kind==="boss"){
    say(`${w.name} walked away from ${l.name}.`,"Registry","big");
    const eye=(B.tag||"").indexOf("eyes:")===0?B.tag.slice(5):null;
    if(eye&&!wp.isNPC){transplant(wp,eye)}

  }
  touch();render();
}
/* Rank matching: same rank only. Jonin and Kage count as one tier and may
   fight each other freely. A missing-nin may be fought at any rank above genin. */
function tierOf(p){return p.rank>=4?9:p.rank}
function duelLegal(a,b){
  if(a.dead||b.dead)return {ok:false,why:"One of you is dead."};
  if(a.rogue||b.rogue){
    const loyal=a.rogue?b:a;
    if(loyal.rank<2)return {ok:false,why:"A missing-nin will not be baited by a genin."};
    return {ok:true,why:"Missing-nin fight anyone above genin \u00b7 2 actions"};
  }
  if(tierOf(a)===9&&tierOf(b)===9)return {ok:true,why:"Jonin tier and above fight freely \u00b7 2 actions"};
  if(a.rank!==b.rank)return {ok:false,why:`Ranks do not match. ${RANKS[a.rank]} against ${RANKS[b.rank]} is not sanctioned.`};
  return {ok:true,why:"Same rank, sanctioned \u00b7 2 actions"};
}

function duel(){
  closeModal();
  const p=me(),o=S.P[NET.duelTarget!=null?NET.duelTarget:(them()||{}).seat];
  if(!o)return;
  spend(p,2,true);startBattle(p,o,"pvp",S.lethal?"lethal":"");
}
function bountyHunt(seat){
  const p=me(),o=seat!=null?S.P[seat]:them();
  if(!o)return;
  NET.duelTarget=o.seat;
  modal("Bingo Book",`Contract on ${o.name}`,
    `<p>${esc(o.name)} is listed as ${esc(ROGUE[o.rogueRank])}. The village will pay, and will not ask how.</p>
     <div class="kv"><span>Bounty</span><span class="gold">\u00a5 ${3000+o.rogueRank*4000}</span></div>
     <div class="rule"></div>
     <div class="tog ${S.lethal?"on":""}" onclick="toggleLethal('hunt')"><span class="sw"></span>
       <span><b>Bring them in dead</b><br><span class="dim" style="font-size:12.5px">${S.lethal
         ?"If you win, they die permanently."
         :"Capture only. They live."}</span></span></div>`,
    `<button class="act bdanger" onclick="closeModal();startHunt()"><span class="ic">\uD83C\uDFAF</span>
      <span class="tx"><b>Take the contract</b><span>Two actions</span></span></button>
     <button onclick="closeModal()">Leave it on the board</button>`,mySeat());
}
/* A modal keeps a snapshot of its own markup, so flipping a switch inside one
   has to build the panel again or nothing appears to move. */
function toggleLethal(which){
  S.lethal=!S.lethal;
  if(which==="hunt")bountyHunt(NET.duelTarget);
  else duelSetup(NET.duelTarget);
}
function startHunt(){
  const p=me(),o=S.P[NET.duelTarget!=null?NET.duelTarget:(them()||{}).seat];
  if(!o)return;
  spend(p,2,true);startBattle(p,o,"pvp",(S.lethal?"lethal ":"")+"bounty");
}

    {l:"Refuse the assignment",f:p=>{bump(p,"nin",5);bump(p,"rep",-4);return "You kept the field slot. The squad went to someone else."}}]},
{id:"summit",min:22,max:90,w:2,cond:p=>p.rank>=4,

];
function other(p){const o=liveOthers(p);return o.length?o[p.seat%o.length]:null}
function rollEvent(p){
  if(!p||p.dead)return;
  if(!p.cool)p.cool={};
  const rep_ok={festival:8,injury:10,market:9,hunted:5,beast:6,squad:9,
    x_brief:7,x_pinned:7,x_scroll:8,x_rumour:8,x_drink:6,x_orders:8,x_letter:7,x_defector:9};
  const o=other(p);
  const pool=EVENTS.filter(e=>p.age>=e.min&&p.age<=e.max
    &&(!e.two||(o&&!o.dead))
    &&(!e.cond||e.cond(p))
    &&!p.cool[e.id]
    &&!(p.flags["e_"+e.id]&&!(e.id in rep_ok)));
  if(!pool.length)return;
  const w=[];pool.forEach(e=>{for(let i=0;i<(e.w||1);i++)w.push(e)});
  const e=pick(w);
  p.flags["e_"+e.id]=1;
  p.cool[e.id]=rep_ok[e.id]||99;                     // years before it can return
  ["festival","injury","market","x_drink"].forEach(k=>{if(k!==e.id)p.cool[k]=Math.max(p.cool[k]||0,2)});
  modal(`Age ${p.age}`,e.t,`<p>${esc(e.b)}</p>`,
    e.c.map((c,i)=>`<button class="act" onclick="resolveEvent('${e.id}',${i})"><span class="ic">\u276F</span><span class="tx"><b>${esc(c.l)}</b></span></button>`).join(""),
    p.seat);
  touch();
}
function resolveEvent(id,i){
  if(!NET.pending)return;
  const e=EVENTS.find(x=>x.id===id),p=S.P[NET.pending.eventFor!=null?NET.pending.eventFor:mySeat()];
  if(!e||!p)return;
  closeModal();
  const out=e.c[i].f(p);
  say(out,p.name,"big");
  if(p.cond<=0&&!p.dead)kill(p,"Died of accumulated injuries.");
  touch();render();maybeAutoEnd();
}

   for the whole room at once and every player answers it separately, so it

function ARC(){ if(!S.arc)S.arc={age:0,start:1,ch:0,order:50,secrets:50,done:{},answers:{},log:[],history:[]}; return S.arc }
function arcShift(k,d){const a=ARC();a[k]=clamp(a[k]+d,0,100)}

}

function eraFor(a){return ERAS[Math.min(a,ERAS.length-1)]}
function ageChapters(){
  const a=ARC();
  const set=eraFor(a.age||0);
  return set.map(ch=>Object.assign({},ch,{year:(ch.year!=null?ch.year:(a.start||1)+ch.off)}));
}

function chapterDue(){
  const a=ARC();
  const set=ageChapters();
  for(let i=0;i<set.length;i++){
    const ch=set[i];
    if(S.year>=ch.year && !a.done[ch.id]) return ch;
  }
  return null;
}
function chapterIndex(ch){return ageChapters().findIndex(x=>x.id===ch.id)}
function arcPending(p){
  const ch=chapterDue();
  if(!ch)return null;
  const a=ARC();
  if(a.answers[ch.id+":"+p.seat])return null;      // this player already answered
  return ch;
}
function openChapter(){
  const p=me(),ch=arcPending(p);
  if(!ch)return;
  modal("The chronicle \u00b7 chapter "+(chapterIndex(ch)+1),ch.t,
    `<p style="font-size:15.5px">${esc(ch.b)}</p>
     <div class="note">Everyone in this chronicle answers separately. What the room decides together moves the world.</div>`,
    ch.c.map((c,i)=>`<button class="act" onclick="answerChapter('${ch.id}',${i})"><span class="ic">\u276F</span>
      <span class="tx"><b>${esc(c.l)}</b></span></button>`).join(""),
    mySeat());
}
function answerChapter(id,i){
  const p=me(),ch=ageChapters().find(x=>x.id===id);closeModal();
  if(!ch)return;
  const a=ARC(),c=ch.c[i];
  a.answers[id+":"+p.seat]={i,name:p.name};
  arcShift("order",c.order); arcShift("secrets",c.secrets);
  p.karma+=Math.round(c.order/6);
  bump(p,"rep",Math.abs(c.order)>=12?4:2);
  say(`${c.g}`,p.name,"big");
  // once every living player has answered, the chapter closes and the world moves
  const live=S.P.filter(q=>!q.dead);
  const all=live.every(q=>a.answers[id+":"+q.seat]);
  if(all){
    a.done[id]=true; a.ch=chapterIndex(ch)+1; a.total=(a.total||0)+1;
    const split=new Set(live.map(q=>a.answers[id+":"+q.seat].i)).size>1;
    a.log.push({id,tag:arcTag(),split});
    say(`Chapter ${a.ch} closes. ${split?"You did not all answer the same way, and it shows.":"You answered as one, and the world noticed."} `
      +`Trust between the villages reads ${a.order>=66?"strong":a.order<=33?"badly frayed":"uneasy"}; `
      +`what is buried stays buried ${a.secrets>=66?"almost entirely":a.secrets<=33?"hardly at all":"about as often as not"}.`,"The Chronicle","big");
    if(a.order<=25&&!S.war.on&&chance(.7))declareWar(p,"a summit that ended without anyone shaking hands");
    if(ageChapters().every(x=>a.done[x.id]))closeAge();
    if(a.order>=75&&S.war.on&&chance(.7))endWar();
    if(a.secrets<=25)say("Too much has come out. Three villages are conducting internal reviews and nobody's file is closed.","The Chronicle","bad");
  }
  touch();render();
}
/* An age ends, its verdict is written down, and the next one opens. The
   chronicle outlives every character in it. */
function closeAge(){
  const a=ARC();
  const e=arcEnding();
  a.history.push({age:(a.age||0)+1,title:e.title,tag:e.tag,order:a.order,secrets:a.secrets});
  say(`So ends ${e.title}. ${e.text}`,"The Chronicle","big");
  if((a.age||0)>=ERAS.length-1){
    say("The chronicle has run its full length. Whatever happens now is yours to write.","The Chronicle","big");
    a.age=ERAS.length-1; a.done={}; a.answers={}; a.ch=0; a.start=S.year+6;
    // the last era loops, drifting back toward the middle
    a.order=Math.round(a.order*0.7+15); a.secrets=Math.round(a.secrets*0.7+15);
    return;
  }
  a.age=(a.age||0)+1;
  a.start=S.year+5;
  a.done={}; a.answers={}; a.ch=0;
  // the world does not reset, it carries the weight forward
  a.order=clamp(Math.round(a.order*0.75+12),8,92);
  a.secrets=clamp(Math.round(a.secrets*0.75+12),8,92);
  say(`A new age opens in ${VILLAGES[S.P[0].village].n} and everywhere else. The first chapter of it lands in five years, and the people who answer it may not be you.`,"The Chronicle","big");
}
function arcEnding(){
  const a=ARC();
  const t=arcTag();
  const E={
   alliance:{t:"The Long Accord",d:"Five villages signed something that held. It is not peace exactly, but nobody under thirty remembers the last war, and that is new."},
   fracture:{t:"The Broken Table",d:"The summits stopped being held. Borders hardened, patrols doubled, and the maps started disagreeing with each other again."},
   exposure:{t:"The Open Archive",d:"Everything came out. Every village had to look at what it had done and explain it out loud, and several never recovered their footing."},
   silence:{t:"The Quiet Years",d:"Nothing came out. The villages kept their arrangements, the archives stayed shut, and the record you leave has holes in it you put there."},
   drift:{t:"The Middle Years",d:"No accord, no collapse. The villages went on distrusting each other at a manageable volume, which most people call normal."}
  }[t];
  return {tag:t,title:E.t,text:E.d,chapters:a.total||a.ch,order:a.order,secrets:a.secrets};
}


/* =====================================================================
   THE KAGE ELECTION
   The hat is not handed out after an exam. When the seat opens, the village
   holds a race: four years to declare, then a campaign fought on renown,
   record and argument. Players from the same village compete against each
   other and against whoever the council puts forward. Ignore it and the
   career politicians will take it off you.
   ===================================================================== */
const NPCSTYLE=[
 {n:"war record",d:"campaigns on the missions nobody else came back from",b:"rep"},
 {n:"the elders",d:"has the clan heads in a room and keeps them there",b:"intel"},
 {n:"reform",d:"promises to open the archives and means about half of it",b:"gen"},
 {n:"continuity",d:"promises nothing will change and delivers on it",b:"intel"},
 {n:"the academy",d:"taught half the jonin in this village and they remember",b:"rep"}
];
function ELE(){return S.election}
function eleOpen(v,year){
  S.election={village:v,opened:year,closes:year+4,decided:false,winner:null,
    cands:[],polls:[],round:0,lastPoll:0};
  const e=S.election;
  // the council always fields names of its own
  const used={};
  for(let i=0;i<3;i++){
    let st=pick(NPCSTYLE);let guard=0;
    while(used[st.n]&&guard++<10)st=pick(NPCSTYLE);
    used[st.n]=1;
    e.cands.push({name:npcName()+" "+pick(["of the Council","of the Guard","of the Archive","of the Border Corps"]),
      npc:true,style:st,support:rnd(26,44),seat:null});
  }
  say(`The seat of ${VILLAGES[v].n} is open. Declarations close in four years, and the council has already put three names forward.`,"Registry","big");
}
function eleEligible(p){
  const e=ELE();
  if(!e||e.decided)return false;
  if(p.rogue||p.dead)return false;
  if(p.village!==e.village)return false;
  if(p.rank<4)return false;                      // jonin and up
  if(S.year>e.closes)return false;
  return !e.cands.some(c=>c.seat===p.seat);
}
function eleMine(p){const e=ELE();return e?e.cands.find(c=>c.seat===p.seat):null}
/* Campaigning runs on its own budget. You do not have to choose between
   running for office and having a life, but the budget is tight. */
function campMax(p){return 2+(p.rep>=70?1:0)+(p.corps==="anbu"?0:0)}
function campLeft(p){const m=eleMine(p);if(!m)return 0;
  if(m.year!==S.year){m.year=S.year;m.left=campMax(p)}
  return m.left;}
function campSpend(p){const m=eleMine(p);if(!m)return;campLeft(p);m.left=Math.max(0,m.left-1)}
function eleRunning(){const e=ELE();return e&&!e.decided}
function eleStandings(){
  const e=ELE();if(!e)return [];
  return e.cands.slice().sort((a,b)=>b.support-a.support);
}
function eleDeclare(){
  const p=me(),e=ELE();closeModal();
  if(!eleEligible(p))return;
  p.campUsed={};
  e.cands.push({name:p.name,npc:false,seat:p.seat,year:S.year,left:2,support:Math.round(10+p.rep*0.35+p.rank*4),
    style:{n:"your own record",d:"runs on what is actually in the file",b:"rep"}});
  bump(p,"rep",4);
  say(`${p.name} declared for the seat of ${VILLAGES[e.village].n}. Three council names and now a shinobi with a field record.`,"Registry","big");
  touch();spend(p,1);
}
/* Campaigning costs actions. Spend them or watch the polls run away. */
const CAMPAIGN=[
 {id:"rally",n:"Hold a public rally",s:"gen",ic:"\uD83D\uDCE3",d:"Loud, fast, and it moves the undecided"},
 {id:"elders",n:"Sit with the clan heads",s:"intel",ic:"\uD83C\uDFEF",d:"Slow, private, and it moves the people who count votes"},
 {id:"mission",n:"Take a visible S-rank",s:"tai",ic:"\u2694\uFE0F",d:"A record beats a speech, if you survive it"},
 {id:"debate",n:"Debate the other candidates",s:"intel",ic:"\uD83D\uDDE3\uFE0F",d:"High risk. You can lose ground here"}
];
function menuCampaign(){
  const p=me(),e=ELE(),mine=eleMine(p);
  const st=eleStandings(),tot=st.reduce((a,c)=>a+c.support,0)||1;
  let body=`<div class="card" style="margin-bottom:10px"><span class="cap">
      ${e.decided?"Result":S.year<=e.closes?"Declarations close in "+(e.closes-S.year+1)+" year"+(e.closes-S.year+1===1?"":"s"):"Campaign"}</span>
    <h3 style="margin:2px 0 8px">${esc(VILLAGES[e.village].n)}</h3>
    ${st.map(c=>{const pct=Math.round(c.support/tot*100);
      return `<div style="margin-bottom:7px">
        <div class="kv"><span>${c.npc?"":"\u2605 "}${esc(c.name)}${c.seat===p.seat?" (you)":""}</span>
        <span class="${c.seat===p.seat?"gold":""}">${pct}%</span></div>
        <div class="bar"><i class="${c.seat===p.seat?"g":c.npc?"":"p"}" style="width:${pct}%"></i></div>
        <div class="dim" style="font-size:11.5px;margin-top:2px">${esc(c.style.d)}</div></div>`}).join("")}
    </div>`;
  let btns="";
  if(!mine&&eleEligible(p)){
    btns+=`<button class="act bkey" onclick="eleDeclare()"><span class="ic">\uD83D\uDC51</span><span class="tx">
      <b>Declare for the seat</b><span>One action. You will be running against ${e.cands.length} names.</span></span></button>`;
  }else if(!mine&&S.year>e.closes){
    body+=`<div class="ribbon r">Declarations are closed. You did not enter.</div>`;
  }else if(!mine&&p.rank<4){
    body+=`<div class="ribbon r">Only jonin and above may stand.</div>`;
  }
  if(mine&&!e.decided){
    const left=campLeft(p);
    body+=`<div class="kv" style="margin:6px 0 2px"><span>Campaign actions left this year</span>
      <span class="ap">${Array.from({length:campMax(p)}).map((_,i)=>`<b class="${i<left?"":"off"}"></b>`).join("")}</span></div>
      <div class="note" style="margin-bottom:8px">Separate from your three yearly actions. Unspent ones do not carry over.</div>`;
    btns+=CAMPAIGN.map(c=>{
      const used=(p.campUsed&&p.campUsed[c.id])||0;
      return `<button class="act" onclick="campaign('${c.id}')" ${left<1?"disabled":""}>
      <span class="ic">${c.ic}</span><span class="tx"><b>${esc(c.n)}</b>
      <span>${esc(c.d)} \u00b7 ${STATKEYS.find(x=>x[0]===c.s)[1]} check${used?" \u00b7 used "+used+"x, landing softer":""}</span></span></button>`}).join("");
  }
  btns+=`<button onclick="closeModal()">Back</button>`;
  modal("The election",e.decided?"Decided":"The seat of "+VILLAGES[e.village].en,body,btns,mySeat());
}
function campaign(id){
  const p=me(),e=ELE(),mine=eleMine(p);closeModal();
  if(!mine||e.decided)return;
  if(campLeft(p)<1){say("No campaign time left this year.",p.name);render();return}
  campSpend(p);
  if(!p.campUsed)p.campUsed={};
  p.campUsed[id]=(p.campUsed[id]||0)+1;
  const c=CAMPAIGN.find(x=>x.id===id);
  const roll=p[c.s]+p.rep*0.3+rnd(-18,22);
  const fat=Math.pow(0.90,(p.campUsed[id]||1)-1);   // voters tire of a repeated tactic
  if(id==="debate"){
    if(roll>=70){mine.support+=Math.round(rnd(11,18)*fat);bump(p,"rep",3);
      say(`${p.name} took the debate apart. The room moved.`,p.name,"good");}
    else{mine.support=Math.max(0,mine.support-rnd(4,10));bump(p,"rep",-2);
      say(`${p.name} was outargued in public and it is going to be quoted for months.`,p.name,"bad");}
  }else if(id==="mission"){
    if(roll>=62){mine.support+=Math.round(rnd(10,16)*fat);p.ryo+=2000;bump(p,"rep",5);
      say(`${p.name} took an S-rank in the middle of a campaign and came back with it done.`,p.name,"good");}
    else{mine.support+=rnd(0,3);wound(p,rnd(10,22),"The mission went badly and the village watched it go badly.");
      say(`${p.name}'s campaign mission did not go to plan.`,p.name,"bad");}
  }else{
    const g=Math.max(1,Math.round(((roll-40)/5.5)*fat));
    mine.support+=g;
    say(id==="rally"
      ?`${p.name} spoke in the square. Support up ${g}.`
      :`${p.name} spent the week in small rooms with people who decide things. Support up ${g}.`,p.name,"good");
  }
  touch();render();
}
/* Every year the council names gain ground on their own. A candidate who
   does nothing will be overtaken, which is the point. */
function eleTick(){
  const e=ELE();
  if(!e||e.decided)return;
  e.cands.forEach(c=>{
    if(c.npc)c.support+=rnd(9,16);
    else{
      const p=S.P[c.seat];
      if(!p||p.dead){c.support=Math.max(0,c.support-14);return}
      c.support+=Math.round(1+p.rep*0.03);        // name recognition alone
    }
  });
  // a poll lands every year of the race
  if(S.year>e.lastPoll){
    e.lastPoll=S.year;
    const st=eleStandings(),tot=st.reduce((a,c)=>a+c.support,0)||1;
    const lead=st[0];
    say(`Polling for ${VILLAGES[e.village].n}: ${st.slice(0,4).map(c=>esc(c.name)+" "+Math.round(c.support/tot*100)+"%").join(", ")}.`
      +(lead.npc?" A council name is ahead.":" "+lead.name+" is ahead."),"The Election");
  }
  if(S.year>e.closes+3)eleDecide();
}
function eleDecide(){
  const e=ELE();if(!e||e.decided)return;
  e.decided=true;
  const st=eleStandings(),w=st[0];
  e.winner=w.name;
  if(!w.npc&&S.P[w.seat]&&!S.P[w.seat].dead){
    const p=S.P[w.seat];
    p.rank=6;p.titles.push(VILLAGES[e.village].n.replace("gakure","")+"kage");
    bump(p,"rep",28);
    say(`${p.name} takes the seat of ${VILLAGES[e.village].n}. The hat is heavier than the stories say.`,"The Election","big");
  }else{
    say(`${w.name} takes the seat of ${VILLAGES[e.village].n}. ${st.some(c=>!c.npc)?"The shinobi who stood were outmanoeuvred by people who do this for a living.":"Nobody with a field record stood, so the council chose from its own."}`,"The Election","big");
  }
  const losers=st.filter(c=>!c.npc&&c!==w&&S.P[c.seat]&&!S.P[c.seat].dead);
  losers.forEach(c=>{bump(S.P[c.seat],"rep",6);
    say(`${S.P[c.seat].name} came ${st.indexOf(c)+1}${["st","nd","rd"][st.indexOf(c)]||"th"} and did not get it. Everyone now knows the name.`,S.P[c.seat].name)});
}
/* The seat opens once somebody in the village is senior enough to want it. */
function eleMaybeOpen(){
  if(S.election)return;
  const held=S.P.some(p=>!p.dead&&p.rank===6);
  if(held)return;
  const ready=S.P.filter(p=>!p.dead&&!p.rogue&&p.rank>=4);
  if(!ready.length)return;
  if(S.year<12)return;
  eleOpen(ready[0].village,S.year);
}


/* =====================================================================
   THE RECORD
   A life summary when someone dies, a hall of records that outlives the
   chronicle, head-to-head memory between players, and a short explainer
   the first time somebody sits down.
   ===================================================================== */
function lifeSummary(p){
  const k=kgsOf(p),h=houseOf(p);
  const notable=[];
  if(p.sixpaths)notable.push("carried Six Paths chakra");
  if(p.ems)notable.push("wore an Eternal Mangekyo");
  else if(p.ms)notable.push("awakened the Mangekyo");
  if(p.tenseigan)notable.push("opened the Tenseigan");
  if(p.sage)notable.push("held "+SAGES[p.sage].n);
  if(p.beast)notable.push("carried the "+BEASTS[p.beast].t+"-Tails");
  if(p.rank===6)notable.push("wore the hat");
  else if(p.rank===5)notable.push("was named Sannin");
  if(p.rogue)notable.push("left the village and never came back");
  if(p.blindEye)notable.push("went blind and kept working");
  if(p.corps)notable.push("served in the "+CORPS[p.corps].n);
  if((p.kids||[]).length)notable.push("left "+p.kids.length+" child"+(p.kids.length===1?"":"ren"));
  if(p.married)notable.push("was married to "+p.partner.name);
  const scroll=(h.scroll||[]).filter(j=>j.inventor===p.name);
  if(scroll.length)notable.push("invented "+scroll.length+" technique"+(scroll.length===1?"":"s"));
  return {notable,k,scroll};
}

const RECKEY="shinobi-records";
function loadRecords(){

function saveRecord(p){

/* ---------- head to head between players ---------- */
function h2hKey(a,b){return [a,b].sort().join("v")}
function h2h(a,b){
  if(!S.h2h)S.h2h={};
  const k=h2hKey(a.seat,b.seat);
  if(!S.h2h[k])S.h2h[k]={};
  return S.h2h[k];
}
function noteDuel(w,l){
  if(w.isNPC||l.isNPC)return;
  const r=h2h(w,l);
  r[w.seat]=(r[w.seat]||0)+1;
  r.last=w.seat;r.total=(r.total||0)+1;
}
function h2hLine(p,o){
  if(!S.h2h)return null;
  const r=S.h2h[h2hKey(p.seat,o.seat)];
  if(!r||!r.total)return null;
  const mine=r[p.seat]||0,theirs=r[o.seat]||0;
  return {mine,theirs,total:r.total,
    grudge:theirs>mine?Math.min(0.25,(theirs-mine)*0.06):0};
}

/* =====================================================================
   FIELD WORK
   B-rank and above stop being a dice roll and become a short scene built
   fresh each time, the way the forest is. D and C stay quick, because most
   of a shinobi's early career should be.
   ===================================================================== */
const M_TARGETS=["a warlord who has been buying shinobi by the dozen","a border fort that keeps changing hands",
 "a caravan carrying something the manifest does not mention","a defecting researcher and everything in their head",
 "a bridge the enemy needs and you do not","a nobleman who has been funding both sides",
 "a supply line running through a valley nobody patrols","a sealed vault under an abandoned shrine"];
const M_SNAGS=["the intelligence was a week old","there are civilians in the building","your contact never showed",
 "it is raining hard enough to blind everyone","they were expecting somebody","there are twice as many as briefed",
 "the client lied about what you were collecting","a rival village's team is already inside"];
const M_PLACES=["a river crossing","the third floor of a building that should be empty","a tunnel under the wall",
 "a courtyard with too many exits","a treeline above the road","a market at closing time"];
const M_SCENES=[
 {k:"approach",make:()=>{const pl=pick(M_PLACES),sn=pick(M_SNAGS);
  return {t:"Getting in",b:`You are at ${pl} and ${sn}.`,
   c:[{l:"Go in fast before it gets worse",s:"speed",n:rnd(36,62),g:"You were through before anyone finished deciding.",p:1},
      {l:"Wait and re-read the ground",s:"intel",n:rnd(34,58),g:"Twenty minutes of watching saved you an hour of fighting.",p:1},
      {l:"Make a distraction somewhere else",s:"gen",n:rnd(38,64),g:"They all went to look at the fire. You went the other way.",p:1},
      {l:"Walk in like you belong there",s:"control",n:rnd(30,54),g:"Nobody stops a person who is not hurrying.",p:1}]}}},
 {k:"contact",make:()=>{const t=pick(M_TARGETS);
  return {t:"The objective",b:`It comes down to ${t}.`,
   c:[{l:"Take it head on",s:"tai",n:rnd(42,70),g:"Direct. It worked and it was noisy.",p:2,hurt:[8,18]},
      {l:"Do it without being seen",s:"speed",n:rnd(44,72),g:"Done, and nobody will be sure when.",p:2},
      {l:"Talk your way through it",s:"intel",n:rnd(38,64),g:"You found the thing they wanted more than this.",p:2,karma:3},
      {l:"Overwhelm it with everything you have",s:"nin",n:rnd(46,74),g:"You spent most of your chakra and it stayed spent.",p:2,hurt:[4,10]}]}}},
 {k:"out",make:()=>{const sn=pick(M_SNAGS);
  return {t:"Getting out",b:`On the way back, ${sn}.`,
   c:[{l:"Break contact and run",s:"speed",n:rnd(34,60),g:"You lost them in the dark and did not stop until morning.",p:1},
      {l:"Set an ambush of your own",s:"intel",n:rnd(40,66),g:"They walked into it in a line.",p:1},
      {l:"Stand and finish it",s:"tai",n:rnd(44,70),g:"You turned round. It did not take long.",p:1,hurt:[6,16]},
      {l:"Hide until they give up",s:"control",n:rnd(30,56),g:"Nine hours under a floor. They gave up first.",p:1}]}}}
];
function makeMissionScene(){
  const n=rnd(2,3),out=[];
  const pool=M_SCENES.slice();
  out.push(pool[0].make());
  out.push(pool[1].make());
  if(n>2)out.push(pool[2].make());
  return out;
}
function startFieldMission(r){
  const p=me();
  const m=MISSIONS.find(x=>x.r===r);
  S.field={r,seat:mySeat(),i:0,scenes:makeMissionScene(),pts:0,need:m.need,pay:m.pay,risk:m.risk,rep:m.rep};
  say(`${p.name} took an ${r}-rank and went out.`,p.name);
  touch();render();
}
function viewField(){
  const F=S.field,p=S.P[F.seat],sc=F.scenes[F.i];
  const mine=!online()||F.seat===NET.seat;
  return `<div class="veil"><div class="modal">
    <div class="tag">${esc(F.r)}-rank \u00b7 stage ${F.i+1} of ${F.scenes.length}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px">
      <h2 style="margin:0;font-size:20px">${esc(sc.t)}</h2>
      <span class="pips">${F.scenes.map((_,i)=>`<b class="${i<F.i?"on":""}"></b>`).join("")}</span>
    </div>
    <p style="font-size:15.5px">${esc(sc.b)}</p>
    ${mine?sc.c.map((c,i)=>{
      const ok=p[c.s]>=c.n;
      return `<button class="qopt ${ok?"hint":""}" onclick="fieldPick(${i})">${esc(c.l)}
        <span style="display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-top:4px">
        ${STATKEYS.find(x=>x[0]===c.s)[1]} \u00b7 needs ${c.n} \u00b7 you have ${Math.round(p[c.s])}</span></button>`}).join("")
      :`<div class="note">Waiting for ${esc(p.name)} in the field.</div>`}
  </div></div>`;
}
function fieldPick(i){
  const F=S.field;if(!F)return;
  if(online()&&F.seat!==NET.seat){pullState();return}
  const p=S.P[F.seat],sc=F.scenes[F.i],c=sc.c[i];
  const pass=(p[c.s]+rnd(-10,14))>=c.n;
  if(pass){
    F.pts+=c.p||1;
    say(`${F.r}-rank, ${sc.t.toLowerCase()}: ${c.g}`,p.name,"good");
    bump(p,c.s,1);
    if(c.karma)p.karma+=c.karma;
    if(c.hurt)wound(p,rnd(c.hurt[0],c.hurt[1])*0.5,null,`Died on an ${F.r}-rank mission.`);
  }else{
    say(`${F.r}-rank, ${sc.t.toLowerCase()}: it did not go the way you called it.`,p.name,"bad");
    wound(p,rnd(9,20)+F.need*0.01,null,`Died on an ${F.r}-rank mission.`);
    if(F.risk>=.4&&chance(.07)){kill(p,`Killed on an ${F.r}-rank mission.`);S.field=null;touch();render();return}
  }
  if(p.dead){S.field=null;touch();render();return}
  F.i++;
  if(F.i>=F.scenes.length)return fieldDone();
  touch();render();
}
function fieldDone(){
  const F=S.field,p=S.P[F.seat];
  const max=F.scenes.reduce((a,s)=>a+Math.max(...s.c.map(c=>c.p||1)),0);
  const ok=F.pts>=Math.ceil(max*0.55);
  p.missions++;
  if(ok){
    const pay=Math.round(F.pay*(1+p.rep/260)*budget("eco")*(1+F.pts/max*0.3));
    p.ryo+=pay;bump(p,"rep",F.rep);p.karma+=F.r==="S"?-1:1;
    STATKEYS.forEach(([k])=>{if(chance(.35))bump(p,k,rnd(0,2))});
    say(`${F.r}-rank complete, ${F.pts} of ${max} stages clean. Paid ${pay} ryo.`,p.name,"good");
    if(isCoop())setBond(teamOf(p),bondOf(teamOf(p))+1);
  }else{
    bump(p,"rep",-F.rep*0.8);
    say(`${F.r}-rank failed. You got out, which is more than the objective can say.`,p.name,"bad");
    if(chance(.16)&&livingMates(p).length)casualty(p);
  }
  S.field=null;
  const q=p;
  touch();spend(q,1);
}


/* =====================================================================
   JOINT OPERATIONS
   One player proposes, names who they want, and spends an action. Each
   invitee answers on their own turn. Once everybody has replied the mission
   opens for all of them at once, and every stage is voted on. Ties are
   settled by a coin. Everyone who went comes back a step behind: the year
   after costs them an action.
   ===================================================================== */
function JOINT(){return S.joint}
function jointParty(){
  const J=JOINT();if(!J)return [];
  return S.P.filter(q=>!q.dead&&J.accepted&&J.accepted[q.seat]);
}
function jointPending(){
  const J=JOINT();if(!J)return [];
  return (J.invited||[]).filter(i=>J.replies&&J.replies[i]===undefined);
}
function jointAsksMe(){
  const J=JOINT();
  if(!J||J.started)return false;
  const me2=mySeat();
  return (J.invited||[]).indexOf(me2)>=0 && (!J.replies||J.replies[me2]===undefined);
}
function jointInvolvesMe(){
  const J=JOINT();
  return !!(J&&J.accepted&&J.accepted[mySeat()]);
}
function menuJointInvite(){
  const p=me();
  const others2=S.P.filter(q=>!q.dead&&q!==p);
  if(!others2.length)return;
  if(!NET.pick)NET.pick={};
  const body=`<p class="dim">Name everyone you want on this. Each of them will be asked on their own turn, and the
    operation opens once they have all answered. Anyone who declines is left out of it.</p>
    <div class="ribbon c" style="margin:10px 0">Costs you one action now.
      <small>Everybody who goes starts the following year with two actions instead of three.</small></div>
    <div class="eyebrow">Who are you taking</div>
    <div class="grid g2" style="margin-top:8px">
      ${others2.map(q=>`<button class="pick ${NET.pick[q.seat]?"on":""}" onclick="NET.pick[${q.seat}]=!NET.pick[${q.seat}];menuJointInvite()">
        <div class="t">${esc(q.name)}</div>
        <div class="s">${esc(RANKS[q.rank]||"")} \u00b7 \u26A1${power(q)}</div></button>`).join("")}
    </div>`;
  const chosen=others2.filter(q=>NET.pick[q.seat]);
  modal("Joint operation","Put a team together",body,
    `<button class="act bkey" onclick="sendJoint()" ${chosen.length?"":"disabled"}><span class="ic">\uD83D\uDCE8</span>
      <span class="tx"><b>Send the request</b><span>${chosen.length?chosen.map(q=>esc(q.name)).join(", "):"Nobody selected yet"}</span></span></button>
     <button onclick="closeModal()">Back</button>`,mySeat());
}
function sendJoint(){
  const p=me();closeModal();
  const inv=S.P.filter(q=>!q.dead&&q!==p&&NET.pick[q.seat]).map(q=>q.seat);
  if(!inv.length)return;
  const tier=p.rank>=5?"S":p.rank>=4?"A":p.rank>=2?"B":p.rank>=1?"C":"D";
  S.joint={by:p.seat,tier,invited:inv,replies:{},accepted:{},started:false,
    scenes:null,i:0,votes:{},pts:0};
  S.joint.accepted[p.seat]=true;
  NET.pick={};
  say(`${p.name} put a request out for a joint ${tier}-rank to ${inv.map(i=>S.P[i].name).join(", ")}.`,p.name,"big");
  spend(p,1);
}
function viewJointInvite(){
  const J=JOINT(),from=S.P[J.by];

  return `<div class="veil"><div class="modal">

    <p style="font-size:15.5px">A joint <b>${esc(J.tier)}-rank</b>. ${others2.length?"They have also asked "+esc(others2.join(", "))+".":"Just the two of you."}</p>
    <div class="ribbon c">Pays far better than working alone.

function answerJoint(yes){
  const J=JOINT();if(!J)return;
  const seat=mySeat();

  if(yes)J.accepted[seat]=true;
  say(yes?`${S.P[seat].name} is in.`:`${S.P[seat].name} passed on the job.`,S.P[seat].name,yes?"good":"");
  if(!jointPending().length)startJoint();
  touch();render();
}
function startJoint(){
  const J=JOINT();
  const party=jointParty();
  if(party.length<2){
    say(`The joint operation fell through. Nobody else took it.`,"Registry","bad");
    S.joint=null;touch();render();return;
  }
  J.started=true;J.scenes=makeMissionScene();J.i=0;J.votes={};J.pts=0;
  say(`${party.map(q=>q.name).join(", ")} went out together on a ${J.tier}-rank.`,"Squad","big");
  touch();render();
}
function viewJoint(){
  const J=JOINT(),party=jointParty(),sc=J.scenes[J.i];
  const mine=jointInvolvesMe();
  const voted=Object.keys(J.votes||{}).length;
  const myVote=J.votes?J.votes[mySeat()]:undefined;
  return `<div class="veil"><div class="modal" style="max-width:620px">

    </div>
    <div style="margin-bottom:8px">${party.map(q=>`<span class="chip ${J.votes&&J.votes[q.seat]!==undefined?"gr":""}">${
