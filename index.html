<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shinobi Chronicle</title>
<style>
:root{
  --bg:#070A12; --bg2:#0B1020; --card:#121A2E; --card2:#18213A; --card3:#1F2A47;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --txt:#E9EEF9; --dim:#8492B4; --dim2:#5D6A88;
  --gold:#FFC53D; --gold2:#F79E1B; --goldglow:rgba(255,197,61,.22);
  --purple:#A78BFA; --purpleglow:rgba(167,139,250,.20);
  --red:#FF5C68; --redglow:rgba(255,92,104,.20);
  --cyan:#3FD8F0; --cyanglow:rgba(63,216,240,.18);
  --green:#4ADE80; --greenglow:rgba(74,222,128,.20);
  --orange:#FF8A3D;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"Avenir Next Rounded","Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(90% 60% at 50% -8%, rgba(255,197,61,.09), transparent 62%),
    radial-gradient(70% 50% at 12% 105%, rgba(63,216,240,.07), transparent 60%),
    radial-gradient(70% 50% at 90% 92%, rgba(167,139,250,.07), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt); font-family:var(--ui); font-size:15px; line-height:1.5; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:16px 14px 70px;position:relative;z-index:1}

/* ---------- type ---------- */
h1{font-size:clamp(30px,6.4vw,50px);font-weight:900;letter-spacing:-.03em;line-height:.98;margin:.14em 0}
h2{font-size:21px;font-weight:850;letter-spacing:-.015em;margin:0 0 8px}
h3{font-size:15px;font-weight:800;margin:0 0 6px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim2);font-weight:600}
.dim{color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gold{color:var(--gold)} .cy{color:var(--cyan)} .rd{color:var(--red)} .pu{color:var(--purple)} .gr{color:var(--green)}
.tt{background:linear-gradient(180deg,#FFE9A8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- cards ---------- */
.card{background:linear-gradient(165deg,var(--card2),var(--card) 62%);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
.card.glow{border-color:rgba(255,197,61,.42);box-shadow:0 0 0 1px rgba(255,197,61,.10),0 8px 34px -14px var(--goldglow)}
.card.pcard{border-color:rgba(167,139,250,.38);box-shadow:0 8px 34px -16px var(--purpleglow)}
.card.rcard{border-color:rgba(255,92,104,.36);box-shadow:0 8px 34px -16px var(--redglow)}
.card .cap{position:absolute;top:-9px;left:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--dim)}
.rule{height:1px;background:var(--line);margin:13px 0;border:0}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:14.5px;font-weight:650;color:var(--txt);background:linear-gradient(170deg,var(--card3),var(--card2));border:1px solid var(--line2);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;transition:transform .1s,box-shadow .16s,border-color .16s,filter .16s}
button:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(255,255,255,.3);box-shadow:0 8px 22px -12px rgba(0,0,0,.9)}
button:active:not(:disabled){transform:translateY(0px) scale(.995)}
button:disabled{opacity:.34;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.bkey{background:linear-gradient(170deg,#FFD866,var(--gold2));color:#1A1204;border-color:rgba(255,214,102,.7);font-weight:850;box-shadow:0 8px 26px -12px rgba(247,158,27,.75)}
.bkey:hover:not(:disabled){filter:brightness(1.07)}
.bdanger{background:linear-gradient(170deg,#43202A,#2A141B);border-color:rgba(255,92,104,.45);color:#FFB3B9}
.bcy{background:linear-gradient(170deg,#123946,#0D2632);border-color:rgba(63,216,240,.42);color:#B4EFFA}
.bpu{background:linear-gradient(170deg,#2C2450,#1B1736);border-color:rgba(167,139,250,.42);color:#D9CDFF}
.bgr{background:linear-gradient(170deg,#123A26,#0D2619);border-color:rgba(74,222,128,.45);color:#B6F3CE}
.row{display:flex;flex-wrap:wrap;gap:9px}
.grid{display:grid;gap:9px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}

/* action tiles */
.act{display:flex;gap:11px;align-items:center;padding:12px 13px}
.act .ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--line)}
.act .tx b{display:block;font-size:14.5px;font-weight:800;line-height:1.2}
.act .tx span{display:block;font-size:11px;color:var(--dim);margin-top:2px;font-weight:500;line-height:1.3}
.act.hot .ic{background:linear-gradient(165deg,rgba(255,197,61,.28),rgba(255,197,61,.05));border-color:rgba(255,197,61,.4)}

/* pick cards */
.pick{padding:12px 13px;line-height:1.35;display:block}
.pick .t{font-weight:800;font-size:14.5px}
.pick .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);margin-top:4px}
.pick.on{border-color:var(--gold);background:linear-gradient(170deg,rgba(255,197,61,.18),rgba(255,197,61,.04));box-shadow:0 0 0 1px rgba(255,197,61,.25) inset}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:750;letter-spacing:.02em;padding:4px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);background:rgba(255,255,255,.03);margin:0 5px 5px 0;white-space:nowrap}
.chip.g{border-color:rgba(255,197,61,.5);color:#FFD87A;background:rgba(255,197,61,.08)}
.chip.p{border-color:rgba(167,139,250,.5);color:#CDBBFF;background:rgba(167,139,250,.08)}
.chip.c{border-color:rgba(63,216,240,.5);color:#A8ECF8;background:rgba(63,216,240,.08)}
.chip.r{border-color:rgba(255,92,104,.5);color:#FFB0B6;background:rgba(255,92,104,.08)}
.chip.gr{border-color:rgba(74,222,128,.5);color:#AEF2CB;background:rgba(74,222,128,.08)}

/* ---------- stat bars ---------- */
.stat{display:grid;grid-template-columns:76px 1fr 38px;align-items:center;gap:9px;padding:3.5px 0}
.stat .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.bar{height:7px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#5C6C90,#9FB0D4);transition:width .55s cubic-bezier(.2,.85,.25,1)}
.bar i.c{background:linear-gradient(90deg,#1B7F97,var(--cyan))}
.bar i.g{background:linear-gradient(90deg,var(--gold2),#FFDE8A)}
.bar i.r{background:linear-gradient(90deg,#B03744,var(--red))}
.bar i.gr{background:linear-gradient(90deg,#1F8C52,var(--green))}
.bar i.p{background:linear-gradient(90deg,#6A47C9,var(--purple))}
.stat .v{font-family:var(--mono);font-size:12px;text-align:right;font-weight:700}

/* ---------- emblem (signature element) ---------- */
.emb{position:relative;display:inline-grid;place-items:center;flex:0 0 auto}
.emb svg{display:block}
.emb.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,197,61,.65);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}

/* ---------- seat header ---------- */
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-bottom:13px}
.seat{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(165deg,var(--card2),var(--card));min-width:0}
.seat.on{border-color:rgba(255,197,61,.5);background:linear-gradient(165deg,rgba(255,197,61,.14),var(--card));box-shadow:0 6px 24px -14px var(--goldglow)}
.seat.gone{opacity:.45;filter:grayscale(.6)}
.seat .nm{font-weight:850;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin-top:1px}
.pw{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:800;color:var(--gold);white-space:nowrap}

/* ---------- ribbon / banner ---------- */
.ribbon{border-radius:14px;padding:11px 14px;text-align:center;font-weight:800;font-size:14.5px;margin-bottom:12px;border:1px solid}
.ribbon.g{border-color:rgba(255,197,61,.5);background:linear-gradient(180deg,rgba(255,197,61,.15),rgba(255,197,61,.04));color:#FFDE9B;box-shadow:0 0 30px -16px var(--goldglow)}
.ribbon.p{border-color:rgba(167,139,250,.5);background:linear-gradient(180deg,rgba(167,139,250,.14),rgba(167,139,250,.03));color:#D6C8FF}
.ribbon.r{border-color:rgba(255,92,104,.5);background:linear-gradient(180deg,rgba(255,92,104,.14),rgba(255,92,104,.03));color:#FFBCC1}
.ribbon.c{border-color:rgba(63,216,240,.45);background:linear-gradient(180deg,rgba(63,216,240,.12),rgba(63,216,240,.03));color:#B6EFFA}
.ribbon small{display:block;font-weight:600;font-size:12px;opacity:.82;margin-top:3px}

/* ---------- log ---------- */
.log{max-height:270px;overflow-y:auto;padding-right:6px;scrollbar-width:thin}
.ent{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.045);animation:pop .35s ease both}
.ent:last-child{border-bottom:0}
.ent .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:7px;background:var(--dim2)}
.ent.good .dot{background:var(--green);box-shadow:0 0 8px var(--greenglow)}
.ent.bad .dot{background:var(--red);box-shadow:0 0 8px var(--redglow)}
.ent.big .dot{background:var(--gold);box-shadow:0 0 10px var(--goldglow)}
.ent .bd{min-width:0}
.ent .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);display:block;margin-bottom:1px}
.ent .tx{font-size:13.5px}
.ent.big .tx{color:#FFE7B0;font-weight:650}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(4,6,12,.82);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:60;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(168deg,#1B2440,#0E1424);border:1px solid var(--line2);border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 30px 80px -30px #000;animation:rise .24s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal .tag{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.modal h2{font-size:23px;margin:7px 0 10px}

/* ---------- battle ---------- */
.fbox{display:grid;grid-template-columns:1fr auto 1fr;gap:11px;align-items:center;margin:14px 0 10px}
.vs{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim2);font-weight:800}
.fbar{height:9px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.fbar i{display:block;height:100%;border-radius:20px;transition:width .4s ease}
.hp i{background:linear-gradient(90deg,#B4392F,#FF7A62)}
.cpb i{background:linear-gradient(90deg,#1B7F97,var(--cyan))}
.blog{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:13px;padding:11px;max-height:168px;overflow-y:auto;font-size:13.4px;margin:11px 0}
.blog div{padding:3px 0;animation:pop .25s ease both}
.hit{color:#FF9AA2;font-weight:750}.hl{color:#8FF0C2;font-weight:750}
.mv{padding:10px 12px}
.mv b{display:block;font-size:13.5px;font-weight:800}
.mv span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-top:3px}

/* ---------- exam ---------- */
.qopt{width:100%;margin-bottom:8px;padding:12px 14px;font-weight:650}
.qopt.hint{border-color:rgba(74,222,128,.55);background:linear-gradient(170deg,rgba(74,222,128,.16),rgba(74,222,128,.03));color:#C6F7DA}
.qopt.right{border-color:var(--green);background:linear-gradient(170deg,rgba(74,222,128,.28),rgba(74,222,128,.06))}
.qopt.wrong{border-color:var(--red);background:linear-gradient(170deg,rgba(255,92,104,.24),rgba(255,92,104,.05))}
.pips{display:flex;gap:5px}
.pips b{width:22px;height:4px;border-radius:4px;background:rgba(255,255,255,.13)}
.pips b.on{background:var(--gold)}

/* ---------- misc ---------- */
.ap{display:inline-flex;gap:5px;vertical-align:middle}
.ap b{width:11px;height:11px;border-radius:3px;transform:rotate(45deg);background:linear-gradient(150deg,#FFDF95,var(--gold2));box-shadow:0 0 8px var(--goldglow)}
.ap b.off{background:rgba(255,255,255,.1);box-shadow:none}
input[type=text]{font-family:var(--ui);font-size:15px;font-weight:650;background:rgba(0,0,0,.3);border:1px solid var(--line2);color:var(--txt);padding:12px 14px;border-radius:12px;width:100%}
input[type=text]:focus{outline:2px solid var(--cyan);outline-offset:1px}
.note{font-size:12.6px;color:var(--dim);border-left:2px solid var(--line2);padding-left:11px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.kv span:last-child{font-family:var(--mono);font-weight:700}
.center{text-align:center}
.sp{height:12px}

/* ---------- squad / roster ---------- */
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.per{padding:10px 11px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(165deg,var(--card2),var(--card))}
.per.dead{opacity:.42;filter:grayscale(.75)}
.per b{display:block;font-size:13.5px;font-weight:800}
.per .r{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin:2px 0 6px}
/* ---------- war banner ---------- */
.war{border-radius:14px;padding:12px 15px;margin-bottom:12px;border:1px solid rgba(255,92,104,.55);position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(255,92,104,.20),rgba(255,138,61,.07))}
.war::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,92,104,.09) 0 12px,transparent 12px 26px)}
.war b{font-size:15.5px;font-weight:850;color:#FFC9CD;position:relative}
.war span{display:block;font-size:12.5px;color:#F0AEB4;margin-top:3px;position:relative;font-weight:600}
/* ---------- upgrade rows ---------- */
.up{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);margin-bottom:7px}
.up .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--line)}
.up .mid{flex:1;min-width:0}
.up .mid b{display:block;font-size:13.5px;font-weight:800;margin-bottom:2px}
.up .mid span{display:block;font-size:11.5px;color:var(--dim);line-height:1.35}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:17px;height:4px;border-radius:3px;background:rgba(255,255,255,.12)}
.dots i.on{background:linear-gradient(90deg,var(--gold2),var(--gold))}
/* ---------- lethal toggle ---------- */
.tog{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:12px;border:1px solid var(--line2);
  cursor:pointer;background:rgba(255,255,255,.025);margin-top:4px}
.tog.on{border-color:var(--red);background:linear-gradient(170deg,rgba(255,92,104,.2),rgba(255,92,104,.04))}
.tog .sw{width:40px;height:22px;border-radius:20px;background:rgba(255,255,255,.14);position:relative;flex:0 0 40px;transition:background .18s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s}
.tog.on .sw{background:var(--red)}
.tog.on .sw::after{transform:translateX(18px)}
/* ---------- destiny glow ---------- */
.destiny{border-color:rgba(167,139,250,.6)!important;box-shadow:0 0 40px -14px rgba(167,139,250,.5)!important}
.sixpaths{border-color:rgba(255,197,61,.7)!important;box-shadow:0 0 46px -12px rgba(255,197,61,.6)!important}
/* ---------- combat log ---------- */
.blog .sys{color:var(--dim2);font-size:11.5px;font-family:var(--mono);letter-spacing:.02em}
/* ---------- selects and the hidden panel ---------- */
input[type=range]{width:100%;accent-color:var(--gold);background:transparent}
select{font-family:var(--ui);font-size:13.5px;font-weight:650;background:#0E1424;border:1px solid var(--line2);
  color:var(--txt);padding:8px 10px;border-radius:10px;width:100%;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#8492B4 50%),linear-gradient(135deg,#8492B4 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:focus{outline:2px solid var(--cyan);outline-offset:1px}
.gpan{background:linear-gradient(168deg,#171029,#0A0713);border:1px solid rgba(167,139,250,.45);
  box-shadow:0 0 60px -18px rgba(167,139,250,.55),0 30px 80px -30px #000}
.gsec{border-top:1px solid rgba(255,255,255,.07);padding-top:13px;margin-top:13px}
.gsec>.eyebrow{color:var(--purple);margin-bottom:8px;display:block}
.grow{display:grid;grid-template-columns:84px 1fr;gap:9px;align-items:center;margin-bottom:7px}
.grow>.l{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.step{display:flex;gap:5px;align-items:center}
.step button{padding:6px 9px;font-size:12px;border-radius:8px;min-width:34px;text-align:center;font-weight:800}
.step .v{font-family:var(--mono);font-size:13.5px;font-weight:800;min-width:52px;text-align:center}
.tchip{display:inline-block;font-size:11px;font-weight:700;padding:5px 10px;border-radius:18px;margin:0 5px 5px 0;
  border:1px solid var(--line2);color:var(--dim);cursor:pointer;background:rgba(255,255,255,.03);user-select:none}
.tchip.on{border-color:var(--purple);color:#D9CDFF;background:rgba(167,139,250,.18)}
.tchip.l2{border-color:var(--gold);color:#FFD87A;background:rgba(255,197,61,.16)}
.tchip.l3{border-color:var(--red);color:#FFB0B6;background:rgba(255,92,104,.18)}
.gtab{display:flex;gap:6px;margin-bottom:12px}
.gtab button{flex:1;text-align:center;padding:10px}
.gtab button.on{background:linear-gradient(170deg,#3B2F66,#241C40);border-color:var(--purple);color:#E2D8FF}
.ghost{cursor:default;user-select:none}
@media(max-width:780px){
  #cols{grid-template-columns:1fr!important}
  .g2,.g3{grid-template-columns:1fr}
  .seats{grid-template-columns:1fr}
  .fbox{grid-template-columns:1fr;gap:12px}
  .fbox>div:last-child{text-align:left!important}
  .grow{grid-template-columns:1fr}
  .ppl{grid-template-columns:1fr}
  .vs{text-align:center}
  .wrap{padding:12px 11px 56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =====================================================================
   ARENA SKIN
   An original take on the anime-fighter menu idiom: hard diagonals, a heavy
   accent band, chunky angled list bars and high-contrast plates.
   Appended last so it wins on specificity without losing any behaviour.
   ===================================================================== */
:root{
  --bg:#080B14; --bg2:#0C1220;
  --card:#111A2C; --card2:#16223A; --card3:#1E2E4C;
  --ink:#0A0E18;
  --accent:#F26A17;          /* the orange side */
  --accent2:#FFB43C;         /* flame */
  --rival:#5B4BC4;           /* the indigo side */
  --rival2:#8A6FE8;          /* lit indigo */
  --sharingan:#C4211F;       /* the eye */
  --gold:#FFC53D; --gold2:#F79E1B;

body::before{
  content:"";position:fixed;top:0;left:-10%;width:120%;height:74px;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,var(--accent) 0%,#D2541A 26%,#7A4A8C 56%,var(--rival) 78%,transparent 100%);

body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;

.wrap{padding-top:34px}

h1{

}
.eyebrow{
  color:#FFC489;letter-spacing:.26em;font-weight:800;
}
.cap{
  background:var(--accent)!important;border:0!important;color:#fff!important;

  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);
  left:0!important;top:0!important;position:absolute;

}

.card{padding-top:30px!important}

.card{
  background:linear-gradient(160deg,var(--card2) 0%,var(--card) 70%);

button{

}
.bkey{
  background:linear-gradient(100deg,#FFD65E,var(--gold2));color:#1A1204;

}

.bpu{background:linear-gradient(100deg,#2A2568,#171442);border-color:rgba(138,111,232,.5);color:#D6CEFF}
.bgr{background:linear-gradient(100deg,#12401F,#0C2916);border-color:rgba(74,222,128,.45);color:#B6F3CE}

.act{
  position:relative;padding:13px 14px 13px 15px;

}
.act::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.55;

.act:hover:not(:disabled)::after{opacity:1;box-shadow:0 0 12px var(--accent)}
.act.hot::after{background:linear-gradient(180deg,var(--gold),var(--accent2));opacity:1}

.fbar{border-radius:0;transform:skewX(-22deg)}

.vs{

/* ---------- generation: village is chosen, everything else is rolled ---------- */
function rollClan(v){ return wpick(CLANPOOL[v]||CLANPOOL.konoha) }
/* When a village is forced on you, blood is not restricted to that village.
   Weighted by rarity so the legendary lines stay rare. */
const RAREW={legendary:2,rare:4,uncommon:8,common:14};
function rollClanAny(){
  return wpick(Object.keys(CLANS).map(c=>[c,c==="civilian"?26:(RAREW[CLANS[c].rare]||8)]));
}
function clanNativeTo(clan,vil){return (CLANPOOL[vil]||[]).some(x=>x[0]===clan)}
/* Duo pairings for four seats. Player one picks which. */
const PAIRINGS=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
function pairingLabel(i){
  const P=PAIRINGS[i];
  return P.map(t=>t.map(x=>"P"+(x+1)).join(" and ")).join("  vs  ");
}
function teamForSeat(seat){
  if(S.mode==="duo"){
    const P=PAIRINGS[S.pairing||0];
    for(let t=0;t<P.length;t++)if(P[t].indexOf(seat)>=0)return t;
    return 0;
  }
  if(S.mode==="coop")return 0;
  return seat;                       // rivals: everyone stands alone
}
/* The lowest seat on a team chooses where they all come from. */
function villageChooser(seat){
  const t=teamForSeat(seat);
  let low=seat;
  for(let i=0;i<seatsWanted();i++)if(teamForSeat(i)===t&&i<low)low=i;
  return low;
}
function playerAt(seat){
  if(S.pend&&S.pend[seat])return S.pend[seat];
  return (S.P||[]).find(q=>q&&q.seat===seat)||null;
}
function forcedVillage(seat){
  // in duo the pairings are not set until everyone is in, so at creation
  // there is nobody to be forced to match
  if(S.mode==="duo"&&!S.pairingSet)return null;
  const chooser=villageChooser(seat);
  if(chooser===seat)return null;                       // you pick your own
  const p=playerAt(chooser);
  return p?p.village:null;
}
function rollNature(v,clanId){
  const c=CLANS[clanId];
  if(c.nat) return c.nat;                       // clan-locked nature
  const home=VILLAGES[v].nat;
  const pool=NATURES.map(n=>[n,n===home?5:2]);  // home nature is likelier, never guaranteed
  return wpick(pool);
}
function buildPlayer(seat,name,gender,village,keep){
  const p=newPlayer(seat);
  p.name=name; p.gender=gender; p.village=village;
  p.clan=keep&&keep.clan?keep.clan:(keep&&keep.anyClan?rollClanAny():rollClan(village));
  p.nat=keep&&keep.nat?keep.nat:rollNature(village,p.clan);
  const v=VILLAGES[village],c=CLANS[p.clan];
  // every birth rolls differently. clan blood weighs heaviest, village upbringing second.
  STATKEYS.forEach(([k])=>{p[k]=rnd(6,15)});
  p.health+=2;
  Object.entries(v.b||{}).forEach(([k,n])=>p[k]=(p[k]||10)+Math.round(n*(0.6+Math.random()*0.9)));
  Object.entries(c.b||{}).forEach(([k,n])=>p[k]=(p[k]||10)+Math.round(n*(0.7+Math.random()*0.9)));
  const h=houseOf(p);
  // the compound your ancestors built raises the floor for everyone after them
  if(h.comp.train)STATKEYS.forEach(([k])=>bump(p,k,h.comp.train*1.1));
  if(h.comp.lib){bump(p,"intel",h.comp.lib*2.4);bump(p,"control",h.comp.lib*1.4)}
  if(h.comp.inf)bump(p,"health",h.comp.inf*2.2);
  // bloodlines the house carries, plus your own clan, are all potential awakenings
  p.pot=[];
  if(c.kg)p.pot.push(c.kg);
  (keep&&keep.blood?keep.blood:h.blood).forEach(id=>{if(p.pot.indexOf(id)<0&&KG[id])p.pot.push(id)});
  p.pot=p.pot.slice(0,3);
  // the cycle turns rarely
  if(!keep||!keep.noDestiny){
    const taken={};
    (S.P||[]).forEach(q=>{if(q&&q.destiny&&q!==p)taken[q.destiny]=1});
    if(S.npcDestiny)taken[S.npcDestiny]=1;
    const open=["indra","ashura"].filter(d=>!taken[d]);
    if(open.length&&chance(.015*open.length))p.destiny=pick(open);
  }
  if(p.destiny)p.flags.destinyHidden=1;
  p.look=(keep&&keep.look)?JSON.parse(JSON.stringify(keep.look)):randomLook();
  p.jutsu=["clone",starterJutsu(p.nat)];
  h.scroll.forEach(j=>{if(chance(.5))p.jutsu.push("scroll:"+j.id)});
  STATKEYS.forEach(([k])=>p[k]=clamp(Math.round(p[k]),1,CAP));
  return p;
}

    pw:Math.round(power(p)*(0.9+Math.random()*0.4)),wins:0,losses:0};

function livingMates(p){return p.squad?p.squad.mates.filter(m=>m.alive):[]}
function rollBeast(p){

/* ---------- derived ---------- */
function kgsOf(p){if(!p.kgs)p.kgs=[];return p.kgs}

function kgTotal(p){return kgsOf(p).reduce((a,x)=>a+x.lvl,0)}
function potOf(p){if(!p.pot)p.pot=CLANS[p.clan].kg?[CLANS[p.clan].kg]:[];return p.pot}
function addKG(p,id,lvl){const e=kgsOf(p).find(x=>x.id===id);if(e){e.lvl=Math.max(e.lvl,lvl||1);return false}
  p.kgs.push({id,lvl:lvl||1});if(potOf(p).indexOf(id)<0)p.pot.push(id);return true}
function houseOf(p){if(!S.house)S.house=[];if(!S.house[p.seat])S.house[p.seat]=newHouse();return S.house[p.seat]}
function newHouse(){return{scroll:[],comp:{train:0,lib:0,shrine:0,inf:0},prestige:0,blood:[],ancestors:[],ryoBank:0}}
function compBuff(p,k){return (houseOf(p).comp[k]||0)}
function growthMult(p){const h=houseOf(p);return 1+h.prestige*0.08+compBuff(p,"train")*0.06+(p.destiny?0.10:0)+(p.sixpaths?0.35:0)}
function clanOf(p){return CLANS[p.clan]}
function vilOf(p){return VILLAGES[p.village]}
function kgOf(p){const a=kgsOf(p);if(a.length)return KG[a[0].id];const q=potOf(p);return q.length?KG[q[0]]:null}
function rankName(p){return p.rogue?ROGUE[p.rogueRank]:RANKS[p.rank]}
function bump(p,k,n){p[k]=clamp(Math.round((p[k]+n)*10)/10,0,CAP)}
function eyeDebuff(p){
  let m=1;
  if(p.blindEye)m-=0.22;
  if(p.rejection)m-=0.16;
  if(p.ems)m+=0.10;
  if(p.tenseigan)m+=0.12;
  if(p.ms)m+=0.08;
  return m;
}
function power(p){
  const base=p.chakra*1.05+p.nin*1.25+p.tai*1.25+p.gen*.95+p.control*1.05+p.intel*.75+p.health*.95+p.speed*.95;
  let m=1+p.rank*0.05;
  m+=0.10*kgTotal(p);
  if(p.sage)m+=0.22;
  if(p.sixpaths)m+=0.30;
  if(p.destiny)m+=0.05;
  if(p.corps==="anbu")m+=0.05;
  if(p.corps==="medic")m+=0.03;
  if(p.beast)m+=0.10+(BEASTS[p.beast].p*p.bond/420);
  if(p.rogue)m+=0.05*p.rogueRank;
  m+=p.jutsu.length*0.012;
  return Math.round(base*m*eyeDebuff(p));
}

/* Trust runs in five tiers and each one has to be earned twice over: once by

const BEASTTIER=[
 {n:"Caged",cap:20,rank:0,d:"It talks at you. Nothing more."},
 {n:"Wary",cap:40,rank:1,d:"It answers, when it feels like it."},
 {n:"Tolerated",cap:60,rank:2,d:"The cloak will come when called."},
 {n:"Understood",cap:80,rank:4,d:"It offers rather than demands."},
 {n:"Partnered",cap:100,rank:5,d:"You fight as one thing with two opinions."}

function beastTier(p){
  let t=0;
  for(let i=0;i<BEASTTIER.length;i++){
    if(p.rank>=BEASTTIER[i].rank && (p.trials||0)>=i) t=i;
    else break;

}
function bondCap(p){
  if(!p.beast)return 100;

}
function bondTierNote(p){
  const i=beastTier(p),t=BEASTTIER[i],c=bondCap(p),nxt=BEASTTIER[i+1];
  if(!nxt)return `${t.n}. Nothing further to earn.`;
  const rankOK=p.rank>=nxt.rank, trialOK=(p.trials||0)>=i+1;
  if(p.bond>=c){
    const need=[];
    if(!rankOK)need.push("reach "+RANKS[nxt.rank]);
    if(!trialOK)need.push("pass its next trial");
    return `${t.n}, sealed at ${c}. To go further: ${need.join(" and ")}.`;
  }
  return `${t.n} \u00b7 ceiling ${c} \u00b7 next tier needs ${RANKS[nxt.rank]}${trialOK?"":" and another trial"}.`;
}

function startTrial(){
  const p=me(),tr=nextTrial(p);closeModal();
  if(!tr)return;
  modal("The seal \u00b7 trial",tr.t,`<p style="font-size:15.5px">${tr.b(p)}</p>
    <div class="note">Judged against the attribute named on each answer.</div>`,
    tr.c.map((c,i)=>`<button class="act" onclick="resolveTrial(${i})"><span class="ic">\\u276F</span><span class="tx">
      <b>${esc(c.l)}</b><span>${c.s?STATKEYS.find(x=>x[0]===c.s)[1]+" check \\u00b7 needs "+c.n+" \\u00b7 you have "+Math.round(p[c.s]):"no check"}</span></span></button>`).join(""),
    mySeat());
}
function resolveTrial(i){
  const p=me(),tr=nextTrial(p);closeModal();
  if(!tr)return;
  const c=tr.c[i];
  const pass=!c.s||(p[c.s]+rnd(-8,12))>=c.n;
  if(pass&&c.bond>0){
    p.trials=(p.trials||0)+1;
    p.bond=clamp(p.bond+c.bond,0,bondCap(p));
    say(`${BEASTS[p.beast].n}: ${c.g} Trust up ${c.bond}, and the seal gives a little.`,p.name,"big");
  }else if(c.bond>0){
    p.bond=clamp(p.bond-4,0,100);
    say(`${BEASTS[p.beast].n} was not convinced. ${c.g.split(".")[0]}, but not well enough.`,p.name,"bad");
  }else{
    p.bond=clamp(p.bond+c.bond,0,100);
    say(`${BEASTS[p.beast].n}: ${c.g}`,p.name,"bad");
    if(c.rep)bump(p,"rep",c.rep);
  }
  if(c.stat)bump(p,c.stat[0],c.stat[1]);
  if(c.hurt)wound(p,c.hurt);
  touch();spend(p,1);
}

/* =====================================================================
   MUSIC
   An original instrumental, synthesised in the browser. Nothing is
   sampled or copied: it is a pentatonic line over a slow drone, written
   to sit behind the game rather than in front of it.
   ===================================================================== */
const MUS={ctx:null,on:false,timer:null,step:0,next:0,gain:null,vol:0.28};
// hirajoshi-flavoured pentatonic, the mode most people hear as "east asian"
const SCALE=[0,2,3,7,8];
const ROOTS=[57,57,55,53];        // A3 A3 G3 F3, one root per eight-bar block
function musNote(deg,oct){
  const r=ROOTS[Math.floor(MUS.step/32)%ROOTS.length];
  return r+SCALE[((deg%5)+5)%5]+12*(oct||0);
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function musInit(){
  if(MUS.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  MUS.ctx=new AC();
  MUS.gain=MUS.ctx.createGain();
  MUS.gain.gain.value=0;
  const rev=MUS.ctx.createConvolver();
  const len=MUS.ctx.sampleRate*2.2, buf=MUS.ctx.createBuffer(2,len,MUS.ctx.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*0.5}
  rev.buffer=buf;
  const wet=MUS.ctx.createGain();wet.gain.value=0.30;
  MUS.gain.connect(MUS.ctx.destination);
  MUS.gain.connect(wet);wet.connect(rev);rev.connect(MUS.ctx.destination);
}
function pluck(t,f,v){                       // koto-ish
  const c=MUS.ctx,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type="triangle";o.frequency.value=f;
  lp.type="lowpass";lp.frequency.setValueAtTime(f*7,t);lp.frequency.exponentialRampToValueAtTime(f*1.6,t+0.5);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0008,t+1.5);
  o.connect(lp);lp.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+1.6);
}
function flute(t,f,dur,v){                   // breathy lead
  const c=MUS.ctx,o=c.createOscillator(),g=c.createGain(),vib=c.createOscillator(),vg=c.createGain();
  o.type="sine";o.frequency.value=f;
  vib.type="sine";vib.frequency.value=5.2;vg.gain.value=f*0.006;
  vib.connect(vg);vg.connect(o.frequency);
  const n=c.createBufferSource(),nb=c.createBuffer(1,2048,c.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<2048;i++)nd[i]=Math.random()*2-1;
  nb.loop=true;n.buffer=nb;n.loop=true;
  const nf=c.createBiquadFilter();nf.type="bandpass";nf.frequency.value=f*2.4;nf.Q.value=1.2;
  const ng=c.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(v*0.16,t+0.06);
  ng.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  n.connect(nf);nf.connect(ng);ng.connect(MUS.gain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.12);
  g.gain.setValueAtTime(v,t+dur*0.6);g.gain.exponentialRampToValueAtTime(0.0006,t+dur);
  o.connect(g);g.connect(MUS.gain);
  o.start(t);o.stop(t+dur+0.1);vib.start(t);vib.stop(t+dur+0.1);n.start(t);n.stop(t+dur+0.1);
}
function drum(t,v,low){                      // taiko-ish
  const c=MUS.ctx,o=c.createOscillator(),g=c.createGain();
  o.type="sine";o.frequency.setValueAtTime(low?110:170,t);
  o.frequency.exponentialRampToValueAtTime(low?38:60,t+0.16);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0007,t+0.35);
  o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+0.4);
}
function drone(t,f,dur){
  const c=MUS.ctx,g=c.createGain(),lp=c.createBiquadFilter();
  lp.type="lowpass";lp.frequency.value=620;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.055,t+1.6);
  g.gain.setValueAtTime(0.055,t+dur-1.6);g.gain.linearRampToValueAtTime(0,t+dur);
  [0,-0.09,0.09].forEach(det=>{const o=c.createOscillator();o.type="sawtooth";
    o.frequency.value=f*Math.pow(2,det/12);o.connect(lp);o.start(t);o.stop(t+dur)});

function musTick(){

  const c=MUS.ctx, spb=60/76/2;             // 76 bpm, eighth notes
  while(MUS.next < c.currentTime+0.4){
    const t=Math.max(MUS.next,c.currentTime+0.02), st=MUS.step, bar=Math.floor(st/8);
    if(st%32===0)drone(t,hz(musNote(0,-2)),spb*32);
    if(st%8===0)drum(t,0.30,true);
    else if(st%8===4)drum(t,0.16,false);
    else if(st%8===7&&Math.random()<0.4)drum(t,0.10,false);
    if(st%2===0)pluck(t,hz(musNote([0,2,4,2,3,1,4,0][Math.floor(st/2)%8],0)),0.10);
    if(bar%2===1&&st%4===0&&Math.random()<0.75){
      const deg=[4,3,2,4,1,0,2,3][Math.floor(st/4)%8];
      flute(t,hz(musNote(deg,1)),spb*(Math.random()<0.35?6:3.4),0.085);

  }
}
/* Browsers will not start audio before the page is interacted with, so we try
   immediately and otherwise ride the first click or keypress. */
function audKick(){
  audInit();
  const M=mus();
  if(!M.list.length)return;
  if(M.i<0){ if(musOwner())musAdvance(); else musSync(true); return }
  musSync(true);
}
function audArm(){
  if(AUD.armed)return;AUD.armed=true;
  if(typeof document==="undefined"||!document.addEventListener){audKick();return}
  const evs=["pointerdown","keydown","touchstart"];
  // deferred, so the click the player actually made finishes first and the
  // element they hit is not re-rendered out from under them
  const go=()=>setTimeout(()=>{
    audKick();
    if(AUD.el&&AUD.el.src&&AUD.el.paused){const pr=AUD.el.play();if(pr&&pr.catch)pr.catch(()=>{})}
    if(AUD.el&&!AUD.el.paused)evs.forEach(e=>document.removeEventListener(e,go,true));
  },0);
  evs.forEach(e=>document.addEventListener(e,go,true));
  audKick();
}
function musToggle(){
  musInit();
  if(!MUS.ctx){NET.musicFail=true;render();return}
  if(MUS.ctx.state==="suspended")MUS.ctx.resume();
  MUS.on=!MUS.on;
  if(MUS.on){
    MUS.next=MUS.ctx.currentTime+0.1;
    MUS.gain.gain.cancelScheduledValues(MUS.ctx.currentTime);
    MUS.gain.gain.setValueAtTime(MUS.gain.gain.value,MUS.ctx.currentTime);
    MUS.gain.gain.linearRampToValueAtTime(MUS.vol,MUS.ctx.currentTime+1.2);
    clearInterval(MUS.timer);MUS.timer=setInterval(musTick,120);
  }else{
    MUS.gain.gain.cancelScheduledValues(MUS.ctx.currentTime);
    MUS.gain.gain.setValueAtTime(MUS.gain.gain.value,MUS.ctx.currentTime);
    MUS.gain.gain.linearRampToValueAtTime(0,MUS.ctx.currentTime+0.8);
    setTimeout(()=>{if(!MUS.on)clearInterval(MUS.timer)},900);
  }
  render();
}
function musVol(d){
  MUS.vol=clamp(Math.round((MUS.vol+d)*100)/100,0,0.6);
  if(MUS.ctx&&MUS.on)MUS.gain.gain.linearRampToValueAtTime(MUS.vol,MUS.ctx.currentTime+0.2);
  render();
}


/* =====================================================================
   SOUNDTRACK
   Plays audio files chosen from this device. Nothing is bundled with the
   game: the files stay on your machine and are read through an object URL
   that is revoked as soon as the track ends.
   ===================================================================== */
const AUD={el:null,files:[],order:[],i:-1,on:false,vol:0.45,url:null,now:"",panel:false,err:""};
function audInit(){
  if(AUD.el)return;
  AUD.el=new Audio();
  AUD.el.volume=AUD.vol;
  AUD.el.addEventListener("ended",()=>{
    if(AUD.shared){
      if(musOwner()){musAdvance();return}
      audWaitForNext();                          // follower holds until the queue moves
      return;
    }
    audNext();
  });
  AUD.el.addEventListener("error",()=>{AUD.err="That file would not play. Try mp3, m4a, ogg or wav.";audNext()});
}
function shuffled(n,avoid){
  const a=[];for(let i=0;i<n;i++)a.push(i);
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
  if(n>1&&avoid!=null&&a[0]===avoid){const t=a[0];a[0]=a[n-1];a[n-1]=t}
  return a;
}
function audStop(){
  if(AUD.el){AUD.el.pause();AUD.el.removeAttribute("src");AUD.el.load()}
  if(AUD.url){URL.revokeObjectURL(AUD.url);AUD.url=null}
  AUD.on=false;
}
function audNext(){
  audInit();
  if(!AUD.files.length){AUD.on=false;render();return}
  if(AUD.url){URL.revokeObjectURL(AUD.url);AUD.url=null}
  AUD.i++;
  if(AUD.i>=AUD.order.length){                 // whole cycle finished, reshuffle
    const last=AUD.order[AUD.order.length-1];
    AUD.order=shuffled(AUD.files.length,last);
    AUD.i=0;
  }
  const f=AUD.files[AUD.order[AUD.i]];
  if(!f){AUD.on=false;render();return}
  AUD.url=URL.createObjectURL(f);
  AUD.now=f.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ").trim();
  AUD.el.src=AUD.url;AUD.el.volume=AUD.vol;
  const pr=AUD.el.play();
  if(pr&&pr.catch)pr.catch(()=>{AUD.on=false;audArm();render()});
  AUD.on=true;render();
}
function audToggle(){
  audInit();
  if(!AUD.files.length){AUD.panel=true;render();return}
  if(AUD.on){AUD.el.pause();AUD.on=false}
  else{
    if(!AUD.el.src)return audNext();
    const pr=AUD.el.play();
    if(pr&&pr.catch)pr.catch(()=>{audArm()});
    AUD.on=true;
  }
  render();
}
function audVol(d){
  AUD.vol=clamp(Math.round((AUD.vol+d)*100)/100,0,1);
  if(AUD.el)AUD.el.volume=AUD.vol;
  MUS.vol=Math.min(0.6,AUD.vol*0.6);
  if(MUS.ctx&&MUS.on)MUS.gain.gain.linearRampToValueAtTime(MUS.vol,MUS.ctx.currentTime+0.2);
  render();
}

/* ---------- shared playlist ----------
   The queue is a list of URLs held in room state, so both machines load the
   same tracks from wherever you are hosting them. The running order is
   derived from a shared seed and the current index carries a start
   timestamp, which is what keeps the two of you on the same bar.
   Audio files chosen from your own disk still work, but only on the machine
   that picked them: a local file has no address the other machine can read. */
const BUILTIN=[{n:"Menu Song 1",d:"audio/menu-song-1.mp3"},{n:"Menu Song 2",d:"audio/menu-song-2.mp3"},{n:"Menu Song 3",d:"audio/menu-song-3.mp3"},{n:"Menu Song 4",d:"audio/menu-song-4.mp3"},{n:"Menu Song 5",d:"audio/menu-song-5.mp3"}];
function trackSrc(t){
  if(!t)return "";
  if(typeof t.u==="string"&&t.u.indexOf("builtin:")===0){
    const b=BUILTIN[+t.u.slice(8)];return b?b.d:"";
  }
  return t.u;
}
function builtinTracks(){return BUILTIN.map((b,i)=>({u:"builtin:"+i,n:b.n,b:1}))}
function mus(){ if(!S.music)S.music={list:builtinTracks(),order:seededOrder(BUILTIN.length,Date.now()&0xffffff),i:-1,at:0,seed:1}; return S.music }
function seededOrder(n,seed){
  const a=[];for(let i=0;i<n;i++)a.push(i);
  let x=(seed||1)>>>0;
  const rand=()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296};
  for(let i=n-1;i>0;i--){const j=Math.floor(rand()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function musRemove(i){
  const M=mus();M.list.splice(i,1);
  M.seed=Math.floor(Math.random()*1e9);
  M.order=seededOrder(M.list.length,M.seed);M.i=-1;M.at=Date.now();
  audStop();touch();
  if(M.list.length)musAdvance();else render();
}
/* Only one machine moves the queue on, so the two of you never fight over it. */
function musOwner(){ return !online()||NET.seat===0 }
function musAdvance(){
  const M=mus();
  if(!M.list.length)return render();
  if(!musOwner()){pullState();return render()}
  const justPlayed=(M.i>=0&&M.order[M.i]!=null)?M.order[M.i]:null;
  M.i=(M.i+1)%M.list.length;
  if(M.i===0){                                   // every track has had a turn, reshuffle
    M.seed=Math.floor(Math.random()*1e9);
    M.order=seededOrder(M.list.length,M.seed);
    // the new running order must not open on the track that just finished
    if(M.list.length>1&&justPlayed!=null&&M.order[0]===justPlayed){
      const t=M.order[0];M.order[0]=M.order[1];M.order[1]=t;
    }
  }
  M.at=Date.now();
  pushState();musSync(true);
}
/* A follower that reaches the end of a track sits silent and polls until the
   owner moves the queue on, rather than looping what it already played. */
function audWaitForNext(){
  const M=mus();
  AUD.waitFrom=M.i;
  AUD.on=false;render();
  clearInterval(AUD.waitT);
  AUD.waitT=setInterval(()=>{
    if(!AUD.shared||musOwner()){clearInterval(AUD.waitT);return}
    pullState();
    if(mus().i!==AUD.waitFrom){clearInterval(AUD.waitT);musSync(true)}
  },1100);
}
/* Bring this machine's player in line with whatever the room says is playing. */
function musSync(force){
  const M=mus();
  audInit();
  if(!M.list.length||M.i<0){if(AUD.shared)audStop();AUD.shared=false;return}
  const track=M.list[M.order[M.i]!=null?M.order[M.i]:0];
  if(!track)return;
  const elapsed=Math.max(0,(Date.now()-(M.at||Date.now()))/1000);
  if(AUD.waitT&&M.i!==AUD.waitFrom){clearInterval(AUD.waitT);AUD.waitT=null}
  if(force||AUD.curUrl!==track.u||AUD.trackKey!==(M.i+"|"+M.at)){
    AUD.trackKey=M.i+"|"+M.at;
    AUD.curUrl=track.u;AUD.shared=true;AUD.now=track.n;
    AUD.el.src=trackSrc(track);AUD.el.volume=AUD.vol;
    AUD.el.addEventListener("loadedmetadata",function once(){
      AUD.el.removeEventListener("loadedmetadata",once);
      if(isFinite(AUD.el.duration)&&elapsed<AUD.el.duration-1){try{AUD.el.currentTime=elapsed}catch(e){}}
    });
    const pr=AUD.el.play();
    if(pr&&pr.catch)pr.catch(()=>{AUD.on=false;audArm();render()});
    AUD.on=true;render();
  }else if(AUD.on&&isFinite(AUD.el.duration)&&Math.abs(AUD.el.currentTime-elapsed)>4&&elapsed<AUD.el.duration-1){
    try{AUD.el.currentTime=elapsed}catch(e){}    // drifted, nudge back
  }
}

/* =====================================================================
   STORAGE
   In the Claude viewer, window.storage is provided for us. Hosted on a
   normal web server it is not, so online rooms need somewhere to live.
   Paste a Firebase Realtime Database URL into DB_URL below and rooms will
   sync through it. Leave it blank and everything still works, but only
   same-screen play and local saves.
   ===================================================================== */
const DB_URL = "https://shinobi-7c812-default-rtdb.firebaseio.com";

const HOSTED = (typeof window==="undefined") || !window.storage;
function dbKey(k){return String(k).replace(/[^A-Za-z0-9_-]+/g,"-")}
const STORE={
  ready(){ return !HOSTED || !!DB_URL },
  mode(){ return !HOSTED ? "viewer" : (DB_URL ? "database" : "offline") },
  async set(k,v,shared){
    if(!HOSTED) return window.storage.set(k,v,!!shared);
    if(shared){
      if(!DB_URL) throw new Error("no database configured");
      const r=await fetch(DB_URL.replace(/\/$/,"")+"/rooms/"+dbKey(k)+".json",
        {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({v:v,t:Date.now()})});
      if(!r.ok) throw new Error("write failed "+r.status);
      return {key:k,value:v,shared:true};
    }
    try{ localStorage.setItem("sc:"+dbKey(k), v) }catch(e){ throw e }
    return {key:k,value:v,shared:false};
  },
  async get(k,shared){
    if(!HOSTED) return window.storage.get(k,!!shared);
    if(shared){
      if(!DB_URL) throw new Error("no database configured");
      const r=await fetch(DB_URL.replace(/\/$/,"")+"/rooms/"+dbKey(k)+".json",{cache:"no-store"});
      if(!r.ok) throw new Error("read failed "+r.status);
      const j=await r.json();
      if(!j||j.v==null) throw new Error("empty");
      return {key:k,value:j.v,shared:true};
    }
    const v=localStorage.getItem("sc:"+dbKey(k));
    if(v==null) throw new Error("empty");
    return {key:k,value:v,shared:false};
  }
};

  const html=(V[S.screen]||viewTitle)();
  // polling calls this every couple of seconds; repainting identical markup
  // throws away focus, scroll position and any open dropdown
  if(html!==NET.lastHTML){NET.lastHTML=html;a.innerHTML=html}
  let veil="";
  if(S.joint&&S.joint.started&&jointInvolvesMe()) veil=viewJoint();
  else if(S.joint&&jointAsksMe()&&canAct()) veil=viewJointInvite();
  else if(S.field) veil=viewField();

  if(AUD.panel) veil=viewAudio();
  else if(NET.godAsk) veil=viewGodGate();
  else if(NET.godOpen) veil=viewGodPanel();
  // rebuild the overlay only when it actually changes, or a poll every couple
  // of seconds tears the open panel down and puts an identical one back
  const shown=document.querySelector(".veil");
  // rebuild when the markup changes, and also whenever the screen disagrees
  // with what should be there, so a stale panel can never be left behind
  if(veil!==NET.lastVeil||(!veil&&shown)||(veil&&!shown)){
    NET.lastVeil=veil;
    document.querySelectorAll(".veil").forEach(e=>e.remove());
    if(veil) document.body.insertAdjacentHTML("beforeend",veil);
  }
  const bl=document.getElementById("blog"); if(bl)bl.scrollTop=bl.scrollHeight;
  // the client that owns the turn rolls its own life event, so nothing waits on the other machine
  if(S.screen==="game"&&!locked())maybeExplain();
  if(S.screen==="game"&&!locked()&&canAct()){
    const p=me();
    if(p&&!p.dead&&p.evt&&!S.ended[mySeat()]){p.evt=false;
      setTimeout(()=>{if(!locked())rollEvent(p)},220)}
  }
}

function lookRow(label,opts,cur,key,swatch){

function lookStep(k,d,n){S.draft.look[k]=((S.draft.look[k]||0)+d+n)%n;render()}
function vBtn(k,d){const v=VILLAGES[k];return `<button class="pick ${d.village===k?"on":""}" onclick="S.draft.village='${k}';render()">
  <div style="display:flex;gap:9px;align-items:center">${emblem({village:k,rogue:false},30)}
  <span><span class="t">${esc(v.en)}</span><span class="s">${NATICON[v.nat]} ${esc(v.nat)}</span></span></div></button>`}

function confirmPlayer(){
  const d=S.draft;
  const seat=S.creating;
  const forced=forcedVillage(seat);
  const vil=forced||d.village;
  const p=buildPlayer(seat,d.name.trim()||("Shinobi "+(seat+1)),d.gender,vil,{look:d.look,anyClan:!!forced});
  p.team=teamForSeat(seat);
  p.migrated=!!forced&&!clanNativeTo(p.clan,vil);
  S.P.push(p); rollBeast(p);
  if(online()){
    // held by seat number, so two people filing at once cannot overwrite each other
    if(!S.pend)S.pend={};
    S.pend[seat]=p;
    S.P=S.P.filter(x=>x&&x.seat!==seat);          // this seat lives in pend until the room is full
    if(Object.keys(S.pend).length<seatsWanted()){
      S.screen="waiting";pushState();render();return;
    }
    assemble();
    if(S.mode==="duo"&&!S.pairingSet){S.screen="pairing";pushState();render();return}
    startGame();return;
  }
  if(S.P.length<seatsWanted()){
    S.creating=S.P.length;S.draft=newDraft();render();return;
  }
  if(S.mode==="duo"&&!S.pairingSet){S.screen="pairing";render();return}
  startGame();
}
/* Once every seat has filed, lay them out in seat order. */
function assemble(){
  if(!S.pend)return;
  const out=[];
  for(let i=0;i<seatsWanted();i++)if(S.pend[i])out.push(S.pend[i]);
  if(out.length===seatsWanted()){S.P=out;S.pend=null;S.claims=null}
}
function startGame(){
  S.screen="game";S.year=1;S.turn=0;
  S.ended=[];for(let i=0;i<NP();i++)S.ended.push(false);
  S.P.forEach(q=>{if(q.team==null)q.team=teamForSeat(q.seat)});
  S.P.forEach(p=>{
    p.ap=3;
    const c=clanOf(p);
    say(`${p.name} enrols at the ${vilOf(p).en} Academy. Blood says ${c.n==="No Clan"?"no clan at all":"the "+c.n+" clan"}, and the nature that comes with it is ${p.nat}.`,p.name,"big");
    if(p.migrated) say(`${p.name}'s parents moved to ${vilOf(p).en} before they were born. The ${c.n} name is not from here, and the neighbours have never quite stopped noticing.`,p.name);
    if(c.kg) say(`${c.n} carry ${KG[c.kg].n}. Nobody has awakened it in you yet.`,p.name);
    if(p.beast){const b=BEASTS[p.beast];say(`There is already a seal on ${p.name}. ${b.n}, the ${b.t}-tails. The village will not explain it for years.`,p.name,"bad")}
  });
  if(isSolo())say("One file, one life, and nobody to blame it on.","Registry","big");
  else if(S.mode==="duo")teamsList().forEach(t=>say(`${teamName(t)} are squadded together out of ${VILLAGES[S.P.find(q=>teamOf(q)===t).village].en}.`,"Registry","big"));
  else if(S.mode==="coop")say(`All ${NP()} of you are placed on the same squad out of ${vilOf(S.P[0]).en}. What happens to one file happens to the squad.`,"Registry","big");
  else say("The instructors log the rivalries on day one and start pairing you against each other on purpose.","Registry","big");
  save();touch();render();
}

/* ------------------------- MODAL PLUMBING ------------------------- */
function modal(tag,title,body,btns,forSeat){
  NET.pending={tag,title,body,btns,eventFor:forSeat};
  render();
}
function closeModal(){NET.pending=null;render();maybeAutoEnd()}
/* A modal open when the last action is spent used to swallow the auto-end,
   leaving the player to notice the year had quietly finished. */
function maybeAutoEnd(){
  if(locked())return;
  const p=me();
  if(!p||p.dead||p.ap>0||S.screen!=="game")return;
  if(online()&&S.ended[mySeat()])return;
  setTimeout(()=>{
    if(!locked()&&me()===p&&p.ap<=0&&S.screen==="game"&&!(online()&&S.ended[mySeat()]))endTurn();
  },420);
}
function viewModal(){
  const e=NET.pending;
  return `<div class="veil"><div class="modal">
    <div class="tag">${esc(e.tag)}</div>
    <h2>${esc(e.title)}</h2>
    <div style="font-size:15px;line-height:1.6">${e.body}</div>
    <div class="rule"></div>
    <div class="grid">${e.btns}</div>
  </div></div>`;
}
function spend(p,n,quiet){
  p.ap=Math.max(0,p.ap-n);
  if(!quiet)render();
  save();touch();
  if(p.ap===0&&!locked())setTimeout(()=>{
    if(me()===p&&p.ap===0&&!locked()&&!S.ended[mySeat()])endTurn();
  },500);
}
function wound(p,dmg,msg,cause){
  if(p.dead)return;
  const tough=1-clamp(p.health/280,0,.4);
  const d=Math.max(1,dmg*tough);
  p.cond=clamp(p.cond-d,0,100);
  if(msg)say(`${msg} Condition down ${d.toFixed(0)}, now ${Math.round(p.cond)}.`,p.name,"bad");
  if(p.cond<=0)kill(p,cause||"Died of wounds that did not close in time.");
}
function kill(p,cause){
  if(p.dead)return;
  p.dead=true;p.cause=cause;p.cond=0;
  say(`${p.name} is dead at ${p.age}. ${cause}`,p.name,"bad");
}

/* ------------------------- TRAIN ------------------------- */
function menuTrain(){
  const p=me();
  modal("Training ground","What are you drilling?",
    `<p class="dim">Gains slow down sharply as an attribute climbs. Study raises how fast everything else moves.</p>`,
    STATKEYS.map(([k,l])=>`<button class="act" onclick="doTrain('${k}')"><span class="ic">${statIcon(k)}</span>
      <span class="tx"><b>${l}</b><span>currently ${Math.round(p[k])} \u00b7 next gain about ${trainGain(p,k).toFixed(1)}</span></span></button>`).join("")
    +`<button onclick="closeModal()">Never mind</button>`,mySeat());
}
function statIcon(k){return {chakra:"\uD83D\uDD35",nin:"\uD83D\uDD25",tai:"\uD83D\uDC4A",gen:"\uD83C\uDF00",control:"\uD83C\uDFAF",intel:"\uD83D\uDCD6",health:"\u2764\uFE0F",speed:"\uD83D\uDCA8"}[k]||"\u2B50"}
function trainGain(p,k){
  const soft=Math.pow(1-clamp(p[k]/CAP,0,.97),1.7);
  let g=(3.5+p.intel*0.045)*soft*growthMult(p)*(p.village===(S.P[0]&&S.P[0].rank===6?S.P[0].village:null)||true?budget("aca"):1);
  if(k==="chakra")g*=1.1;
  if(p.rank>=4)g*=1.12;
  if(p.sage)g*=1.1;
  return Math.max(g,0.15);
}
function doTrain(k){
  const p=me();closeModal();
  const g=trainGain(p,k)*(0.75+Math.random()*0.5);
  bump(p,k,g);
  say(`Drilled ${STATKEYS.find(s=>s[0]===k)[1].toLowerCase()} until dark. Up ${g.toFixed(1)}.`,p.name,"good");
  if(chance(.10)){bump(p,k,rnd(2,4));say("Something clicked mid drill. The form feels different in your hands now.",p.name,"big")}
  spend(p,1);
}

/* ------------------------- MISSIONS ------------------------- */
function menuMission(){
  const p=me();
  const av=MISSIONS.filter(m=>p.rank>=m.min||p.rogue);
  modal("Mission desk","Pick a job",
    `<p class="dim">Judged against your power of <b class="gold">${power(p)}</b> plus renown. Taking a rank well above your grade can get you killed outright.</p>`,
    av.map(m=>{
      const odds=clamp(((power(p)+p.rep*0.4+45)-m.need)/90,0,1);
      return `<button class="act" onclick="doMission('${m.r}')"><span class="ic">${m.r}</span>
        <span class="tx"><b>${m.r}-rank \u00b7 \u00a5${m.pay}</b><span>needs about ${m.need} power \u00b7 rough odds ${Math.round(odds*100)}% \u00b7 danger ${Math.round(m.risk*100)}%</span></span></button>`;
    }).join("")+`<button onclick="closeModal()">Walk away</button>`,mySeat());
}
function doMission(r){
  const p=me();closeModal();
  if("BAS".indexOf(r)>=0&&!S.field){                 // the higher ranks are played out
    spend(p,1,true);startFieldMission(r);return;
  }
  const m=MISSIONS.find(x=>x.r===r),t=pick(m.t);
  p.missions++;
  if(S.order&&S.order.seat===p.seat&&r==="S")S.order=null;
  // two shinobi from different villages working the same year sometimes collide
  const o=S.P[1-p.seat];
  const theirs=S.missionYear?S.missionYear[1-p.seat]:null;
  S.missionYear=S.missionYear||{};S.missionYear[p.seat]=r;
  if(theirs&&o&&!o.dead&&o.village!==p.village&&(theirs===r||Math.abs("DCBAS".indexOf(theirs)-"DCBAS".indexOf(r))<=1)
     && p.rank>=1&&o.rank>=1&&duelLegal(p,o).ok&&chance(.28)){
    say(`Both files were working the same corridor. ${p.name} and ${o.name} are looking at each other over the same objective.`,"Registry","big");
    spend(p,1,true);startBattle(p,o,"contest",S.lethal?"lethal":"");return;
  }
  const ok=(power(p)*budget("def")+p.rep*0.4+rnd(-45,45))>=m.need*(S.war.on?1.15:1);
  if(ok){
    const pay=Math.round(m.pay*(1+p.rep/260)*budget("eco"));
    p.ryo+=pay;bump(p,"rep",m.rep);p.karma+=r==="S"?-1:1;
    STATKEYS.forEach(([k])=>{if(chance(.3))bump(p,k,rnd(0,1))});
    say(`${r}-rank cleared: ${t}. Paid ${pay} ryo.`,p.name,"good");
    if(isCoop())setBond(teamOf(p),bondOf(teamOf(p))+1);
    if(chance(m.risk*0.35))wound(p,rnd(4,9)+m.need*0.02,`Came back from the ${r}-rank cut up.`,`Died of wounds from a ${r}-rank mission.`);
  }else{
    say(`${r}-rank failed: ${t}. The client is not paying.`,p.name,"bad");
    bump(p,"rep",-m.rep*0.8);
    const guard=livingMates(p).filter(x=>x.bond>60);
    if(m.risk>=.30&&chance(m.risk*0.15*(S.war.on?1.6:1))){
      if(guard.length){const sv=pick(guard);sv.alive=false;
        say(`It should have killed you. ${sv.name} got there first and did not get back out.`,p.name,"bad");
        wound(p,rnd(10,20));lastGift(p,sv);}
      else{kill(p,`Killed on a ${r}-rank mission that was well above their grade.`);spend(p,1);return}
    }
    if(chance(.14)&&livingMates(p).length)casualty(p);
    if(chance(m.risk))wound(p,rnd(10,20)+m.need*0.03,"Injured badly enough to be carried home.",`Died of wounds from a ${r}-rank mission.`);
  }
  spend(p,1);
}

/* ------------------------- JUTSU ------------------------- */
function scrollFind(id){
  if(!S.house)return null;
  for(const h of S.house){const j=(h.scroll||[]).find(x=>x.id===id);if(j)return j}
  return null;
}
function jinfo(id){
  if(typeof id!=="string")return {n:"Unknown technique",nat:"None",d:"",cost:0,rk:9};
  if(id.indexOf("sage:")===0){const s=SAGES[id.slice(5)];return {n:s.art.n,nat:"None",d:"Sage art",cost:s.art.cost,rk:9}}
  if(id.indexOf("scroll:")===0){const j=scrollFind(id.slice(7));return j||{n:"A page torn from the family scroll",nat:"None",d:"",cost:0,rk:9}}
  return JUTSU[id]||{n:"Unknown technique",nat:"None",d:"",cost:0,rk:9};
}
function knownNatures(p){return ["None",p.nat].concat(p.sub?[p.sub]:[])}
function learnable(p){
  return Object.keys(JUTSU).filter(id=>!p.jutsu.includes(id)&&knownNatures(p).includes(JUTSU[id].nat)&&JUTSU[id].rk<=p.rank);
}
function menuJutsu(){
  const p=me();
  const list=learnable(p);
  let body=`<p class="dim">You can only study techniques in your own nature, one sub nature, and the shapes that need no nature at all.
    ${OPPOSITE[p.nat]?`Your nature is ${p.nat}, so ${OPPOSITE[p.nat]} is closed to you forever.`:`Earth has no polar opposite, so every sub nature is open to you.`}</p>`;
  let btns="";
  if(!p.sub&&p.rank>=1){
    const opts=NATURES.filter(n=>n!==p.nat&&n!==OPPOSITE[p.nat]);
    btns+=`<div class="ribbon c" style="margin:0 0 8px">Second nature not yet opened</div>`+
      opts.map(n=>`<button class="act bcy" onclick="openSub('${n}')"><span class="ic">${NATICON[n]}</span>
        <span class="tx"><b>Open ${n} as your sub nature</b><span>Permanent. Costs one action and a control check.</span></span></button>`).join("");
  }
  btns+=list.length?list.map(id=>{
    const j=JUTSU[id],odds=learnOdds(p,j);
    return `<button class="act" onclick="learnJutsu('${id}')"><span class="ic">${NATICON[j.nat]}</span>
      <span class="tx"><b>${esc(j.n)}</b><span>${esc(j.d)} \u00b7 ${j.cost} cp \u00b7 ${Math.round(odds*100)}% to learn</span></span></button>`;
  }).join(""):`<div class="note" style="margin-bottom:8px">Nothing new is open to you at this rank. Rank up, or open a sub nature.</div>`;
  body+=`<div class="rule"></div><div class="eyebrow">Known techniques</div><div style="margin-top:7px">${
    p.jutsu.map(id=>{const j=jinfo(id);return `<span class="chip ${j.nat==="None"?"":"c"}">${NATICON[j.nat]} ${esc(j.n)}</span>`}).join("")}</div>`;
  modal("Training ground","Jutsu study",body,btns+`<button onclick="closeModal()">Back</button>`,mySeat());
}
function learnOdds(p,j){
  return clamp(0.30+p.control*0.008+p.intel*0.005+p.nin*0.004-j.rk*0.07-j.mult*0.06,0.12,0.95);
}
function openSub(n){
  const p=me();closeModal();
  if(chance(clamp(0.35+p.control*0.009,0.3,0.92))){
    p.sub=n;bump(p,"nin",4);bump(p,"control",3);
    say(`Second nature opened: ${n}. The leaf finally split the way it was supposed to.`,p.name,"big");
  }else{
    bump(p,"control",2);
    say(`A season of ${n} exercises and nothing took. The chakra will not shape that way yet.`,p.name,"bad");
  }
  spend(p,1);
}
function learnJutsu(id){
  const p=me();closeModal();
  const j=JUTSU[id];
  if(chance(learnOdds(p,j))){
    p.jutsu.push(id);bump(p,"nin",2);bump(p,"control",1);
    say(`Learned ${j.n}. ${j.d}`,p.name,"big");
  }else{
    bump(p,"control",2);wound(p,rnd(2,7));
    say(`${j.n} did not take. You burned your hands and your pride.`,p.name,"bad");
  }
  spend(p,1);
}

/* ------------------------- BLOODLINE ------------------------- */
function kgOdds(p){
  const c=clanOf(p);
  const rare={legendary:.55,rare:.7,uncommon:.85,common:1}[c.rare]||1;
  return clamp((power(p)/900+p.control/220+p.rank*0.05+compBuff(p,"shrine")*0.05)*rare,0.05,0.78);
}
function kgLevelNeed(l){return [0,0,430,680,980,1350][l+1]||9999}
function kgMaxLvl(id){return id==="byakugan"?5:3}
function kgOddsFor(p,id){const c=CLANS[p.clan];const own=c.kg===id;
  const rare=own?({legendary:.55,rare:.7,uncommon:.85,common:1}[c.rare]||1):.55;
  return clamp((power(p)/900+p.control/220+p.rank*0.05+compBuff(p,"shrine")*0.05)*rare,0.04,0.78)}
function menuBloodline(){
  const p=me();
  const pot=potOf(p);
  if(!pot.length){modal("Clan","No bloodline on file",
    `<p>Your line carries nothing to awaken. That is not a dead end, it just means whatever you build is yours alone.</p>
     <p class="dim">Marry into a clan that has one and your children can inherit it.</p>`,
    `<button onclick="closeModal()">Back</button>`,mySeat());return}
  let body="",btns="";
  pot.forEach(id=>{
    const k=KG[id],lvl=kgLvlOf(p,id);
    body+=`<div class="card ${lvl?"pcard":""}" style="margin-bottom:9px"><span class="cap">${esc(k.tier)}</span>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <h3 style="margin:2px 0 4px">${esc(k.n)}</h3>
        <span class="chip ${lvl?"p":""}">${lvl?"Level "+lvl+" of 3":"Dormant"}</span></div>
      <div class="dim" style="font-size:13.5px">${esc(k.d)}</div>
      <div class="rule"></div>${kgBuffLines(k,Math.max(1,lvl))}</div>`;
    if(lvl===0){
      btns+=`<button class="act bpu" onclick="awakenKG('${id}')"><span class="ic">\uD83D\uDC41\uFE0F</span><span class="tx">
        <b>Force ${esc(k.n)} open</b><span>${Math.round(kgOddsFor(p,id)*100)}% this attempt \u00b7 one action \u00b7 failure hurts</span></span></button>`;
    }else if(lvl<kgMaxLvl(id)){
      const need=kgLevelNeed(lvl),can=power(p)>=need;
      btns+=`<button class="act bpu" onclick="trainKG('${id}')" ${can?"":"disabled"}><span class="ic">\u2B06\uFE0F</span><span class="tx">
        <b>${esc(k.n)} to level ${lvl+1}</b><span>${can?"Ready. One action.":"Needs about "+need+" power. You are at "+power(p)+"."}</span></span></button>`;
    }
  });
  if(kgsOf(p).length>1)body=`<div class="ribbon p">You carry ${kgsOf(p).length} bloodlines. Every passive stacks.</div>`+body;
  modal("Bloodline",pot.length>1?"Blood in your line":KG[pot[0]].n,body,btns+`<button onclick="closeModal()">Back</button>`,mySeat());
}
function kgBuffLines(k,l){
  const P=k.passive,out=[];
  const L={evade:"Evasion",acc:"Accuracy",pierce:"Ignores guard",regen:"Regenerates each turn",negate:"Chance to negate a hit",
    hp:"Extra vitality",cpregen:"Chakra returns each turn",leech:"Drains chakra on hit",burn:"Burn on hit",corrode:"Strips their defence",
    poison:"Poison on hit",shield:"Damage reduction",copy:"Copies their technique",natboost:"Nature damage"};
  Object.entries(P).forEach(([k2,v])=>out.push(`<div class="kv"><span>${L[k2]||k2}</span><span class="gr">+${Math.round(v*l*100)}%</span></div>`));
  out.push(`<div class="kv"><span>Battle technique</span><span class="pu">${esc(k.act.n)}</span></div>`);
  if(k.lvl3)out.push(`<div class="kv"><span>Level 3 technique</span><span class="pu">${esc(k.lvl3.n)}</span></div>`);
  return out.join("");
}
function awakenKG(id){
  const p=me();closeModal();
  const k=KG[id];
  if(chance(kgOddsFor(p,id))){
    addKG(p,id,1);bump(p,"rep",9);p.titles.push(k.n);
    const h=houseOf(p);if(h.blood.indexOf(id)<0)h.blood.push(id);

function sageOdds(p){
  if(!p.jutsu.includes("summon"))return 0;
  return clamp(0.04+p.control*0.006+p.chakra*0.0028+p.intel*0.0015+kgTotal(p)*0.025,0.04,0.85);
}
function menuSage(){
  const p=me();

  const body=`<p>Natural energy has to be drawn in and held perfectly still. Too much of it and you stop being flesh.</p>
   ${has?`<div class="ribbon ${odds>.6?"gr":odds>.35?"g":"r"}">${Math.round(odds*100)}% chance of success
     <small>Failure turns you to stone. That is death, and there is no saving throw.</small></div>`
   :`<div class="ribbon r">You need a summoning contract first.<small>Learn Summoning Jutsu at the training ground and come back.</small></div>`}
   <div class="grid g3" style="margin-top:8px">${Object.entries(SAGES).map(([id,s])=>
     `<div class="card" style="padding:11px"><b>${esc(s.n)}</b><div class="eyebrow" style="margin:3px 0 6px">${esc(s.mount)}</div>
      ${Object.entries(s.b).map(([k,v])=>`<div class="kv"><span>${STATKEYS.find(x=>x[0]===k)[1]}</span><span class="gr">+${v}</span></div>`).join("")}
      <div class="kv"><span>Sage art</span><span class="pu">${esc(s.art.n)}</span></div></div>`).join("")}</div>`;
  modal("Sage training","Sage Mode",body,
    (has?Object.keys(SAGES).map(id=>`<button class="act bgr" onclick="attemptSage('${id}')"><span class="ic">\uD83C\uDF3F</span>
      <span class="tx"><b>Attempt ${esc(SAGES[id].n)}</b><span>${SAGES[id].mount} \u00b7 two actions \u00b7 ${Math.round(odds*100)}% survival</span></span></button>`).join(""):"")
    +`<button onclick="closeModal()">Not yet</button>`,mySeat());

function attemptSage(id){
  const p=me();closeModal();
  const odds=sageOdds(p);

    p.sage=id;const s=SAGES[id];
    Object.entries(s.b).forEach(([k,v])=>bump(p,k,v));

function haveChild(p){
  const other=p.partner;
  const clan=chance(.5)?p.clan:other.clan;
  const nat=chance(.55)?p.nat:other.nat;
  // both sides of the family can pass a bloodline down. marry well and it stacks.
  const blood=[];
  const mine=potOf(p),theirs=CLANS[other.clan].kg?[CLANS[other.clan].kg]:[];
  mine.forEach(id=>{if(chance(kgLvlOf(p,id)?.85:.45))blood.push(id)});
  theirs.forEach(id=>{if(blood.indexOf(id)<0&&chance(.55))blood.push(id)});
  const kid={name:npcName(),clan,nat,village:p.village,age:0,blood:blood.slice(0,3)};
  p.kids.push(kid);
  const h=houseOf(p);blood.forEach(id=>{if(h.blood.indexOf(id)<0)h.blood.push(id)});
  say(`${p.name} and ${other.name} had a child. ${kid.name}, ${CLANS[clan].n} blood, ${nat} nature${
    blood.length?", and the line carries "+blood.map(id=>KG[id].n).join(" and "):""}.`,p.name,"big");
}

function doMeditate(){
  const p=me();
  bump(p,"control",rnd(1,4));bump(p,"chakra",rnd(1,3));
  if(p.beast){
    if(chance(.20+(p.karma<-10?.1:0))){
      p.bond=clamp(p.bond-rnd(3,8),0,100);wound(p,rnd(3,9));
      say(`The beast throws you out of your own head. You wake up outside the walls with torn knuckles.`,p.name,"bad");
      if(p.bond<12&&chance(.3))rampage(p);
    }else{
      const cap=bondCap(p);
      if(p.bond>=cap){
        bump(p,"control",2);
        say(`The seal will not open further. ${BEASTS[p.beast].n} has decided you are not senior enough to be trusted with more, and it is not wrong. Held at ${Math.round(p.bond)} of ${cap}.`,p.name,"bad");
      }else{
        const g=Math.min(rnd(1,4)+Math.round(p.control*.02),cap-p.bond);
        p.bond=clamp(p.bond+g,0,cap);
        say(`Sat in the water of the seal and did not look away. ${BEASTS[p.beast].n}'s bond up ${g}, now ${Math.round(p.bond)} of ${cap}.`,p.name,"good");
      }
    }
  }else say("Long silence, steady breathing, better control.",p.name,"good");
  spend(p,1);
}
function rampage(p){
  const t=rnd(1,Math.min(4,BEASTS[p.beast].t));
  bump(p,"rep",-12);p.karma-=6;wound(p,rnd(5,14));
  say(`${t} tails came out. People were hurt. Nobody in the village will meet your eyes for a season.`,p.name,"bad");
  if(isCoop())setBond(teamOf(p),bondOf(teamOf(p))-8);
}
function doClan(){
  const p=me(),c=clanOf(p);
  if(p.clan==="civilian"){
    bump(p,"tai",rnd(1,3));bump(p,"nin",rnd(1,3));bump(p,"intel",1);
    say("No clan hall to go to, so you copied a form out of the public archive and made it work anyway.",p.name,"good");
  }else{
    bump(p,pick(Object.keys(c.b)),rnd(2,5));
    say(`Drilled the ${c.n} forms under an elder who does not hand out praise.`,p.name,"good");
    const dorm=potOf(p).filter(id=>kgLvlOf(p,id)===0);
    if(dorm.length&&chance(.20)){
      const id=dorm[0];
      if(chance(kgOddsFor(p,id))){addKG(p,id,1);p.titles.push(KG[id].n);
        const h=houseOf(p);if(h.blood.indexOf(id)<0)h.blood.push(id);
        say(`${KG[id].n} awakened in the middle of a training form. ${KG[id].d}`,p.name,"big")}
    }
  }
  spend(p,1);
}

function transplant(p,id,forced){
  const rejectOdds=clamp(0.20+kgsOf(p).length*0.18-p.control*0.004,0.08,0.75);
  if(chance(rejectOdds)){
    wound(p,rnd(18,34),"The body would not take them.","Died on a back-room table with someone else's eyes in their head.");
    bump(p,"gen",-3);
    say(`The transplant rejected. You were blind for a month and it did not get better for a while after that.`,p.name,"bad");
    return false;
  }
  const had=kgLvlOf(p,id);
  addKG(p,id,Math.max(1,had));
  const h=houseOf(p);if(h.blood.indexOf(id)<0)h.blood.push(id);
  p.karma+=(EYEHUNTS[id]?EYEHUNTS[id].karma:-16);
  wound(p,rnd(10,20));
  if(!p.titles.includes("Eye Thief"))p.titles.push("Eye Thief");
  say(`The eyes took. ${KG[id].n}${had?" pushed higher":" opens in a face it was never grown for"}. Your reflection has stopped being reassuring.`,p.name,"big");
  return true;
}

function jointMission(){
  const a=me();
  const squad=[a].concat(liveMates(a));
  if(!S.coop.done)S.coop.done={};
  S.coop.done[S.year+":"+teamOf(a)]=true;
  const tier=a.rank>=4?"S":a.rank>=3?"A":a.rank>=2?"B":a.rank>=1?"C":"D";
  const m=MISSIONS.find(x=>x.r===tier);
  const combined=squad.reduce((x,q)=>x+power(q),0)+bondOf(teamOf(a))*2.2+rnd(-55,55);
  if(combined>=m.need*(1.05+0.7*squad.length)){
    const pay=Math.round(m.pay*1.5);
    squad.forEach(q=>{q.ryo+=pay;bump(q,"rep",m.rep*1.4);
      STATKEYS.forEach(([k])=>{if(chance(.5))bump(q,k,rnd(1,3))})});
    setBond(teamOf(a),bondOf(teamOf(a))+7);
    say(`Joint ${tier}-rank cleared by ${teamName(teamOf(a))}: ${pick(m.t)}. ${pay} ryo each.`,"Squad","big");
  }else{
    setBond(teamOf(a),bondOf(teamOf(a))-6);
    squad.forEach(q=>{bump(q,"rep",-3);wound(q,rnd(12,24),null,"Died on a joint mission the squad should not have accepted.")});
    say(`Joint ${tier}-rank went wrong. ${teamName(teamOf(a))} came home carried and the debrief was ugly.`,"Squad","bad");
  }
  spend(a,2);
}
